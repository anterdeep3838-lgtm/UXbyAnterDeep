    if (!reduce) setInterval(() => { if (uv && !uT) uset((ui + 1) % uxL.length); }, 3600); }

  // 27 learnings light in turn
  const leL = [...document.querySelectorAll('.le-list li')]; let lk = 0, lH = false;
  leL.forEach(l => { l.addEventListener('mouseenter', () => { lH = true; leL.forEach(x => x.classList.remove('on')); }); l.addEventListener('mouseleave', () => lH = false); });
  if (leL.length && !reduce) setInterval(() => { if (lH) return; leL.forEach(x => x.classList.remove('on')); leL[lk].classList.add('on'); lk = (lk + 1) % leL.length; }, 2200);

  // 28 closing: slow push-in
  const cz = document.getElementById('s29');
  if (cz) new IntersectionObserver(([e]) => cz.classList.toggle('in-view', e.isIntersecting), {threshold: .3}).observe(cz);

  // progress
  const prog = document.getElementById('prog');
  const onScroll = () => { const h = document.documentElement; prog.style.transform = `scaleX(${h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight)})`; };
  addEventListener('scroll', onScroll, {passive: true}); onScroll();
})();
</script>

(()=>{if(!('IntersectionObserver' in window))return;const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('zz',!e.isIntersecting)),{rootMargin:'200px 0px'});document.querySelectorAll('section').forEach(s=>io.observe(s));})();</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Outpace Case Study</title>
<meta name="description" content="Outpace: UX/UI case study of a sports equipment and accessories store by Anterdeep Singh.">
<style>
@font-face{font-family:"BarlowC";src:url(outpace/barlowcondensed-i900.woff2) format("woff2");font-weight:900;font-style:italic;font-display:swap}
@font-face{font-family:"BarlowC";src:url(outpace/barlowcondensed-i800.woff2) format("woff2");font-weight:800;font-style:italic;font-display:swap}
@font-face{font-family:"BarlowC";src:url(outpace/barlowcondensed-i700.woff2) format("woff2");font-weight:700;font-style:italic;font-display:swap}
@font-face{font-family:"BarlowC";src:url(outpace/barlowcondensed-n800.woff2) format("woff2");font-weight:800;font-style:normal;font-display:swap}
@font-face{font-family:"BarlowC";src:url(outpace/barlowcondensed-n700.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"BarlowC";src:url(outpace/barlowcondensed-n600.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"BarlowC";src:url(outpace/barlowcondensed-n500.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"ArchivoV";src:url(outpace/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:swap}
@font-face{font-family:"InterT";src:url(outpace/intertight.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}

:root{
  color-scheme:dark;
  --ink:#0b0807;--ink1:#110b09;--ink2:#18100d;--ink3:#221713;
  --line:rgba(255,236,224,.10);--line2:rgba(255,236,224,.18);
  --bone:#f6efe9;--bone2:#ddd2ca;--ash:#b9ada6;--ash2:#8e817b;
  --ember:#ff5a1f;--ember2:#ff7a2e;--flare:#ff9a3c;--sun:#ffc272;--blood:#b3200e;--char:#3a0d05;
  --g-ember:linear-gradient(135deg,#ffa047 0%,#ff5a1f 42%,#c8270c 100%);
  --g-speed:linear-gradient(100deg,#1a0503 0%,#6e1406 26%,#d33a0f 55%,#ff7a2e 78%,#ffc272 100%);
  --fd:"BarlowC","Barlow Condensed","Arial Narrow",sans-serif;   /* display: condensed italic */
  --fw:"ArchivoV","Archivo","Arial Black",sans-serif;            /* section titles: expanded */
  --fb:"InterT","Inter Tight",ui-sans-serif,system-ui,sans-serif;/* body */
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--fb);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}ul,ol{padding:0;list-style:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--flare);outline-offset:4px;border-radius:6px}
::selection{background:var(--ember);color:#160604}
.ic{width:1em;height:1em;flex:none}

/* deck: fixed 1600 canvas, scaled to viewport */
.deck{width:1600px;margin:0 auto;zoom:var(--k,1);background:var(--ink)}
.sl{position:relative;width:1600px;min-height:1000px;overflow:hidden;isolation:isolate;padding:64px 100px 96px;background:var(--ink)}
.sl.alt{background:var(--ink1)}
/* film grain */
.grain{pointer-events:none;position:fixed;inset:0;z-index:90;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.progress{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--g-speed);z-index:60}

/* slide top rail: lap marker */
.tb{position:relative;display:flex;align-items:center;gap:18px;font:600 15px/1 var(--fw);font-stretch:118%;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);margin-bottom:46px}
.tb .no{font:900 italic 30px/1 var(--fd);letter-spacing:0;color:var(--ember)}
.tb .ln{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 14px,transparent 14px 22px)}
.tb .ln i{display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--g-ember);transform-origin:0 50%;transform:scaleX(0);transition:transform 1.4s var(--ease) .2s}
.tb.in .ln i{transform:scaleX(1)}
.tb .pg{font:700 italic 22px/1 var(--fd);letter-spacing:.02em;color:var(--bone2)}

/* type roles */
.dsp{font-family:var(--fd);font-style:italic;font-weight:900;text-transform:uppercase;line-height:.86;letter-spacing:-.005em}
.wide{font-family:var(--fw);font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.95}
.eb{display:inline-flex;align-items:center;gap:12px;font:650 14px/1 var(--fw);font-stretch:118%;letter-spacing:.18em;text-transform:uppercase;color:var(--ash)}
.eb::before{content:"";width:26px;height:3px;background:var(--g-ember);transform:skewX(-30deg)}
.fire{background:linear-gradient(100deg,#ff4d1a 0%,#ff7a2e 35%,#ffb257 62%,#ff7a2e 85%,#f04a18 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fireShift 6s ease-in-out infinite alternate}
@keyframes fireShift{to{background-position:100% 0}}
.lead{font-size:23px;line-height:1.5;color:var(--bone2);max-width:40ch}
.body{font-size:19px;line-height:1.6;color:var(--bone2)}
.muted{color:var(--ash)}

/* photo frame: mockups */
.ph{position:relative;overflow:hidden;border-radius:26px;background:#140d0b}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.ph::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,236,224,.08);pointer-events:none}

/* reveal */
.js .r{opacity:0;transform:translateY(34px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.js .r.in{opacity:1;transform:none}
.js .rx{opacity:0;transform:translateX(-60px) skewX(-6deg);filter:blur(8px);transition:opacity .9s var(--ease),transform 1s var(--ease),filter .9s;transition-delay:var(--d,0s)}
.js .rx.in{opacity:1;transform:none;filter:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

.next{width:1600px;margin:0 auto;padding:70px 100px 120px;background:var(--ink1);border-top:1px solid var(--line);font-size:20px;color:var(--bone2);zoom:var(--k,1)}
</style>
</head>
<body class="js">
<div class="progress" id="prog"></div>
<div class="grain" aria-hidden="true"></div>
<main class="deck" id="deck">

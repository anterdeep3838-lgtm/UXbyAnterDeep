/* ───────── Phase 6: order model — statuses, units, eligibility, sample orders ─────────
   Everything here is demo data kept in this browser. */
const O_STEPS = ['Confirmed','Packed','Shipped','Out for delivery','Delivered'];
const R_STEPS = { pickup:['Requested','Pickup scheduled','Picked up','Quality check','Refund initiated','Refunded'], dropoff:['Requested','Awaiting drop-off','Dropped off','Quality check','Refund initiated','Refunded'] };
const X_STEPS = { pickup:['Requested','Pickup scheduled','Picked up','Quality check','Exchange shipped','Exchange delivered'], dropoff:['Requested','Awaiting drop-off','Dropped off','Quality check','Exchange shipped','Exchange delivered'] };
const CANCEL_REASONS = ['Ordered by mistake','Found a better price','Delivery date is too late','Want to change size or colour','Changed my mind','Other'];
const RETURN_REASONS = ['Size too small','Size too large','Not as described','Arrived damaged or defective','Wrong item delivered','Quality not as expected','No longer needed'];
const DAY = 864e5;
const daysAgo = (n, h=10) => { const d = new Date(Date.now() - n*DAY); d.setHours(h, (n*17)%60, 0, 0); return d.toISOString(); };
const fmtDT = iso => new Date(iso).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' });
const fmtDay = iso => new Date(iso).toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });
const fmtLong = iso => new Date(iso).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
const EVENT_NOTE = { Confirmed:'Order placed and payment confirmed', Packed:'Packed at Outpace fulfilment centre, Bhiwandi', Shipped:'Handed to courier · in transit', 'Out for delivery':'With delivery partner, arriving today', Delivered:'Delivered and signed for', Cancelled:'Order cancelled' };

const myOrders = () => State.user ? State.orders.filter(o => o.user === State.user.email).sort((a,b) => b.at.localeCompare(a.at)) : [];
const orderById = id => State.orders.find(o => o.id === id && State.user && o.user === State.user.email);
function stageOf(o){ if(o.status === 'Cancelled') return -1; return Math.max(0, O_STEPS.indexOf(o.status)); }
function ensureEvents(o){ if(!o.events) o.events = [{ s:'Confirmed', at:o.at }]; return o.events; }

/* every returnable/cancellable unit in an order: product lines and each item inside a kit */
function unitsOf(o){
  const u = [];
  o.lines.forEach(l => {
    if(l.kit){ l.kit.items.forEach(i => { const p = productById(i.id); if(p) u.push({ key:`${l.id}:${i.id}`, id:i.id, v:i.v, qty:1, p, price:p.price, kit:kitName(l.kit) }); }); }
    else { const p = productById(l.id); if(p) u.push({ key:`${l.id}|${l.variant||''}`, id:l.id, v:l.variant, qty:l.qty, p, price:p.price }); }
  });
  return u;
}
const windowDays = () => 7;
const deliveredAt = o => (ensureEvents(o).find(e => e.s === 'Delivered') || {}).at;
function unitStatus(o, u){
  if(o.status === 'Cancelled' || (o.cancel && o.cancel.keys && o.cancel.keys.includes(u.key))) return { k:'cancelled', l:'Cancelled' };
  const r = (o.returns||[]).find(r => r.units.some(x => x.key === u.key));
  if(r){ const steps = (r.kind==='exchange' ? X_STEPS : R_STEPS)[r.method]; const last = steps[steps.length-1];
    return r.status === last ? { k:'done', l: r.kind==='exchange' ? 'Exchanged' : 'Returned · refunded', r } : { k:'ret', l:`${r.kind==='exchange'?'Exchange':'Return'}: ${r.status}`, r }; }
  return null;
}
function returnInfo(o, u){
  const d = deliveredAt(o); if(!d) return { ok:false, why:'Returns open once the order is delivered.' };
  const by = new Date(new Date(d).getTime() + windowDays(u.p)*DAY), left = Math.ceil((by - Date.now())/DAY);
  if(unitStatus(o, u)) return { ok:false, why:'' };
  return left >= 0 ? { ok:true, by, left, why:`Return or exchange by ${fmtDay(by.toISOString())}` } : { ok:false, by, why:`Return window closed on ${fmtDay(by.toISOString())}` };
}
const canCancel = o => o.status !== 'Cancelled' && stageOf(o) <= 1 && unitsOf(o).some(u => !unitStatus(o, u));
const canReturn = o => unitsOf(o).some(u => returnInfo(o, u).ok);
function orderPill(o){
  if(o.status === 'Cancelled') return `<span class="opill x">${icon('close')}Cancelled</span>`;
  const act = (o.returns||[]).find(r => { const st = (r.kind==='exchange'?X_STEPS:R_STEPS)[r.method]; return r.status !== st[st.length-1]; });
  if(act) return `<span class="opill r">${icon('arrowL')}${act.kind==='exchange'?'Exchange':'Return'} in progress</span>`;
  if(o.status === 'Delivered') return `<span class="opill ok">${icon('check')}Delivered ${fmtDay(deliveredAt(o))}</span>`;
  return `<span class="opill go">${icon('truck')}${o.status}${o.status!=='Out for delivery' ? ` · arriving ${o.eta}` : ''}</span>`;
}
function refundTarget(o){ return o.payType === 'cod' ? null : o.pay; }

/* demo control: move an order (or a return) one step forward */
function advanceOrder(o){
  ensureEvents(o); const i = stageOf(o); if(i < 0 || i >= O_STEPS.length-1) return;

function advanceReturn(r){

  r.status = st[i+1]; r.events.push({ s:r.status, at:new Date().toISOString() }); State.emit();
}

    <p class="ret-meta">${r.method==='pickup' ? `${icon('truck')}Courier pickup ${esc(r.slot||'')}` : `${icon('pin')}Drop-off at ${esc(r.point||'')}`}${r.kind==='return' ? ` · Refund ${inr(r.amount)} to ${esc(r.refundTo)}` : ''}</p>
    ${!done && i<=1 ? `<p class="kr-fine">Keep the item unused with tags and in its original box. ${r.method==='pickup'?'The courier will check it at your door.':'Show the QR code from your email at the counter.'}</p>` : ''}</section>`;
}

/* ── cancel sheet ── */
function cancelSheet(o, after){
  const units = unitsOf(o).filter(u => !unitStatus(o, u));
  const opener = document.activeElement;
  const host = h(`<div class="sheet on" role="dialog" aria-modal="true" aria-labelledby="cx-t"><div class="sheet-scrim" data-x></div><div class="sheet-panel cx">
    <div class="cx-head"><div><span class="mono">Cancel</span><h2 id="cx-t">Cancel ${units.length>1?'items':'this order'}</h2></div><button class="icon-btn" data-x aria-label="Close">${icon('close')}</button></div>
    ${units.length>1 ? `<p class="sheet-q">Choose what to cancel. Everything is selected.</p><ul class="cx-list">${units.map(u=>`<li><label class="ck-line"><input type="checkbox" value="${esc(u.key)}" checked><span class="bx" aria-hidden="true">${icon('check')}</span><img src="${IMG(u.p.img)}" alt=""><span>${esc(u.p.name)}${u.v?` · ${esc(u.v)}`:''}<small>${inr(u.price*u.qty)}</small></span></label></li>`).join('')}</ul>` : ''}
    <div class="fld" id="f-cx-r"><label>Reason for cancelling</label>${ddHTML({ id:'cx-r', label:'Reason', placeholder:'Choose a reason', options:CANCEL_REASONS.map(r=>({ v:r, l:r })) })}<p class="fld-e" id="cx-r-e" role="alert" hidden></p></div>
    <div class="cx-ref" id="cx-ref"></div>
    <p class="sheet-err" role="alert" hidden></p>
    <div class="sheet-foot"><button class="btn btn-glass" type="button" data-x>Keep order</button><button class="btn btn-fire" type="button" data-ok><span>Cancel ${units.length>1?'selected items':'order'}</span></button></div></div></div>`);
  document.body.appendChild(host); document.body.style.overflow = 'hidden';
  const sel = () => units.length>1 ? $$('.cx-list input:checked', host).map(i=>i.value) : units.map(u=>u.key);
  const amt = () => { const k = sel(), all = k.length === units.length; return unitsOf(o).filter(u=>k.includes(u.key)).reduce((a,u)=>a+u.price*u.qty,0) + (all ? o.ship : 0); };
  const drawRef = () => { const a = amt(), to = refundTarget(o); $('#cx-ref', host).innerHTML = sel().length ? (to ? `${icon('info')}<span><b>${inr(a)}</b> will be refunded to ${esc(to)} within 5–7 working days.</span>` : `${icon('info')}<span>This is a cash-on-delivery order, so there’s nothing to refund. The ${sel().length===units.length?'order':'items'} won’t be delivered.</span>`) : ''; };
  host.addEventListener('change', drawRef); drawRef();
  const close = () => { host.remove(); document.body.style.overflow=''; untrap(); opener && opener.focus && opener.focus(); };
  const untrap = trap(host, close);
  host.addEventListener('click', async e => {
    if(e.target.closest('[data-x]')){ close(); return; }
    const ok = e.target.closest('[data-ok]'); if(!ok) return;
    const k = sel(), r = $('#cx-r', host).dataset.value, err = $('.sheet-err', host), re = $('#cx-r-e', host); err.hidden = true; re.hidden = true; $('#f-cx-r', host).classList.remove('bad');
    if(!k.length){ err.hidden = false; err.textContent = 'Select at least one item to cancel.'; return; }
    if(!r){ re.hidden = false; re.textContent = 'Choose a reason so we can improve.'; $('#f-cx-r', host).classList.add('bad'); $('#cx-r .dd-b', host).focus(); return; }
    ok.disabled = true; ok.classList.add('loading'); $('span', ok).textContent = 'Cancelling…'; await new Promise(r=>setTimeout(r, 900));
    const all = k.length === units.length, now = new Date().toISOString(), to = refundTarget(o), a = amt();
    o.cancel = { at:now, reason:r, keys: all ? 'all' : [ ...(Array.isArray(o.cancel?.keys) ? o.cancel.keys : []), ...k ], refund: to ? { amount:a, to, status:'Refund initiated', at:now } : null };
    if(all){ o.status = 'Cancelled'; ensureEvents(o).push({ s:'Cancelled', at:now }); }
    State.emit(); close(); after(); toast(all ? `Order ${o.id} cancelled` : `${k.length} item${k.length>1?'s':''} cancelled`); announce('Cancellation confirmed');
  });
  setTimeout(() => $('#cx-r .dd-b', host)?.focus(), 60);
}

/* ── return / exchange flow ── */
function returnFlow(p){
  if(needAuth(`/account/orders/${p.id}/return`)) return h('<div class="pg"></div>');
  const o = orderById(p.id);
  if(!o || !canReturn(o)) return accShell('/account/returns', 'Return not available', 'Returns', `<div class="d-empty"><span class="d-empty-ic">${icon('info')}</span><b>${o ? 'Nothing in this order can be returned right now' : 'Order not found'}</b><p>${o ? 'Items can be returned within 7 days of delivery, and only once.' : 'Check the order number and try again.'}</p><div class="d-empty-cta"><a class="btn btn-fire" href="#/account/orders${o?'/'+o.id:''}">Back to order</a></div></div>`);
  const units = unitsOf(o).filter(u => returnInfo(o, u).ok);
  const R = { step:0, pick:{}, reason:{}, kind:{}, exch:{}, method:'pickup', slot:null, point:null, addr:(State.addresses.find(a=>a.def)||{}).id || null, cond:false, refund:o.payType==='cod' ? 'upi' : 'original', upi:'', bank:{} };
  const STEPS = ['Items','Return or exchange','Pickup','Refund','Review'];
  const el = accShell('/account/returns', 'Return or exchange', `Order ${o.id}`, `<ol class="ck-steps rf-steps" id="rf-steps"></ol><div class="rf-wrap" id="rf"></div>`, [['Home','#/'],['Account','#/account'],['Orders','#/account/orders'],[o.id,`#/account/orders/${o.id}`],['Return','']]);
  const host = $('#rf', el);
  const chosen = () => units.filter(u => R.pick[u.key]);
  const slots = [1,2,3].map(n => fmtDay(new Date(Date.now()+n*DAY).toISOString()));
  const POINTS = [['Outpace partner point · Sports Hub','1.2 km · open 10 am – 9 pm'],['Courier counter · Main Road','2.4 km · open 9 am – 7 pm'],['Locker bank · Metro station','3.1 km · open 24 hours']];
  const altSizes = u => (u.p.opt && u.p.opt.sizes) ? u.p.opt.values.filter(v => !v.out && v.v !== u.v).map(v=>v.v) : [];
  const amount = () => chosen().filter(u => R.kind[u.key] !== 'exchange').reduce((a,u)=>a+u.price*(R.pick[u.key]||1),0);
  function drawSteps(){ $('#rf-steps', el).innerHTML = STEPS.map((l,i)=>`<li class="${i<R.step?'d':i===R.step?'c':''}"><span>${i<R.step?icon('check'):i+1}</span>${l}</li>`).join(''); }
  function body(){
    if(R.step===0) return `<h2>What are you returning?</h2><p class="muted">Kit items can be returned one at a time.</p>
      <ul class="rf-items">${units.map(u=>{ const on = !!R.pick[u.key], ri = returnInfo(o,u); return `<li class="${on?'on':''}"><label class="ck-line"><input type="checkbox" data-pick="${esc(u.key)}" ${on?'checked':''}><span class="bx" aria-hidden="true">${icon('check')}</span></label>
        <span class="kr-img"><img src="${IMG(u.p.img)}" alt=""></span><div><b>${esc(u.p.name)}</b><small>${u.v?esc(u.v)+' · ':''}${inr(u.price)}${u.kit?` · from ${esc(u.kit)}`:''} · ${ri.left} day${ri.left!==1?'s':''} left</small>
        ${on ? `<div class="rf-row">${u.qty>1?`<div class="qty qty-sm" role="group" aria-label="Quantity to return"><button type="button" class="qty-b" data-rq="-1" data-k="${esc(u.key)}" ${R.pick[u.key]<=1?'disabled':''}>${icon('minus')}</button><output class="qty-v">${R.pick[u.key]}</output><button type="button" class="qty-b" data-rq="1" data-k="${esc(u.key)}" ${R.pick[u.key]>=u.qty?'disabled':''}>${icon('plus')}</button></div>`:''}
          <div class="fld" id="f-rs-${u.key.replace(/[^a-z0-9]/gi,'')}">${ddHTML({ id:'rs-'+u.key.replace(/[^a-z0-9]/gi,''), label:'Reason for '+u.p.name, value:R.reason[u.key], placeholder:'Why are you returning it?', attrs:`data-reason="${esc(u.key)}"`, options:RETURN_REASONS.map(r=>({ v:r, l:r })) })}</div></div>` : ''}</div></li>`; }).join('')}</ul>
      <label class="ck-line rf-cond"><input type="checkbox" id="rf-cond" ${R.cond?'checked':''}><span class="bx" aria-hidden="true">${icon('check')}</span><span>The items are unused, with tags, in their original packaging. Protective gear must have hygiene seals intact.</span></label>`;
    if(R.step===1) return `<h2>Refund or exchange?</h2><p class="muted">Exchanges are for a different size of the same product, subject to stock.</p>
      <ul class="rf-items">${chosen().map(u=>{ const alt = altSizes(u), k = R.kind[u.key] || 'return'; return `<li class="on"><span class="kr-img"><img src="${IMG(u.p.img)}" alt=""></span><div><b>${esc(u.p.name)}</b><small>${u.v?esc(u.v)+' · ':''}${esc(R.reason[u.key])}</small>
        <div class="seg rf-seg" role="radiogroup" aria-label="Refund or exchange"><button type="button" role="radio" aria-checked="${k==='return'}" data-kind="return" data-k="${esc(u.key)}">Refund</button><button type="button" role="radio" aria-checked="${k==='exchange'}" data-kind="exchange" data-k="${esc(u.key)}" ${alt.length?'':'disabled title="No other sizes in stock"'}>Exchange size</button></div>
        ${k==='exchange' ? `<div class="rf-row">${ddHTML({ id:'ex-'+u.key.replace(/[^a-z0-9]/gi,''), label:'New size', value:R.exch[u.key], placeholder:'Choose new size', attrs:`data-exch="${esc(u.key)}"`, options:alt.map(v=>({ v, l:v, note:'In stock' })) })}</div>` : !alt.length && u.p.opt?.sizes ? '<small class="muted">No other sizes in stock, so this can only be refunded.</small>' : ''}</div></li>`; }).join('')}</ul>`;
    if(R.step===2){ const ad = State.addresses.length ? State.addresses : [o.addr];
      return `<h2>Courier pickup</h2><p class="muted">Free pickup from your address. Choose where and when the courier should come.</p>
      ${R.method==='pickup' ? `<h3 class="rf-h3">Pickup address</h3><div class="ad-list">${ad.map(a=>`<label class="ad ${ (R.addr||ad[0].id)===a.id?'on':''}"><input type="radio" name="ra" value="${a.id}" ${(R.addr||ad[0].id)===a.id?'checked':''}><span class="ad-r"></span><span class="ad-t"><b>${esc(a.name)} <em>${a.type||'Home'}</em></b><span>${esc(a.line1)}, ${esc(a.city)} ${a.pin}</span></span></label>`).join('')}</div>
        <h3 class="rf-h3">Pickup slot</h3><div class="slot-grid" role="radiogroup" aria-label="Pickup slot">${slots.flatMap(d=>['10 am – 2 pm','2 pm – 6 pm'].map(t=>`<button type="button" role="radio" class="slot ${R.slot===d+' · '+t?'on':''}" aria-checked="${R.slot===d+' · '+t}" data-slot="${d} · ${t}"><b>${d}</b><small>${t}</small></button>`)).join('')}</div>`
      : `<h3 class="rf-h3">Choose a drop-off point</h3><div class="dm-list">${POINTS.map(([n,d])=>`<label class="dm ${R.point===n?'on':''}"><input type="radio" name="rp" value="${esc(n)}" ${R.point===n?'checked':''}><span class="ad-r"></span><span class="dm-t"><b>${n}</b><span>${d}</span></span></label>`).join('')}</div>`}`; }
    if(R.step===3){ const a = amount();
      if(!a) return `<h2>No refund needed</h2><p class="muted">Everything here is an exchange, so there’s no refund. We’ll ship your new size once the original passes a quick check.</p>`;
      if(o.payType !== 'cod') return `<h2>Your refund</h2><div class="rf-box">${icon('card')}<div><b>${inr(a)} back to ${esc(o.pay)}</b><small>Refunds go to the original payment method. UPI refunds usually land within 24 hours; cards and netbanking in 5–7 working days after the quality check.</small></div></div>`;
      return `<h2>Where should we send ${inr(a)}?</h2><p class="muted">This order was paid by cash on delivery, so we’ll refund to your UPI ID or bank account.</p>
        <div class="seg" role="radiogroup" aria-label="Refund method"><button type="button" role="radio" aria-checked="${R.refund==='upi'}" data-rfm="upi">UPI ID</button><button type="button" role="radio" aria-checked="${R.refund==='bank'}" data-rfm="bank">Bank account</button></div>
        ${R.refund==='upi' ? `<div class="ad-grid">${field({ id:'rf-upi', label:'UPI ID', value:R.upi, hint:'Like name@okbank' })}</div>`
        : `<div class="ad-grid">${field({ id:'rf-name', label:'Account holder name', value:R.bank.name||State.user.name })}${field({ id:'rf-ifsc', label:'IFSC code', value:R.bank.ifsc||'', extra:'maxlength="11"', hint:'11 characters, like HDFC0001234' })}${field({ id:'rf-acc', label:'Account number', type:'password', mode:'numeric', value:R.bank.acc||'', extra:'maxlength="18"' })}${field({ id:'rf-acc2', label:'Confirm account number', mode:'numeric', value:R.bank.acc||'', extra:'maxlength="18"' })}</div>`}`; }
    const a = amount(), ad = (State.addresses.find(x=>x.id===R.addr) || o.addr);
    return `<h2>Check and confirm</h2><ul class="rf-items rv-items">${chosen().map(u=>`<li class="on"><span class="kr-img"><img src="${IMG(u.p.img)}" alt=""></span><div><b>${esc(u.p.name)}</b><small>${R.kind[u.key]==='exchange'?`Exchange ${esc(u.v)} → ${esc(R.exch[u.key])}`:`Refund ${inr(u.price*(R.pick[u.key]||1))}`} · ${esc(R.reason[u.key])}</small></div></li>`).join('')}</ul>
      <div class="rv-grid"><div><span>${icon(R.method==='pickup'?'truck':'pin')}Collection</span><b>${R.method==='pickup' ? `Pickup ${esc(R.slot)}` : esc(R.point)}</b>${R.method==='pickup'?`<small>${esc(ad.line1)}, ${esc(ad.city)} ${ad.pin}</small>`:''}</div>
        <div><span>${icon('card')}Refund</span><b>${a ? inr(a) : 'No refund (exchange)'}</b><small>${a ? (o.payType==='cod' ? (R.refund==='upi' ? `To UPI ${esc(R.upi)}` : `To account ending ${R.bank.acc.slice(-4)}`) : `To ${esc(o.pay)}`) : ''}</small></div></div>`;
  }
  function draw(){ drawSteps(); host.innerHTML = `<div class="rf-card">${body()}<p class="sheet-err" role="alert" hidden></p><div class="rf-foot">${R.step?'<button type="button" class="kq-back" data-back>Back</button>':`<a class="kq-back" href="#/account/orders/${o.id}">Cancel</a>`}<button type="button" class="btn btn-fire" data-next><span>${R.step===4?'Submit request':'Continue'}</span>${icon('arrow')}</button></div></div>`; }
  const err = m => { const e = $('.sheet-err', host); e.hidden = !m; e.textContent = m || ''; if(m) e.scrollIntoView({ block:'center', behavior:'smooth' }); };
  host.addEventListener('click', async e => {
    const pk = e.target.closest('[data-pick]'); if(pk){ const k = pk.dataset.pick; if(pk.checked) R.pick[k] = 1; else delete R.pick[k]; draw(); return; }
    const rq = e.target.closest('[data-rq]'); if(rq){ const u = units.find(x=>x.key===rq.dataset.k); R.pick[u.key] = Math.max(1, Math.min(u.qty, R.pick[u.key] + +rq.dataset.rq)); draw(); return; }
    const kd = e.target.closest('[data-kind]'); if(kd && !kd.disabled){ R.kind[kd.dataset.k] = kd.dataset.kind; draw(); return; }
    const sl = e.target.closest('[data-slot]'); if(sl){ R.slot = sl.dataset.slot; draw(); return; }
    const rfm = e.target.closest('[data-rfm]'); if(rfm){ R.refund = rfm.dataset.rfm; draw(); return; }
    if(e.target.closest('[data-back]')){ R.step--; if(R.step===1 && !chosen().some(u=>altSizes(u).length)) R.step--; draw(); return; }
    if(!e.target.closest('[data-next]')) return;
    err('');
    if(R.step===0){ R.cond = $('#rf-cond', host).checked;
      if(!chosen().length) return err('Select at least one item to return.');
      const miss = chosen().find(u => !R.reason[u.key]); if(miss) return err(`Choose a reason for ${miss.p.name}.`);
      if(!R.cond) return err('Confirm the items are unused, with tags and in their original packaging.');
      R.step = chosen().some(u => altSizes(u).length) ? 1 : 2; draw(); return; }
    if(R.step===1){ const miss = chosen().find(u => R.kind[u.key]==='exchange' && !R.exch[u.key]); if(miss) return err(`Choose the new size for ${miss.p.name}.`); R.step = 2; draw(); return; }
    if(R.step===2){ if(R.method==='pickup' && !R.slot) return err('Choose a pickup slot.'); if(R.method==='dropoff' && !R.point) return err('Choose a drop-off point.');
      if(R.method==='pickup' && !R.addr) R.addr = (State.addresses[0]||o.addr).id; R.step = 3; draw(); return; }
    if(R.step===3){
      if(amount() && o.payType==='cod'){
        if(R.refund==='upi'){ R.upi = $('#rf-upi', host).value.trim(); setErr(host,'rf-upi',''); if(!/^[\w.-]{2,}@[a-z]{2,}$/i.test(R.upi)){ setErr(host,'rf-upi', R.upi ? 'Enter a UPI ID like name@okbank.' : 'Enter your UPI ID.'); $('#rf-upi', host).focus(); return; } }
        else { const g = i => $('#'+i, host).value.trim(); ['rf-name','rf-ifsc','rf-acc','rf-acc2'].forEach(i=>setErr(host,i,''));
          const b = { name:g('rf-name'), ifsc:g('rf-ifsc').toUpperCase(), acc:g('rf-acc'), acc2:g('rf-acc2') };
          if(b.name.length<2) setErr(host,'rf-name','Enter the account holder’s name.');
          if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(b.ifsc)) setErr(host,'rf-ifsc', b.ifsc ? 'IFSC is 4 letters, a zero, then 6 letters or numbers.' : 'Enter the IFSC code.');
          if(!/^\d{9,18}$/.test(b.acc)) setErr(host,'rf-acc', b.acc ? 'Account numbers are 9 to 18 digits.' : 'Enter the account number.');
          else if(b.acc2 !== b.acc) setErr(host,'rf-acc2','Account numbers don’t match.');
          const bad = $('[aria-invalid="true"]', host); if(bad){ bad.focus(); return; } R.bank = b; } }
      R.step = 4; draw(); return; }
    // submit
    const btn = e.target.closest('[data-next]'); btn.disabled = true; btn.classList.add('loading'); $('span', btn).textContent = 'Submitting…'; await new Promise(r=>setTimeout(r, 1000));
    const now = new Date().toISOString(), exch = chosen().filter(u=>R.kind[u.key]==='exchange'), ret = chosen().filter(u=>R.kind[u.key]!=='exchange');
    const ad = State.addresses.find(x=>x.id===R.addr) || o.addr;
    const base = { at:now, method:R.method, slot:R.method==='pickup' ? `${R.slot} · ${ad.line1}, ${ad.city}` : null, point:R.method==='dropoff' ? R.point : null };
    const first = R.method==='pickup' ? 'Pickup scheduled' : 'Awaiting drop-off';
    o.returns = o.returns || []; const made = [];
    if(ret.length){ const r = { ...base, id:'RT'+String(Date.now()).slice(-6), kind:'return', units:ret.map(u=>({ key:u.key, qty:R.pick[u.key], reason:R.reason[u.key] })), amount:amount(),
      refundTo: o.payType==='cod' ? (R.refund==='upi' ? `UPI · ${R.upi}` : `Bank account ending ${R.bank.acc.slice(-4)}`) : o.pay, status:first, events:[{ s:'Requested', at:now },{ s:first, at:now }] }; o.returns.push(r); made.push(r); }
    if(exch.length){ const r = { ...base, id:'EX'+String(Date.now()+7).slice(-6), kind:'exchange', units:exch.map(u=>({ key:u.key, qty:R.pick[u.key], reason:R.reason[u.key] })), exch:Object.fromEntries(exch.map(u=>[u.key, R.exch[u.key]])), status:first, events:[{ s:'Requested', at:now },{ s:first, at:now }] }; o.returns.push(r); made.push(r); }
    State.emit();
    $('#rf-steps', el).innerHTML = STEPS.map((l)=>`<li class="d"><span>${icon('check')}</span>${l}</li>`).join('');
    host.innerHTML = `<div class="rf-card rf-done"><span class="ok-tick">${icon('check')}</span><h2>Request submitted</h2><p>${made.map(r=>`<b>${r.id}</b> · ${r.kind==='exchange'?'exchange':'return'}`).join(' and ')}. We’ve emailed the details${R.method==='dropoff'?' and a QR code for the drop-off counter':''}.</p>
      <ul class="rf-next"><li>${icon(R.method==='pickup'?'truck':'pin')}${R.method==='pickup' ? `Courier pickup ${esc(R.slot)}. Keep the items packed.` : `Drop off at ${esc(R.point)} within 5 days.`}</li><li>${icon('check')}Quick quality check within 48 hours of collection.</li><li>${icon('card')}${amount() ? `${inr(amount())} refunded to ${esc(made[0].refundTo||'')}` : 'Your new size ships after the check'}.</li></ul>
      <div class="d-empty-cta"><a class="btn btn-fire" href="#/account/orders/${o.id}">Track this request${icon('arrow')}</a><a class="btn btn-glass" href="#/account/returns">All returns</a></div></div>`;
    announce('Return request submitted'); window.scrollTo({ top:0, behavior:'smooth' });
  });
  host.addEventListener('change', e => {
    const d = e.target.closest('[data-reason]'); if(d){ R.reason[d.dataset.reason] = e.detail.value; return; }
    const x = e.target.closest('[data-exch]'); if(x){ R.exch[x.dataset.exch] = e.detail.value; return; }
    if(e.target.name==='rm'){ R.method = e.target.value; draw(); } if(e.target.name==='ra'){ R.addr = e.target.value; draw(); } if(e.target.name==='rp'){ R.point = e.target.value; draw(); }
    if(e.target.id==='rf-cond') R.cond = e.target.checked;
  });
  draw();
  return el;
}

/* ── returns overview (account) ── */
function accountReturns(){
  if(needAuth('/account/returns')) return h('<div class="pg"></div>');
  seedSampleOrders();
  const os = myOrders(), list = os.flatMap(o => (o.returns||[]).map(r => ({ o, r }))), eligible = os.filter(canReturn);

/* ── addresses ── */

      bindAddressForm($('#ad-form', host), editing==='new'?null:editing, () => { editing = null; draw(); }); setTimeout(()=>$('#ad-name', host).focus(), 40); return; }
    host.innerHTML = `<div class="adr-grid">${State.addresses.map(a=>`<article class="adr ${a.def?'def':''}"><div class="adr-h"><b>${esc(a.name)}</b><em>${a.type}</em>${a.def?'<em class="def">Default</em>':''}</div><p>${esc(a.line1)}<br>${esc(a.line2)}${a.land?`, near ${esc(a.land)}`:''}<br>${esc(a.city)}, ${esc(a.state)} ${a.pin}</p><small>Mobile ${a.phone}</small>
      <div class="adr-acts"><button type="button" class="pd-link" data-ed="${a.id}">Edit</button>${a.def?'':`<button type="button" class="pd-link" data-def="${a.id}">Set as default</button>`}<button type="button" class="pd-link" data-del="${a.id}">Remove</button></div></article>`).join('')}
      <button type="button" class="adr adr-add" data-new>${icon('plus')}<b>Add a new address</b><small>Home, work or anywhere you want gear delivered</small></button></div>`;
  };
  host.addEventListener('click', e => {
    if(e.target.closest('[data-new]')){ editing = 'new'; draw(); return; }
    if(e.target.closest('[data-cancel-ad]')){ editing = null; draw(); return; }
    const ed = e.target.closest('[data-ed]'); if(ed){ editing = ed.dataset.ed; draw(); return; }
    const df = e.target.closest('[data-def]'); if(df){ State.addresses.forEach(a => a.def = a.id===df.dataset.def); State.emit(); draw(); toast('Default address updated'); return; }
    const dl = e.target.closest('[data-del]'); if(dl){ const i = State.addresses.findIndex(a=>a.id===dl.dataset.del), a = State.addresses[i]; State.addresses.splice(i,1); if(a.def && State.addresses[0]) State.addresses[0].def = true; State.emit(); draw();

}

  bindEyes(el); phoneGuard(el, 'pf-phone');
  const np = $('#pf-new', el), rr = $('#pw-rules', el); const d = () => rr.innerHTML = pwRules(np.value, State.user.email).map(([k,l,ok])=>`<li class="${ok?'ok':''}">${icon(ok?'check':'close')}${l}</li>`).join(''); np.addEventListener('input', d); d();

    if(n.length<2 || !/^[a-zÀ-ɏ .'-]+$/i.test(n)){ setErr(el,'pf-name', n ? 'Use letters, spaces, apostrophes or hyphens only.' : 'Enter your name.'); $('#pf-name', el).focus(); return; }
    State.user.name = n; State.user.phone = ph; if(acc.email){ acc.name = n; acc.phone = ph; acc.news = $('#pf-news', el).checked; } State.emit(); toast('Profile saved'); });
  $('#pf-b', el).addEventListener('submit', async e => { e.preventDefault(); const c = $('#pf-cur', el).value, n = np.value; setErr(el,'pf-cur',''); setErr(el,'pf-new','');
    if(!c){ setErr(el,'pf-cur','Enter your current password.'); $('#pf-cur', el).focus(); return; }
    if(acc.pw && acc.pw !== await sha(c)){ setErr(el,'pf-cur','That isn’t your current password.'); $('#pf-cur', el).select(); return; }
    if(pwRules(n, State.user.email).some(x=>!x[2])){ setErr(el,'pf-new','Choose a password that meets all the rules below.'); np.focus(); return; }
    if(c === n){ setErr(el,'pf-new','Choose a password different from your current one.'); np.focus(); return; }
    if(acc.email){ acc.pw = await sha(n); State.emit(); } $('#pf-cur', el).value = ''; np.value = ''; d(); toast('Password updated'); });
  return el;
}

function legalPage(kind){

    terms:['Terms','How ordering, delivery, cancellations and returns work at Outpace.',[
      ['Using Outpace','These terms apply whenever you browse Outpace, build a kit, create an account or place an order. By using the site you agree to them, so please read them alongside our Privacy policy and Cookie preferences. You must be at least 18 years old to place an order, or have a parent or guardian place it for you. You are responsible for keeping your password private and for all activity on your account; if you think someone else has used it, reset your password straight away and let us know. We may update these terms from time to time, for example when we add a new delivery option or payment method. The version shown on this page on the day you place an order is the one that applies to that order.'],

    ]] }[kind];
  return h(`<div class="pg"><div class="wrap pg-wrap">${crumbs([['Home','#/'],[D[0],'']])}
    <header class="lst-head"><span class="eyebrow">Legal · demo policy</span><h1 class="wide">${D[0]}</h1><p class="pg-lead">${D[1]}</p></header>
    <div class="art-grid"><nav class="art-toc" aria-label="Sections"><span class="eyebrow">Sections</span><ol>${D[2].map((s,i)=>`<li><a href="#/${kind}" data-toc="${i}">${s[0]}</a></li>`).join('')}</ol></nav>
      <article class="art-body">${D[2].map(([h2,p],i)=>`<section id="sec-${i}"><h2><span>${String(i+1).padStart(2,'0')}</span>${h2}</h2><p>${p}</p></section>`).join('')}<p class="art-note">${icon('info')}Demo policy for a portfolio concept. Last updated ${fmtLong(new Date().toISOString())}. Related: <a class="pd-link" href="#/${kind==='privacy'?'terms':'privacy'}">${kind==='privacy'?'Terms':'Privacy'}</a> · <a class="pd-link" href="#/cookies">Cookie preferences</a></p></article></div></div></div>`);
}
document.addEventListener('click', e => { const t = e.target.closest('.art-toc [data-toc]'); if(t && !t.closest('.artpg')){ e.preventDefault(); $('#sec-'+t.dataset.toc)?.scrollIntoView({ behavior: reduceMotion()?'auto':'smooth' }); } });

/* ── cookies: banner on first visit + preferences page ── */
const COOKIE_CATS = [['essential','Essential','Keep you signed in, remember your cart and keep checkout secure. Always on.',true],['analytics','Analytics','Help us understand which pages work, using anonymous counts.'],['personal','Personalisation','Remember sports you browse to show relevant gear first.'],['marketing','Marketing','Measure ads on other sites. Outpace doesn’t sell your data.']];
const cookieChoice = () => Store.get('cookies', null);
function saveCookies(c, how){ Store.set('cookies', { ...c, essential:true, at:new Date().toISOString() }); $('#ck-banner')?.remove(); toast(how); }
function cookieBanner(){
  if(cookieChoice() || $('#ck-banner')) return;
  const b = h(`<section class="ckb" id="ck-banner" role="region" aria-label="Cookie consent"><div class="ckb-in"><div><b>Cookies on Outpace</b><p>We use essential cookies to run the store. With your OK, we’d also use optional cookies for analytics and personalisation. <a class="pd-link" href="#/cookies">Choose</a></p></div>
    <div class="ckb-acts"><button type="button" class="btn btn-glass btn-sm" data-ck="reject">Reject optional</button><a class="btn btn-glass btn-sm" href="#/cookies">Choose</a><button type="button" class="btn btn-fire btn-sm" data-ck="accept">Accept all</button></div></div></section>`);
  document.body.appendChild(b);
  b.addEventListener('click', e => { const k = e.target.closest('[data-ck]'); if(!k) return;
    saveCookies(k.dataset.ck==='accept' ? { analytics:true, personal:true, marketing:true } : { analytics:false, personal:false, marketing:false }, k.dataset.ck==='accept' ? 'All cookies accepted' : 'Optional cookies rejected'); });
}
function cookiesPage(){
  const c = cookieChoice() || {};
  const el = h(`<div class="pg"><div class="wrap pg-wrap">${crumbs([['Home','#/'],['Cookie preferences','']])}
    <header class="lst-head"><span class="eyebrow">Privacy</span><h1 class="wide">Cookie preferences</h1><p class="pg-lead">Choose which optional cookies Outpace can use. You can change this any time from the footer.</p></header>
    <form class="rf-card ck-form" id="ck-f">${COOKIE_CATS.map(([k,l,d,lock])=>`<label class="ck-cat"><span><b>${l}</b><small>${d}</small></span><span class="tgl"><input type="checkbox" name="${k}" ${lock||c[k]?'checked':''} ${lock?'disabled':''} role="switch" aria-label="${l} cookies"><i aria-hidden="true"></i></span></label>`).join('')}
      <p class="kr-fine">${c.at ? `Your choice was saved on ${fmtLong(c.at)}.` : 'You haven’t made a choice yet.'}</p>
      <div class="rf-foot"><button type="button" class="btn btn-glass btn-sm" data-all="0">Reject optional</button><span class="ck-r"><button type="button" class="btn btn-glass btn-sm" data-all="1">Accept all</button><button class="btn btn-fire btn-sm" type="submit">Save choices</button></span></div></form></div></div>`);
  const f = $('#ck-f', el), read = () => Object.fromEntries(COOKIE_CATS.slice(1).map(([k]) => [k, f.elements[k].checked]));
  f.addEventListener('submit', e => { e.preventDefault(); saveCookies(read(), 'Cookie choices saved'); Router.render(window.scrollY); });
  f.addEventListener('click', e => { const a = e.target.closest('[data-all]'); if(!a) return; COOKIE_CATS.slice(1).forEach(([k]) => f.elements[k].checked = a.dataset.all==='1'); saveCookies(read(), a.dataset.all==='1' ? 'All cookies accepted' : 'Optional cookies rejected'); Router.render(window.scrollY); });
  return el;
}

/* ── edge state: offline notice ── */
(function offline(){
  const bar = () => { let b = $('#offline'); if(navigator.onLine){ b && b.remove(); return; }
    if(!b){ b = h(`<div class="offline" id="offline" role="status">${icon('info')}You’re offline. You can keep browsing; we’ll reconnect automatically.</div>`); document.body.appendChild(b); } };
  window.addEventListener('online', () => { bar(); toast('Back online'); }); window.addEventListener('offline', bar);
})();

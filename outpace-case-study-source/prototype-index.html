/* sheets (option + cancel) */
.sheet-head .icon-btn,.cx-head .icon-btn{color:var(--bone)}.sheet-head .icon-btn:hover{background:rgba(255,240,230,.08)}
.sheet-head .mono,.cx-head .mono{color:var(--flare)}
.opt{border-color:var(--box-line-2);color:var(--bone)}.opt:hover{border-color:rgba(255,154,60,.55);background:rgba(255,90,31,.06)}
.opt[aria-checked="true"]{background:var(--bone);border-color:var(--bone);color:#16100e}.opt[aria-checked="true"] small{color:#c2410c}
.opt[aria-disabled="true"]{color:var(--ash-2);background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,240,230,.05) 6px 7px)}
.sheet-size{background:var(--box-2)}
.cx-ref{color:var(--ash)}.cx-ref b{color:var(--bone)}
.sheet-panel .sheet-err{color:#ff8a80}
/* option-sheet image: always inside its frame, whatever the product's shape */
.sheet-img{position:relative;overflow:hidden;background:radial-gradient(80% 80% at 50% 40%,#2c2321,#191312)}
.sheet-img img{position:absolute;inset:0;margin:auto;width:auto;height:auto;max-width:78%;max-height:78%}
/* invoice stays print-friendly on paper */
@media print{.inv{background:#fff;color:#16100e}}
.inv header{border-bottom-color:var(--bone)}.inv-logo svg{color:var(--bone)}.inv small,.inv-two span,.inv th,.inv footer{color:var(--ash)}.inv-two p{color:var(--bone-2)}
.inv th{border-bottom-color:var(--box-line-2)}.inv td{border-bottom-color:var(--box-line)}.inv-sum .t{border-top-color:var(--bone)}.inv footer{border-top-color:var(--box-line)}

/* ── dropdown: portalled list + hover ── */
.dd-l.dd-portal{position:fixed;z-index:400;top:0;left:0;max-height:300px;animation:ddIn .2s var(--ease)}
.dd-l.dd-portal.up{animation-name:ddUp}
.dd-l .dd-o{transition:background .15s,color .15s}
.dd-l .dd-o:hover:not([aria-disabled]),.dd-l .dd-o.hi{background:rgba(255,154,60,.14);color:var(--bone)}
.dd-l .dd-o:active:not([aria-disabled]){background:rgba(255,154,60,.22)}
.dd-b:hover{background:#2a201d}

/* ── kit summary: clean card ── */
.kr-clean{gap:16px}
.kr-thumbs{display:flex;flex-wrap:wrap;gap:6px}
.kr-thumbs img,.kr-thumbs i{width:46px;height:46px;border-radius:12px;object-fit:contain;padding:5px;background:radial-gradient(80% 80% at 50% 40%,#2c2321,#191312);border:1px solid var(--line)}
.kr-thumbs i{display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;color:var(--bone-2)}
.kr-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;border-top:1px solid var(--line)}
.kr-total span{color:var(--ash);font-size:14px}.kr-total b{font-family:var(--f-wide);font-stretch:125%;font-weight:800;font-size:28px}

/* ── avatar: orange-tinted silhouette ── */
.pop-av{overflow:hidden;background:radial-gradient(circle at 50% 30%,#ffb257,#ff5a1f 70%);padding:0}
.pop-av svg{width:100%;height:100%;display:block}
.acct-av{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none;display:block}.acct-av svg{width:100%;height:100%;display:block}.acct-btn.in{padding-left:6px}

/* ── hero: pace-reactive heading (Kanit Black Italic) ── */
.hero h1.ph{--v:.1;font-family:'Kanit',var(--f-wide);font-style:italic;font-stretch:normal;font-weight:900;font-size:inherit;margin:18px 0 18px;white-space:normal;letter-spacing:0;text-transform:uppercase;line-height:1}
.ph-top{display:flex;align-items:center;gap:.28em;font-size:clamp(40px,4.8vw,80px);font-weight:800;line-height:.95}
.ph-own{color:transparent;-webkit-text-stroke:2px var(--bone);padding-right:.04em}
.ph-your{color:var(--bone)}
.ph-meter{display:inline-grid;grid-template-columns:auto auto auto;align-items:baseline;column-gap:6px;row-gap:5px;margin-left:.3em;padding:10px 14px 9px;border-radius:14px;background:rgba(15,8,6,.55);border:1px solid rgba(255,154,60,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-family:var(--f-label);font-style:normal;font-stretch:112%;transform:skewX(-10deg);align-self:center}
.ph-meter>*{transform:skewX(10deg)}
.ph-dot{width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember);align-self:center;animation:phBlink 1s steps(2) infinite}
.ph-meter b{font-family:'Kanit',var(--f-wide);font-style:italic;font-weight:900;font-size:26px;line-height:1;color:var(--sun);font-variant-numeric:tabular-nums;min-width:1.25em}
.ph-meter small{font-size:10px;font-weight:650;letter-spacing:.12em;color:var(--ash);text-transform:uppercase}
.ph-bar{grid-column:1/-1;height:3px;border-radius:3px;background:rgba(255,240,230,.12);overflow:hidden}
.ph-bar i{display:block;height:100%;width:10%;background:var(--grad-ember);border-radius:inherit}
@keyframes phBlink{50%{opacity:.25}}
.ph-pace{position:relative;display:block;font-size:clamp(110px,13.2vw,232px);line-height:.86;margin-top:-.02em;padding-left:.02em}
.ph-main{position:relative;z-index:2;display:inline-flex;filter:drop-shadow(0 14px 40px rgba(255,90,31,.38))}
.ph-main span{display:inline-block;background:linear-gradient(100deg,#ff5a1f 0%,#ff7a2e 30%,#ffc272 55%,#ff7a2e 78%,#e2401a 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fireShift 4s ease-in-out infinite alternate;
  transform:translateX(calc(var(--v) * var(--i) * -7px)) skewX(calc(var(--v) * -16deg)) scaleX(calc(1 + var(--v) * .16));transform-origin:0 100%;transition:transform .08s linear;padding-right:.02em}
.ph-ghost{position:absolute;left:.02em;top:0;z-index:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,122,46,.75);pointer-events:none;white-space:nowrap;
  transform:translateX(calc(var(--v) * var(--k) * -1px)) skewX(calc(var(--v) * -16deg));opacity:calc(var(--v) * var(--o));transform-origin:0 100%}
.ph-ghost.g1{--k:46;--o:.9}.ph-ghost.g2{--k:96;--o:.55}.ph-ghost.g3{--k:150;--o:.3}
.ph-lines{position:absolute;right:100%;top:18%;bottom:14%;width:calc(40px + var(--v) * 260px);margin-right:-.1em;background:repeating-linear-gradient(180deg,transparent 0 9px,rgba(255,154,60,.75) 9px 11px,transparent 11px 22px);
  -webkit-mask:linear-gradient(90deg,transparent,#000 85%);mask:linear-gradient(90deg,transparent,#000 85%);opacity:calc(.25 + var(--v) * .75);pointer-events:none}
.ph.fast .ph-main span{animation:fireShift 4s ease-in-out infinite alternate,phJit .12s steps(2) infinite}
@keyframes phJit{50%{text-shadow:-3px 0 rgba(0,200,255,.0),3px 0 rgba(255,40,0,.45)}}
.ph-tip{display:inline-flex;align-items:center;gap:8px;margin:-4px 0 18px;font:650 10.5px/1 var(--f-label);font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.ph-tip .ic{width:13px;height:13px;color:var(--ember-2)}
.js-motion .hero h1.ph .ph-top{animation:rise .9s var(--ease) both}
.js-motion .hero h1.ph .ph-main{animation:dash 1.1s .1s var(--ease) both}
@media (hover:none){.ph-tip{display:none}}
@media (max-width:720px){.ph-top{font-size:44px;flex-wrap:wrap}.ph-meter{margin-left:0}.ph-pace{font-size:clamp(96px,27vw,150px)}}
/* hero hotspots: 4% larger, glowing, white-stroked like a radio button */
.hot{width:7.3px;height:7.3px;margin:-3.65px 0 0 -3.65px;background:radial-gradient(circle,#ffd0a0 0,#ff6a22 70%);box-shadow:0 0 0 2px #fff,0 0 0 3.5px rgba(255,90,31,.35),0 0 14px 4px rgba(255,90,31,.75)}
.hot::after{inset:-7px;border-color:rgba(255,255,255,.55)}
@media (max-width:980px){.hot{width:7.3px;height:7.3px;margin:-3.65px 0 0 -3.65px}}
/* running poster word: bigger and more visible */
.run-word{font-size:clamp(200px,calc(26vw + 30px),420px);-webkit-text-stroke:3px rgba(255,240,226,.7);background:linear-gradient(180deg,rgba(255,240,226,.45),rgba(255,240,226,.08) 80%);-webkit-background-clip:text;background-clip:text}
/* small stuff: 4 cards, tighter */
#accessories .acc-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.acc{min-height:300px}
.acc-objs{top:-40px;height:66%}
.acc-objs-wearables img:nth-child(1){height:70%;top:0;left:38%;max-width:70%}
.acc-objs-wearables img:nth-child(2){height:58%;top:34%;left:66%;max-width:58%}
.acc-objs-recovery img{height:84%;top:6%;max-width:96%;transform:translateX(-50%) rotate(-18deg)}
.acc:hover .acc-objs-recovery img{transform:translateX(-50%) translateY(-12px) rotate(-22deg) scale(1.05)}
@media (max-width:1150px){#accessories .acc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* buy it right: small-card thumbnails tilted like the feature card */
.gd-thumb img{transform:rotate(-22deg) scale(1.12)}
.gd-row:hover .gd-thumb img{transform:rotate(-16deg) scale(1.16) translateY(-4px)}
/* guide compositions */
.comp .cp{position:absolute;left:var(--x);top:var(--y);height:var(--h);transform:translate(-50%,-50%) rotate(var(--r));transition:transform .7s var(--ease)}
.comp .cp img{position:static;display:block;height:100%;width:auto;max-width:none;filter:drop-shadow(0 26px 24px rgba(0,0,0,.55))}
.comp .cp em{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%) rotate(calc(var(--r) * -1));font:650 10.5px/1 var(--f-label);font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;font-style:normal;color:var(--sun);white-space:nowrap}
.gi-media.comp .cp em{bottom:-18px}
.gi:hover .comp .cp,.art-art.comp:hover .cp{transform:translate(-50%,-52%) rotate(calc(var(--r) * 1.15))}
.art-art.comp{height:380px}

/* ── product gallery: 3 views ── */
.pd-thumbs{grid-template-columns:repeat(3,minmax(0,1fr))}
.gv-close{background:radial-gradient(90% 80% at 50% 35%,#2a1f1c 0%,#140e0d 60%,#0b0807 100%)}
.gv-close img{position:absolute;inset:0;width:100%;height:100%;max-width:none!important;max-height:none!important;object-fit:contain;padding:4%;image-rendering:auto;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6)) contrast(1.04) saturate(1.04)}
.gv-close .gv-cap{color:var(--sun);z-index:2}
.gv-close::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 50% 0%,rgba(255,255,255,.07),transparent 70%)}
/* poster */
.gv-ps{background:radial-gradient(70% 60% at 50% 48%,#ff9a3c 0%,#ff5a1f 20%,#a3240a 44%,#2a0703 72%,#0b0605 100%);overflow:hidden}
.gv-rays{position:absolute;left:50%;top:50%;width:160%;aspect-ratio:1;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,220,180,.10) 0 4deg,transparent 4deg 14deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 62%);mask:radial-gradient(circle,#000 10%,transparent 62%);animation:gvSpin 26s linear infinite}
@keyframes gvSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.gv-speed{position:absolute;inset:-20%;background:repeating-linear-gradient(105deg,transparent 0 38px,rgba(255,236,210,.16) 39px 41px,transparent 42px 110px);animation:gvRush .9s linear infinite;-webkit-mask:linear-gradient(90deg,#000 0%,transparent 45%,transparent 55%,#000 100%);mask:linear-gradient(90deg,#000 0%,transparent 45%,transparent 55%,#000 100%)}
@keyframes gvRush{to{background-position:-220px 0}}
.gv-ps .gv-word{left:50%;top:50%;transform:translate(-50%,-50%) skewX(-8deg);width:max-content;text-align:center;font-family:'Kanit',var(--f-wide);font-style:italic;font-weight:900;font-stretch:normal;font-size:clamp(110px,calc(15vw + 10px),240px);line-height:.8;letter-spacing:-.01em;color:transparent;background:linear-gradient(180deg,#fff6ec 0%,#ffd9b8 55%,#ffb27a 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 10px 40px rgba(120,20,0,.55)) drop-shadow(0 0 28px rgba(255,120,40,.45));transition:opacity .5s}
.gv-glow{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,154,60,.75) 0%,rgba(255,90,31,.35) 38%,transparent 70%);filter:blur(28px);pointer-events:none}
.gv-ps .gv-spec-box{position:absolute;left:50%;top:50%;width:50%;transform:translate(-50%,-50%);z-index:2}
.gv-ps .gv-spec-box>img{animation:gvFloat 4s ease-in-out infinite alternate;filter:drop-shadow(0 36px 30px rgba(0,0,0,.55))}
@keyframes gvFloat{to{transform:translateY(-10px) rotate(-1.5deg)}}
.gv-ps .gv-tag{z-index:3}
/* spec pointers glitch in 2s after the poster opens */
.gv-ps .gv-pt{opacity:0}
.gv-ps.play .gv-pt{animation:gvGlitch .7s steps(1) both;animation-delay:calc(2s + var(--d) * .16s)}
.gv-ps.play .gv-pt .gv-ln{animation:gvDraw .45s var(--ease) both;animation-delay:calc(2.1s + var(--d) * .16s);transform-origin:left}
.gv-ps.play .gv-pt .gv-ln.l{transform-origin:right}
.gv-ps.play .gv-word{animation:gvDim .5s 1.9s var(--ease) both}
.gv-ps.play::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.06) 0 2px,transparent 2px 5px);mix-blend-mode:overlay;opacity:0;animation:gvScan .6s 1.95s steps(3) both}
@keyframes gvGlitch{0%{opacity:0;transform:translateX(-8px);filter:hue-rotate(80deg)}20%{opacity:1;transform:translateX(6px)}35%{opacity:.3;transform:translateX(-3px)}50%{opacity:1;transform:translateX(2px);filter:none}70%{opacity:.6}100%{opacity:1;transform:none}}
@keyframes gvDraw{from{transform:scaleX(0)}}
@keyframes gvDim{to{opacity:.42}}
@keyframes gvScan{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.gv-ps .gv-lb{background:rgba(12,7,6,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 10px;border-radius:10px;border:1px solid rgba(255,236,220,.16);top:-24px}
/* plain spec view for soft goods */
.gv-ps.plain{background:radial-gradient(70% 60% at 50% 48%,#2a1712,#120c0b 70%)}
.gv-ps.plain .gv-glow{opacity:.55}
/* thumbnails show the still state */
.pd-th-in .gv-ps .gv-pt,.pd-th-in .gv-tag{display:none}
.pd-th-in .gv-ps .gv-word{font-size:56px}
.pd-th-in .gv-rays,.pd-th-in .gv-speed{animation:none}
@media (prefers-reduced-motion:reduce){.gv-ps .gv-pt{opacity:1}}
/* ── iteration 9 ── */
.sw.in:not(.dragging) .sw-label{opacity:1!important}
.sw.in .sw-label{font-size:12.5px;white-space:nowrap;padding:0 calc(var(--k) + 8px) 0 14px}
.lst-grid .sw.in .sw-label{font-size:11px}
/* gear by type: balanced 2 × 2, every card the same size, both items on the right half */
.eq-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:330px 330px;gap:72px 20px}
.eq-tile:nth-child(n){grid-row:auto;grid-column:auto}
.eq-tile:nth-child(n) .eq-objs{left:44%;right:0;top:-52px;bottom:20px}
.eq-tile:nth-child(n) .eq-copy{max-width:46%}
.eq-tile:nth-child(1) .eq-items{flex-direction:row;gap:6px 14px}
.eq-tile:nth-child(1) .eq-items li::before{display:none}

/* ───────── core: dom helpers, store, router ───────── */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const h = (html) => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const IMG = n => `img/${n}.webp`;

/* device-local store — wrapped so private windows still work (spec §20, artifact rules) */
const Store = {
  get(k, d){ try{ const v = localStorage.getItem('op:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('op:'+k, JSON.stringify(v)); }catch(e){} }
};
const State = {
  cart: Store.get('cart', []),       // [{id, variant, qty}]
  saved: Store.get('saved', []),     // [id]
  recent: Store.get('recent', []),   // recent searches
  kitDraft: Store.get('kitDraft', null), // answers started on the homepage kit teaser (spec §18 draft recovery)
  compare: Store.get('compare', []),   // product ids, max 3
  pin: Store.get('pin', ''),
  sizes: Store.get('sizes', null),      // size profile, cm internally (Phase 4)
  kits: Store.get('kits', []),          // saved kits [{id,sport,items:[{id,v}],budget,at}]            // browsing pincode (spec §15: remembered, not an address)
  listeners: new Set(),
  on(fn){ this.listeners.add(fn); },
  emit(){ Store.set('cart', this.cart); Store.set('saved', this.saved); Store.set('recent', this.recent); Store.set('kitDraft', this.kitDraft); Store.set('compare', this.compare); Store.set('pin', this.pin); Store.set('sizes', this.sizes); Store.set('kits', this.kits); this.listeners.forEach(f=>f()); },
  cartCount(){ return this.cart.reduce((a,i)=>a+i.qty,0); },
  qtyOf(id){ return this.cart.filter(i=>i.id===id).reduce((a,i)=>a+i.qty,0); },
  linesOf(id){ return this.cart.filter(i=>i.id===id); },
  /* simulated store calls: resolve after a short delay so processing states are real (spec §16) */
  add(id, variant){
    return new Promise((res, rej) => setTimeout(() => {
      const p = productById(id);
      if(p.opt){ const o = p.opt.values.find(v=>v.v===variant); if(!o) return rej(new Error('Choose an option first.')); if(o.out) return rej(new Error(`${variant} is sold out.`)); }
      const line = this.cart.find(i=>i.id===id && i.variant===(variant||null));
      if(line){ if(line.qty >= 5) return rej(new Error('You can add up to 5 of the same item.')); line.qty++; }
      else this.cart.push({ id, variant: variant||null, qty:1 });
      this.emit(); res();
    }, 260));
  },
  addQty(id, variant, n){
    return new Promise((res, rej) => setTimeout(() => {
      const p = productById(id);

/* ───────── router (hash based so Back/Forward work inside the frame) ───────── */
const Router = {
  routes: [],
  scroll: {},
  add(pattern, render){ this.routes.push({ re:new RegExp('^'+pattern.replace(/:(\w+)/g,'(?<$1>[^/?]+)')+'(?:\\?(?<qs>.*))?$'), render }); },
  path(){ const h = location.hash.replace(/^#/, ''); return h.startsWith('/') ? h : '/'; },
  go(path){ this.fresh = true; if(this.path() === path) { this.render(); return; } location.hash = path; },
  replace(path){ const y = window.scrollY; history.replaceState(history.state, '', '#' + path); this.render(y); },
  render(keepY){
    const path = this.path();
    for(const r of this.routes){
      const m = path.match(r.re);
      if(m){
        const params = {...(m.groups||{})};
        params.q = new URLSearchParams(params.qs||'');
        const main = $('#main');
        main.innerHTML = ''; main.appendChild(r.render(params));
        document.dispatchEvent(new CustomEvent('route', { detail:{ path, params } }));
        // new navigation always starts at the top; only Back/Forward restores the old position
        const y = keepY !== undefined ? keepY : (this.fresh ? 0 : this.scroll[path]); this.fresh = false;
        document.body.style.overflow = '';
        // never leave the viewport parked past the page content (e.g. a filter shrank the list): the footer must not be the landing spot
        const safe = want => { const end = main.offsetTop + main.offsetHeight - innerHeight * .55; if(want > end){ const res = $('.lst-main', main); return res ? Math.max(0, res.getBoundingClientRect().top + scrollY - 110) : 0; } return want; };
        window.scrollTo({ top: safe(y || 0), behavior:'instant' });
        requestAnimationFrame(()=> window.scrollTo({ top: safe(y || 0), behavior:'instant' }));
        return;
      }
    }
    this.go('/');
  },
  start(){
    let last = this.path();
    window.addEventListener('scroll', ()=>{ this.scroll[this.path()] = window.scrollY; }, { passive:true });
    // a brand-new history entry has no state yet: that's forward navigation (start at top);
    // an entry with state was visited before, so Back/Forward restores its scroll position
    if(!history.state) history.replaceState({ op:1 }, '');
    window.addEventListener('hashchange', ()=>{ last = this.path(); if(!history.state){ this.fresh = true; history.replaceState({ op:1 }, ''); } this.render(); });
    this.render();
  }
};
/* intercept in-page links of the form href="#/..." so they route, and plain #ids so they scroll */
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if(!a || e.metaKey || e.ctrlKey) return;
  const href = a.getAttribute('href');
  if(href.startsWith('#/')) return; // native hashchange handles it
  if(href === '#') return;
  e.preventDefault();
  const id = href.slice(1), go = () => { const el = document.getElementById(id); el && el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block:'start' }); };
  if(document.getElementById(id)) go(); else { location.hash = '/'; setTimeout(go, 380); }
});

/* scroll reveal */
function initReveal(root=document){
  if(reduceMotion() || !('IntersectionObserver' in window)) return;
  document.documentElement.classList.add('js-motion');
  const io = new IntersectionObserver(es => es.forEach(en => { if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }), { rootMargin:'0px 0px -8% 0px' });
  $$('.rv', root).forEach(el => {
    const r = el.getBoundingClientRect();
    if(r.top < innerHeight) el.classList.add('in'); else io.observe(el);
  });
}

/* ───────── custom dropdown (replaces OS-native <select> menus) ─────────
   ddHTML({id,label,options:[{v,l,off,note}],value,placeholder}) → markup; value lives in data-value,
   a bubbling 'change' event fires on the .dd element with detail.value. Fully keyboard operable. */
function ddHTML({ id, label, options, value, placeholder='Choose', cls='', attrs='' }){
  const cur = options.find(o => o.v === value);
  return `<div class="dd ${cls}" id="${id}" data-value="${esc(value||'')}" ${attrs}>
    <button type="button" class="dd-b" aria-haspopup="listbox" aria-expanded="false" aria-label="${esc(label)}${cur?`: ${esc(cur.l)}`:''}"><span class="dd-v ${cur?'':'ph'}">${cur ? esc(cur.l) : esc(placeholder)}</span>${icon('chevron')}</button>
    <ul class="dd-l" role="listbox" tabindex="-1" aria-label="${esc(label)}" hidden>${options.map(o => `<li role="option" class="dd-o" data-v="${esc(o.v)}" aria-selected="${o.v===value}" ${o.off?'aria-disabled="true"':''}><span>${esc(o.l)}</span>${o.note?`<small>${esc(o.note)}</small>`:''}${icon('check')}</li>`).join('')}</ul></div>`;
}
(function initDropdowns(){
  /* the open list is portalled to <body> with fixed coordinates, so no parent opacity,
     overflow or stacking context (cards, sheets, returns list) can clip or tint it */
  let open = null, list = null, home = null;
  const L = d => d.__list || (d.__list = $('.dd-l', d));
  const place = () => { if(!open) return; const r = $('.dd-b', open).getBoundingClientRect(), h = Math.min(list.scrollHeight, 300);
    const up = r.bottom + h + 12 > innerHeight && r.top > h + 12;
    list.style.left = Math.max(8, Math.min(r.left, innerWidth - Math.max(r.width, 200) - 8)) + 'px'; list.style.minWidth = r.width + 'px';
    list.style.top = (up ? r.top - h - 8 : r.bottom + 8) + 'px'; list.classList.toggle('up', up); };
  const close = (focusBtn) => { if(!open) return; const d = open; open = null; d.classList.remove('on'); $('.dd-b', d).setAttribute('aria-expanded','false');
    list.hidden = true; list.classList.remove('dd-portal'); home.appendChild(list); list = null; if(focusBtn) $('.dd-b', d).focus(); };
  const show = d => { if(open && open !== d) close(); open = d; d.classList.add('on'); list = L(d); list.__dd = d; home = d;
    document.body.appendChild(list); list.classList.add('dd-portal'); list.hidden = false; $('.dd-b', d).setAttribute('aria-expanded','true'); place();
    const cur = $('.dd-o[aria-selected="true"]', list) || $('.dd-o:not([aria-disabled])', list); hi(cur); list.focus({ preventScroll:true }); };
  const hi = o => { $$('.dd-o', list).forEach(x => x.classList.toggle('hi', x===o)); if(o){ o.scrollIntoView({ block:'nearest' }); list.setAttribute('aria-activedescendant', o.id || (o.id = 'dd'+Math.random().toString(36).slice(2,8))); } };
  const pick = o => { if(!o || o.getAttribute('aria-disabled')) return; const d = open, v = o.dataset.v; d.dataset.value = v;
    $$('.dd-o', list).forEach(x => x.setAttribute('aria-selected', x===o)); const vv = $('.dd-v', d); vv.textContent = $('span', o).textContent; vv.classList.remove('ph');
    $('.dd-b', d).setAttribute('aria-label', $('.dd-b', d).getAttribute('aria-label').split(':')[0] + ': ' + vv.textContent);
    close(true); d.dispatchEvent(new CustomEvent('change', { bubbles:true, detail:{ value:v } })); };

    const b = e.target.closest('.dd-b'); if(b){ e.preventDefault(); const d = b.closest('.dd'); open === d ? close() : show(d); return; }
    const o = e.target.closest('.dd-portal .dd-o'); if(o){ pick(o); return; }
    if(open && !e.target.closest('.dd-portal')) close();
  }, true);
  document.addEventListener('mouseover', e => { const o = e.target.closest('.dd-portal .dd-o:not([aria-disabled])'); if(o) hi(o); });
  document.addEventListener('keydown', e => {
    const b = e.target.closest && e.target.closest('.dd-b');
    if(b && ['ArrowDown','ArrowUp','Enter',' '].includes(e.key)){ e.preventDefault(); show(b.closest('.dd')); return; }
    if(!open || !list.contains(e.target)) return;
    const items = $$('.dd-o:not([aria-disabled])', list), cur = $('.dd-o.hi', list), i = items.indexOf(cur);
    if(e.key==='ArrowDown'){ e.preventDefault(); hi(items[Math.min(items.length-1, i+1)]); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); hi(items[Math.max(0, i-1)]); }
    else if(e.key==='Home'){ e.preventDefault(); hi(items[0]); } else if(e.key==='End'){ e.preventDefault(); hi(items[items.length-1]); }
    else if(e.key==='Enter' || e.key===' '){ e.preventDefault(); pick(cur); }
    else if(e.key==='Escape' || e.key==='Tab'){ e.preventDefault(); close(true); }
    else if(e.key.length===1){ const n = items.find(x => x.textContent.trim().toLowerCase().startsWith(e.key.toLowerCase())); if(n) hi(n); }
  });
  window.addEventListener('scroll', e => { if(open && !(list && list.contains(e.target))) place(); }, { passive:true, capture:true });
  window.addEventListener('resize', place);
  document.addEventListener('route', () => close());
})();

/* kit/product fly-to-cart: a small copy of the image arcs into the cart button */
function flyToCart(src, fromEl){

const SYN = { racquet:'racket', racquets:'rackets', shuttle:'shuttlecock', shuttles:'shuttlecocks', shoe:'shoes', boot:'boots', sneakers:'shoes',
  footwear:'shoes', soccer:'football', ball:'ball', balls:'ball', helmet:'helmet', pads:'pads', gloves:'gloves', glove:'gloves', sock:'socks', bottle:'hydration', sipper:'hydration' };

function searchIndex(q){
  const raw = q.trim().toLowerCase();
  if(!raw) return null;
  const terms = raw.split(/\s+/).map(t => SYN[t] || t);
  const hit = (txt) => terms.every(t => txt.toLowerCase().includes(t) || (t.endsWith('s') && txt.toLowerCase().includes(t.slice(0,-1))));
  const products = PRODUCTS.filter(p => hit(`${p.name} ${p.sport} ${p.attr} ${p.cat} ${p.specs.map(s=>s.join(' ')).join(' ')}`)).slice(0,6);
  const cats = [
    ...SPORTS.map(s=>({ label:s.name, sub:'Sport', href:`#/sport/${s.id}`, icon:s.icon, txt:`${s.name} ${s.subs.join(' ')} ${s.kicker}` })),
    ...SPORTS.flatMap(s=>s.subs.map(x=>({ label: x.toLowerCase().includes(s.name.toLowerCase()) ? x : `${s.name} ${x}`, sub:s.name, href:`#/sport/${s.id}?c=${encodeURIComponent(x)}`, icon:s.icon, txt:`${s.name} ${x}` }))),
    ...EQUIPMENT.map(e=>({ label:e.name, sub:'Equipment', href:`#/equipment/${e.id}`, icon:e.icon, txt:`${e.name} ${e.items.join(' ')}` })),
    ...ACCESSORIES.map(a=>({ label:a.name, sub:'Accessories', href:`#/accessories/${a.id}`, icon:a.icon, txt:`${a.name} ${a.items.join(' ')}` })),
  ].filter(c => hit(c.txt)).slice(0,6);
  const guides = GUIDES.filter(g => hit(`${g.title} ${g.sport} ${g.tag}`)).slice(0,4);
  return { products, cats, guides };
}

/* focus trap helper */
function trap(container, onClose){
  const sel = 'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';
  const key = e => {
    if(e.key === 'Escape'){ e.preventDefault(); onClose(); return; }
    if(e.key !== 'Tab') return;
    const f = $$(sel, container).filter(x => x.offsetParent !== null);
    if(!f.length) return;
    if(e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if(!e.shiftKey && document.activeElement === f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  };
  container.addEventListener('keydown', key);
  return () => container.removeEventListener('keydown', key);
}

/* ───────── product card + swipe-to-add / reverse-swipe-to-remove (spec §16) ─────────
   • forward swipe (or click / Enter on the handle) adds one unit
   • if a required option is unresolved, the option sheet opens first — nothing is added until confirmed
   • once in the cart the track flips: swipe back (or press the handle) removes one unit of a chosen variant
   • every change waits for the store, prevents double submits, and can be undone */
function optSummary(p){
  if(!p.opt) return '';
  const n = p.opt.values.length, avail = p.opt.values.filter(v=>!v.out).length;
  return n === 1 ? p.opt.values[0].v : `${avail} of ${n} ${p.opt.label.toLowerCase()}s in stock`;
}

/* render the right state into every swipe control on the page */
function syncSwipes(root=document){
  $$('.sw', root).forEach(sw => {
    const id = sw.dataset.pid, q = State.qtyOf(id), p = productById(id);
    if(sw.classList.contains('busy')) return;
    sw.classList.toggle('in', q > 0);
    sw.classList.remove('dragging');
    sw.style.setProperty('--x', '0px'); sw.style.setProperty('--p', '0');
    const knob = $('.sw-knob', sw), label = $('.sw-label', sw), meta = $('.sw-meta', sw);
    if(q > 0){
      const lines = State.linesOf(id);
      label.textContent = 'Remove item from cart';
      knob.innerHTML = icon('arrowL');
      knob.setAttribute('aria-label', `Remove one ${p.name} from cart. ${q} in cart.`);
      meta.hidden = false;
      $('.sw-qty', meta).innerHTML = `${icon('check')}<b>${q}</b> in cart${lines.length===1 && lines[0].variant ? ` · ${esc(lines[0].variant)}` : lines.length>1 ? ` · ${lines.length} options` : ''}`;
    } else {
      label.textContent = 'Swipe to add';
      knob.innerHTML = icon('arrow');
      knob.setAttribute('aria-label', `Add ${p.name} to cart${p.opt?` — choose ${p.opt.label.toLowerCase()} first`:''}`);
      meta.hidden = true;
    }
  });
  $$('.pc-save', root).forEach(b => { const id = b.closest('.pc').dataset.pid, on = State.saved.includes(id); b.setAttribute('aria-pressed', on); });
  $$('.pc-cmp', root).forEach(b => b.setAttribute('aria-pressed', State.compare.includes(b.closest('.pc').dataset.pid)));
}

/* gesture + click handling, delegated once for the whole document */
(function initSwipes(){
  let drag = null;
  const travel = sw => { const t = $('.sw-track', sw), k = $('.sw-knob', sw); return t.clientWidth - k.offsetWidth - 8; };
  document.addEventListener('pointerdown', e => {
    const knob = e.target.closest('.sw-knob'); if(!knob) return;
    const sw = knob.closest('.sw'); if(sw.classList.contains('busy')) return;
    drag = { sw, x0:e.clientX, y0:e.clientY, max:travel(sw), dir: sw.classList.contains('in') ? -1 : 1, moved:false, id:e.pointerId, decided:false };
    knob.setPointerCapture(e.pointerId);
  });
  document.addEventListener('pointermove', e => {
    if(!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if(!drag.decided){ if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return; drag.decided = true; if(Math.abs(dy) > Math.abs(dx)){ drag = null; return; } } // vertical = let the page scroll
    drag.moved = true;
    const prog = Math.max(0, Math.min(1, (drag.dir===1 ? dx : -dx) / drag.max));
    drag.prog = prog;
    drag.sw.classList.add('dragging');
    drag.sw.style.setProperty('--x', (drag.dir===1 ? prog : 1-prog) * drag.max + 'px');
    drag.sw.style.setProperty('--p', prog);
  });
  const end = e => {
    if(!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null; d.sw.classList.remove('dragging');
    if(d.moved){
      e.preventDefault();
      if(d.prog > .82) act(d.sw); else { d.sw.style.setProperty('--x', d.dir===1 ? '0px' : 'var(--max)'); d.sw.style.setProperty('--p', 0); syncSwipes(d.sw.parentElement); }
      d.sw.dataset.justDragged = '1'; setTimeout(()=>delete d.sw.dataset.justDragged, 50);
    }
  };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
  document.addEventListener('click', e => {
    const knob = e.target.closest('.sw-knob');
    if(knob){ const sw = knob.closest('.sw'); if(sw.dataset.justDragged) return; act(sw); return; }
    if(e.target.closest('.sw-view')){ $('#btn-cart').click(); return; }
    const cmpb = e.target.closest('.pc-cmp'); if(cmpb){ toggleCompare(cmpb.closest('.pc').dataset.pid); return; }
    const save = e.target.closest('.pc-save');
    if(save){ const id = save.closest('.pc').dataset.pid, p = productById(id), on = State.saved.includes(id);
      State.saved = on ? State.saved.filter(x=>x!==id) : [...State.saved, id]; State.emit();
      toast(on ? `Removed ${p.name} from Saved` : `Saved ${p.name}`, on ? { label:'Undo', fn:()=>{ State.saved.push(id); State.emit(); } } : { label:'View', fn:()=>$('#btn-saved').click() }); }
  });
  State.on(() => syncSwipes());
  document.addEventListener('route', () => requestAnimationFrame(() => syncSwipes()));
})();

function act(sw){
  const id = sw.dataset.pid;
  if(State.qtyOf(id) > 0) removeFlow(id, sw); else addFlow(id, false, sw);
}
async function addFlow(id, another, sw){
  const p = productById(id);
  let variant = null;
  if(p.opt){
    // one-option products resolve themselves; otherwise ask (never preselect a size — spec §15)
    if(p.opt.values.length === 1) variant = p.opt.values[0].v;
    else { variant = await optionSheet(p, 'add'); if(!variant){ syncSwipes(); return; } }
  }
  await commit(id, () => State.add(id, variant), `Added ${p.name}${variant?` · ${variant}`:''}`,
    () => State.removeOne(id, variant), sw);
}
async function removeFlow(id, sw){
  const p = productById(id), lines = State.linesOf(id);
  let variant = lines[0].variant;
  if(lines.length > 1){ variant = await optionSheet(p, 'remove'); if(variant === null){ syncSwipes(); return; } }
  await commit(id, () => State.removeOne(id, variant), `Removed one ${p.name}${variant?` · ${variant}`:''}`,
    () => State.add(id, variant), sw);
}
async function commit(id, op, msg, undo, sw){
  const sws = $$(`.sw[data-pid="${id}"]`);
  if(sws.some(s => s.classList.contains('busy'))) return;         // no double submits
  sws.forEach(s => s.classList.add('busy'));
  try{
    await op();
    sws.forEach(s => s.classList.remove('busy')); syncSwipes();
    toast(msg, msg.startsWith('Added') ? { label:'View', fn:()=>{ location.hash='/cart'; } } : { label:'Undo', fn: async () => { try{ await undo(); announce('Change undone'); }catch(err){ toast(err.message); } } });
    announce(msg + `. ${State.qtyOf(id)} in cart.`);
  }catch(err){
    sws.forEach(s => s.classList.remove('busy')); syncSwipes();
    toast(err.message); announce(err.message);
  }
}

/* option sheet: choose a variant to add, or which variant to remove one of */
function optionSheet(p, mode){
  return new Promise(resolve => {
    const opener = document.activeElement;
    const lines = State.linesOf(p.id);
    const values = mode === 'remove' ? lines.map(l => ({ v:l.variant, qty:l.qty })) : p.opt.values;
    const host = h(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
      <div class="sheet-scrim" data-x></div>
      <div class="sheet-panel">
        <div class="sheet-head">

/* pace-reactive heading: pointer (or scroll) speed drives skew, stretch and ghost trails */
function initPaceHeading(){
  const h = $('#hero-title'); if(!h) return;
  const hero = $('.hero');
  if(reduceMotion()){ h.style.setProperty('--v', .2); return; }
  let v = 0, target = 0, lx = null, ly = null, lt = 0, raf, peak = 0;
  const feed = (x, y) => { const t = performance.now(); if(lx !== null){ const dt = Math.max(8, t - lt), d = Math.hypot(x - lx, y - ly); target = Math.min(1, Math.max(target, d / dt / 2.6)); } lx = x; ly = y; lt = t; };
  hero.addEventListener('pointermove', e => feed(e.clientX, e.clientY), { passive:true });
  hero.addEventListener('pointerleave', () => { lx = null; });
  let sy = scrollY; window.addEventListener('scroll', () => { const d = Math.abs(scrollY - sy); sy = scrollY; if(scrollY < innerHeight) target = Math.min(1, Math.max(target, d / 60)); }, { passive:true });
  const tick = () => {
    target *= .94; v += (target - v) * .12;
    const shown = Math.max(v, .08 + .04 * Math.sin(performance.now() / 900));
    h.style.setProperty('--v', shown.toFixed(3));
    h.classList.toggle('fast', shown > .55);
    if(document.body.contains(h)) raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

function initHero(){
  initPaceHeading();
  const stage = $('#stage'); if(!stage) return;
  const card = $('#gcard');
  const touch = window.matchMedia('(hover:none)').matches;
  if(touch) $('#hint-txt').textContent = 'Tap the glowing gear on each athlete to see it, then tap the card to open the product.';
  let active = null, hideT;

  function show(g){
    clearTimeout(hideT);
    if(active && active !== g) active.classList.remove('on');
    active = g; g.classList.add('on');
    const ath = g.closest('.ath');
    $$('.ath', stage).forEach(a => a.classList.toggle('on', a === ath));
    stage.classList.add('focus');
    const p = productById(g.dataset.pid), s = sportById(p.sport);
    card.innerHTML = `<span class="gc-top"><span class="mono">${s.name} · ${GEAR_NAMES[g.dataset.g]}</span><span class="demo-tag">Demo</span></span>
      <b>Outpace ${esc(p.name)}</b><p>${esc(p.attr)}</p>
      <div class="gc-foot"><span class="gc-price">${inr(p.price)}</span><a class="gc-go" href="#/product/${p.id}">View product${icon('arrow')}</a></div>`;
    card.hidden = false;
    // position card next to the marker, flipped to stay inside the stage
    const sr = stage.getBoundingClientRect(), hr = g.querySelector('.hot').getBoundingClientRect();
    const cx = hr.left + hr.width/2 - sr.left, cy = hr.top + hr.height/2 - sr.top;
    const cw = card.offsetWidth, ch = card.offsetHeight;
    let left = cx + 22, top = cy - ch/2, ox = '0%';
    if(left + cw > sr.width - 4){ left = cx - cw - 22; ox = '100%'; }
    left = Math.max(-sr.left + 8, Math.min(left, sr.width - cw)); top = Math.max(4, Math.min(top, sr.height - ch - 4));
    card.style.left = left + 'px'; card.style.top = top + 'px'; card.style.setProperty('--ox', ox); card.style.setProperty('--oy','50%');
  }
  function hide(now){
    const go = () => { if(active) active.classList.remove('on'); active = null; card.hidden = true; stage.classList.remove('focus'); $$('.ath', stage).forEach(a=>a.classList.remove('on')); };
    clearTimeout(hideT); now ? go() : (hideT = setTimeout(go, 220));
  }
  $$('.gear', stage).forEach(g => {
    g.addEventListener('pointerenter', e => { if(e.pointerType==='mouse') show(g); });
    g.addEventListener('pointerleave', e => { if(e.pointerType==='mouse') hide(); });
    g.addEventListener('focus', () => show(g));
    g.addEventListener('blur', () => hide());
    g.addEventListener('click', e => {
      // touch: first tap reveals the card (essential info without hover), second tap or card tap opens the product
      if(touch && active !== g){ e.preventDefault(); show(g); }
    });
  });
  card.addEventListener('pointerenter', () => clearTimeout(hideT));
  card.addEventListener('pointerleave', e => { if(e.pointerType==='mouse') hide(); });
  card.addEventListener('click', e => { if(!e.target.closest('a') && active) location.hash = '/product/' + active.dataset.pid; });
  document.addEventListener('pointerdown', e => { if(touch && active && !e.target.closest('.gear,.gcard')) hide(true); });
  stage.addEventListener('keydown', e => { if(e.key==='Escape' && active){ const a=active; hide(true); a.blur(); } });

  // depth: pointer parallax
  if(!reduceMotion() && window.matchMedia('(pointer:fine)').matches){
    const hero = $('.hero'); let raf;
    hero.addEventListener('pointermove', e => { cancelAnimationFrame(raf); raf = requestAnimationFrame(()=>{
      const r = hero.getBoundingClientRect(); stage.style.setProperty('--px', ((e.clientX - r.left)/r.width - .5).toFixed(3)); stage.style.setProperty('--py', ((e.clientY - r.top)/r.height - .5).toFixed(3)); }); });
    hero.addEventListener('pointerleave', () => { stage.style.setProperty('--px', 0); stage.style.setProperty('--py', 0); });
  }
  initStreaks();
}

/* ───────── speed streaks (ref 10 + refs 3/6/8) ─────────
   Each athlete leaves an ember motion-smear behind it, and thin light streaks peel off its
   silhouette edge and race out to the left. Everything is sampled from the real cut-outs. */
function initStreaks(){
  const cvs = $('#streaks'), hero = $('.hero'), stage = $('#stage');
  if(!cvs || !stage) return;
  const ctx = cvs.getContext('2d');
  const still = reduceMotion();
  let W=0, H=0, DPR=1, running=false, visible=true, last=0;
  const A = [];          // athlete render info
  const P = [];          // particles
  const imgs = HERO_ATHLETES.map(a => new Promise(res => { const im = new Image(); im.onload = () => res({a, im}); im.onerror = () => res(null); im.src = IMG('ath-'+a.id); }));

  Promise.all(imgs).then(list => {
    list.filter(Boolean).forEach(({a, im}) => {
      // silhouette edge table at reduced resolution: leftmost opaque x per row
      const sh = 160, sw = Math.round(im.width * sh / im.height);
      const c = document.createElement('canvas'); c.width = sw; c.height = sh;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0, sw, sh);
      let data; try { data = x.getImageData(0,0,sw,sh).data; } catch(e){ data = null; }
      const rows = [];
      if(data) for(let y=0;y<sh;y++){ for(let xx=0;xx<sw;xx++){ if(data[(y*sw+xx)*4+3] > 140){ rows.push([y/sh, xx/sw]); break; } } }
      A.push({ a, im, rows, el: stage.querySelector(`.ath[data-id="${a.id}"]`), smear:null, box:null });
    });
    resize(); if(still) drawStill(); else start();
  });

  function tinted(im, w, h, color){
    const c = document.createElement('canvas'); c.width = Math.max(1,Math.round(w)); c.height = Math.max(1,Math.round(h));
    const x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
    x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0,0,c.width,c.height); return c;
  }
  function buildSmear(o){
    const b = o.box, trail = Math.min(W*0.55, b.w*2.4 + 260);
    const pad = 40;
    const c = document.createElement('canvas'); c.width = Math.round(b.w + trail + pad*2); c.height = Math.round(b.h + pad*2);
    const x = c.getContext('2d');
    const hot = tinted(o.im, b.w, b.h, '#ff8a3a'), deep = tinted(o.im, b.w, b.h, '#a8240a');
    const N = 26;
    for(let i=N;i>=1;i--){
      const t = i/N, off = trail * Math.pow(t, 1.35);
      x.globalAlpha = 0.16 * Math.pow(1-t, 1.4) + 0.012;
      x.drawImage(t > .35 ? deep : hot, pad + trail - off, pad, b.w, b.h);
    }
    // horizontal smudge pass for the long-exposure look
    const s2 = document.createElement('canvas'); s2.width = c.width; s2.height = c.height;
    const y = s2.getContext('2d');
    y.filter = 'blur(6px)'; y.drawImage(c, 0, 0);
    y.filter = 'none'; y.globalCompositeOperation = 'lighter'; y.globalAlpha = .55;
    for(let k=0;k<4;k++) y.drawImage(c, -k*18, 0, c.width + k*36, c.height);
    o.smear = s2; o.trail = trail + pad; o.pad = pad;
  }
  function resize(){
    const r = hero.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = r.width; H = r.height;
    cvs.width = Math.round(W*DPR); cvs.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    A.forEach(o => {
      const er = o.el.getBoundingClientRect();
      o.box = { x: er.left - r.left, y: er.top - r.top, w: er.width, h: er.height };
      buildSmear(o);
    });
  }
  function spawn(){
    if(!A.length) return;
    const o = A[(Math.random()*A.length)|0];
    if(!o.rows.length) return;
    const [ry, rx] = o.rows[(Math.random()*o.rows.length)|0];
    const b = o.box;
    const fast = Math.random() < .3;
    const hue = Math.random();
    P.push({
      x: b.x + rx*b.w + 6, y: b.y + ry*b.h + (Math.random()-.5)*4,
      len: (fast ? 260 + Math.random()*520 : 80 + Math.random()*240) * Math.min(1, W/1200 + .25),
      v: (fast ? 1500 : 700) + Math.random()*900,
      w: fast ? 1 + Math.random()*1.4 : 1.2 + Math.random()*2.6,
      a: .35 + Math.random()*.6, life: 0,
      c: hue < .5 ? '255,154,70' : hue < .82 ? '255,96,34' : '255,214,160'
    });
  }
  function frame(t){
    if(!running) return;
    const dt = Math.min(.05, (t - (last||t))/1000); last = t;
    ctx.clearRect(0,0,W,H);
    // smears (breathing, slight jitter)
    ctx.globalCompositeOperation = 'lighter';
    A.forEach((o,i) => {
      const b = o.box; const br = .62 + .18*Math.sin(t/900 + i*1.7);
      ctx.globalAlpha = br;
      const jit = Math.sin(t/140 + i)*1.5;
      ctx.drawImage(o.smear, b.x - o.trail + jit, b.y - o.pad, o.smear.width, o.smear.height);
    });
    // particles
    const rate = W < 700 ? 34 : 70;
    let n = rate * dt; while(n > 0){ if(Math.random() < n) spawn(); n -= 1; }
    for(let i=P.length-1;i>=0;i--){
      const p = P[i]; p.life += dt; p.x -= p.v*dt;
      const fade = Math.min(1, p.life*6) * Math.max(0, 1 - p.life/1.2);
      if(p.x + p.len < -20 || fade <= 0){ P.splice(i,1); continue; }
      const g = ctx.createLinearGradient(p.x, 0, p.x + p.len, 0);
      g.addColorStop(0, `rgba(${p.c},0)`); g.addColorStop(.7, `rgba(${p.c},${p.a*fade*.6})`); g.addColorStop(1, `rgba(${p.c},${p.a*fade})`);
      ctx.globalAlpha = 1; ctx.fillStyle = g;
      ctx.fillRect(p.x, p.y - p.w/2, p.len, p.w);
    }
    if(P.length > 220) P.splice(0, P.length - 220);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  function drawStill(){
    ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation='lighter';
    A.forEach(o => { ctx.globalAlpha=.7; ctx.drawImage(o.smear, o.box.x - o.trail, o.box.y - o.pad); });
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  }
  function start(){ if(running || !visible) return; running = true; last = 0; requestAnimationFrame(frame); }
  function stop(){ running = false; }
  new IntersectionObserver(es => { visible = es[0].isIntersecting; visible && !still ? start() : stop(); }).observe(hero);
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : (visible && !still && start()));
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { resize(); if(still) drawStill(); }, 150); });
  document.addEventListener('route', () => stop(), { once:true });
}

function initKitTeaser(){
  const host = $('#kitx'); if(!host) return;
  const ans = { ...(State.kitDraft || {}) };
  let step = 0;
  const render = (dir=0) => {
    const done = step >= KIT_Q.length;
    const sp = ans.sport || 'cricket', s = sportById(sp);
    const photo = IMG(KIT_PHOTOS[sp][step % KIT_PHOTOS[sp].length]);
    let left;
    if(done){
      const purpose = KIT_Q[1].opts.find(o=>o.v===ans.purpose)?.l, budget = inr(ans.budget);
      left = `<span class="kq-n">Ready</span><h3 class="kq-q">Your answers are saved</h3>
        <ul class="kq-sum"><li><span>Sport</span><b>${s.name}</b></li><li><span>For</span><b>${purpose}</b></li><li><span>Budget</span><b>${budget}</b></li></ul>
        <p class="kq-note">The kit builder picks up from here with two more quick questions.</p>
        <div class="kq-foot"><button class="kq-back" type="button">Edit</button><a class="kq-next" href="#/kit/${sp}">Continue${icon('arrow')}</a></div>`;
    } else {
      const Q = KIT_Q[step];
      left = `<div class="kq-dots" aria-hidden="true">${KIT_Q.map((_,i)=>`<i class="${i<step?'d':i===step?'c':''}"></i>`).join('')}${'<i></i>'.repeat(3)}</div>
        <span class="kq-n">Question 0${step+1} <span>of 06</span></span>
        <h3 class="kq-q" id="kq-q">${Q.q}</h3>
        ${Q.range?'':'<span class="kq-sel">Select only one</span>'}
        ${Q.range ? rangeHTML(ans.budget, ans) : `<div class="kq-opts" role="radiogroup" aria-labelledby="kq-q">${Q.opts.map(o=>`<button type="button" role="radio" class="kq-o" aria-checked="${ans[Q.key]===o.v}" data-v="${o.v}"><i></i>${o.l}</button>`).join('')}</div>`}
        ${Q.note?`<p class="kq-note">${Q.note}</p>`:''}
        <p class="kq-err" role="alert" hidden>Pick one option to continue.</p>
        <div class="kq-foot">${step>0?'<button class="kq-back" type="button">Back</button>':'<span></span>'}<button class="kq-next" type="button">Next${icon('arrow')}</button></div>`;
    }
    host.innerHTML = `<div class="kq-stack"><i></i><i></i></div>
      <div class="kq ${dir>0?'in-r':dir<0?'in-l':''}">
        <div class="kq-l">${left}</div>
        <div class="kq-r"><div class="kq-photo"><img src="${photo}" alt="" class="kq-img kq-img-${sp} kq-step-${Math.min(step,3)}"><span class="kq-tag">${icon(s.icon)}${s.name}</span></div></div>
      </div>`;
    const card = $('.kq', host);
    if(KIT_Q[step]?.range) bindRange(card, v => { ans.budget = v; State.kitDraft = { ...ans }; State.emit(); });
    $$('.kq-o', card).forEach(b => b.addEventListener('click', () => {
      const Q = KIT_Q[step]; ans[Q.key] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v;
      State.kitDraft = { ...ans }; State.emit();
      $$('.kq-o', card).forEach(x => x.setAttribute('aria-checked', x===b)); $('.kq-err', card).hidden = true;
      if(Q.key==='sport'){ const im = $('.kq-img', card); im.src = IMG(KIT_PHOTOS[ans.sport][0]); im.className = 'kq-img kq-img-'+ans.sport; const t=$('.kq-tag',card); const ss=sportById(ans.sport); t.innerHTML = icon(ss.icon)+ss.name; }
    }));
    $('.kq-back', card)?.addEventListener('click', () => { step = Math.max(0, step-1); render(-1); $('.kq-o[aria-checked="true"], .kq-o', host)?.focus(); });
    const nx = $('button.kq-next', card);
    nx?.addEventListener('click', () => {
      const Q = KIT_Q[step];
      if(Q.range && !ans.budget){ ans.budget = KIT_BUDGET.def; State.kitDraft = { ...ans }; State.emit(); }
      if(ans[Q.key] === undefined){ $('.kq-err', card).hidden = false; $('.kq-o', card).focus(); return; }
      step++; render(1); ($('.kq-o', host) || $('.kq-next', host)).focus();
    });
    $('.kq-opts', card)?.addEventListener('keydown', e => { const l=$$('.kq-o',card), i=l.indexOf(document.activeElement);
      if(['ArrowDown','ArrowRight'].includes(e.key)){ e.preventDefault(); l[(i+1)%l.length].focus(); }
      if(['ArrowUp','ArrowLeft'].includes(e.key)){ e.preventDefault(); l[(i-1+l.length)%l.length].focus(); } });
  };
  render();
}

function initFooter(){
  const f = $('#ft-news'); if(!f) return;
  const email = $('#ft-email'), consent = $('#ft-consent'), msg = $('#ft-msg'), btn = $('button[type=submit]', f);
  let busy = false;
  const say = (t, kind) => { msg.textContent = t; msg.dataset.k = kind || ''; };
  email.addEventListener('input', () => { email.removeAttribute('aria-invalid'); if(msg.dataset.k==='err') say(''); });
  f.addEventListener('submit', e => {
    e.preventDefault(); if(busy) return;
    const v = email.value.trim();
    if(!v){ email.setAttribute('aria-invalid','true'); say('Enter your email address.', 'err'); email.focus(); return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){ email.setAttribute('aria-invalid','true'); say('That email doesn’t look complete. Check for a missing @ or domain.', 'err'); email.focus(); return; }
    if(!consent.checked){ say('Tick the box to confirm you want marketing emails.', 'err'); consent.focus(); return; }
    busy = true; btn.disabled = true; btn.classList.add('loading'); say('Subscribing…');
    setTimeout(() => { busy = false; btn.disabled = false; btn.classList.remove('loading');
      f.classList.add('done'); say(`You’re on the list as ${v}. This is a demo, so no email will be sent.`, 'ok'); email.value=''; consent.checked=false; }, 700);
  });

/* ───────── Phase 3: listings (sport, equipment, accessories, search) ─────────
   Filter state lives in the URL query, so Back/Forward and returning from a product
   restore the exact filters and scroll position (spec §3, §13). */
const SORTS = [['featured','Featured'],['price-asc','Price: low to high'],['price-desc','Price: high to low'],['name','Name A–Z']];
const PRICE_BANDS = [['0-999','Under ₹1,000',0,999],['1000-2999','₹1,000 – ₹2,999',1000,2999],['3000-5999','₹3,000 – ₹5,999',3000,5999],['6000-','₹6,000 and above',6000,1e9]];
const STOP = new Set(['and','the','&','cricket','badminton','football','basketball','tennis','running','starter','kits','kit']);
const sing = w => w.replace(/(es|s)$/,'').replace(/ie$/,'y');
function subMatch(p, sub){
  if(!sub) return true;
  const rule = SUB_RULES[sub.toLowerCase()]; if(rule) return rule(p);
  const toks = sub.toLowerCase().split(/[^a-z]+/).filter(t => t && !STOP.has(t)).map(sing);
  if(!toks.length) return true;
  const hay = `${p.name} ${p.attr} ${CATS[p.cat]?.name||''} ${p.cat}`.toLowerCase();

/* search: keeps the shopper's query; offers a correction without silently changing it (spec §14) */
const VOCAB = ['bat','ball','racket','shuttle','shuttlecock','helmet','gloves','pads','boots','shoes','socks','cap','bottle','cones','stumps','guard','bag','roller','ice bag','headband','wristband','shaker','football','cricket','badminton','basketball','tennis','running','keeper','willow','grip'];
function lev(a,b){ const d=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[b.length]; }

/* keep spec callouts clear of the gallery arrows and the stage edge: shorten the leader line, then wrap, then flip sides */
function fitCallouts(stage){
  if(!stage || !stage.isConnected) return;
  const sr = stage.getBoundingClientRect(); if(!sr.width) return;
  const nav = $$('.pd-nav', stage).map(n=>n.getBoundingClientRect()).filter(r=>r.width);
  const padL = nav.length ? Math.max(...nav.filter(r=>r.left < sr.left + sr.width/2).map(r=>r.right - sr.left), 0) + 10 : 16;
  const padR = nav.length ? Math.max(...nav.filter(r=>r.left > sr.left + sr.width/2).map(r=>sr.right - r.left), 0) + 10 : 16;
  $$('.gv-ps .gv-pt', stage).forEach(pt => {
    const ln = $('.gv-ln', pt), lb = $('.gv-lb', pt); if(!ln || !lb) return;
    ln.style.width = ''; lb.style.left = ''; lb.style.right = ''; lb.style.maxWidth = ''; lb.style.top = '';
    if(pt.dataset.flip){ ln.classList.toggle('l'); ln.classList.toggle('r'); lb.classList.toggle('l'); lb.classList.toggle('r'); delete pt.dataset.flip; }
    const x = pt.getBoundingClientRect().left - sr.left, W0 = lb.offsetWidth, L0 = ln.offsetWidth;
    const room = side => side === 'r' ? (sr.width - padR) - x : x - padL;     // space from the dot to the safe edge
    const fit = side => { const R = room(side); let L = L0, w = W0;
      if(L + 14 + w > R) L = Math.max(18, R - 14 - w);
      if(L + 14 + w > R) w = Math.max(96, R - 14 - L);
      return { L, w, ok: L + 14 + w <= R + 1 }; };
    let side = lb.classList.contains('r') ? 'r' : 'l', f = fit(side);
    if(!f.ok){ const o = side === 'r' ? 'l' : 'r', g = fit(o); if(g.ok || room(o) > room(side)){ ln.classList.replace(side, o); lb.classList.replace(side, o); pt.dataset.flip = 1; side = o; f = g; } }
    ln.style.width = f.L + 'px'; lb.style.maxWidth = f.w + 'px';
    lb.style[side === 'r' ? 'left' : 'right'] = (f.L + 14) + 'px';
    const v = lb.getBoundingClientRect();     // still touching an arrow? nudge the label above it
    nav.forEach(r => { if(v.right > r.left && v.left < r.right && v.bottom > r.top && v.top < r.bottom) lb.style.top = (parseFloat(getComputedStyle(lb).top) - (v.bottom - r.top) - 8) + 'px'; });
  });
}

    }, 450);

/* demo delivery rules — clearly a simulation, never a promise */
function deliveryFor(pin, pr, sel){
  if(/^(744|737|790|791|792|793|794|795|796|797|798|799)/.test(pin)) return { ok:false, msg:`We don’t deliver to ${pin} yet (demo rule). Try another pincode, or save the item for later.` };
  const metro = /^(11|40|41|56|60|70|50|38|30|12|20)/.test(pin);
  const d = n => { const t = new Date(); t.setDate(t.getDate()+n); return t.toLocaleDateString('en-IN',{ weekday:'short', day:'numeric', month:'short' }); };
  const free = pr.price >= 999;
  const methods = [{ name:'Standard delivery', when: metro ? `${d(3)} – ${d(5)}` : `${d(5)} – ${d(8)}`, cost: free ? 'Free' : '₹79' }];
  if(metro) methods.push({ name:'Express', when:`by ${d(2)}`, cost:'₹149' });
  return { ok:true, methods, note: free ? 'Free standard delivery on orders over ₹999.' : 'Add ₹'+(999-pr.price)+' more for free standard delivery.' };
}

const LEVEL_NOTE = { beginner:'Chosen for control and comfort while you learn.', club:'A step up in performance for regular club play.', competitive:'Match-ready spec for competitive play.' };

];

const KIT_BUDGET = { min:2000, max:40000, step:500, def:10000 };

/* resolve the template for a sport + answers into concrete item lists */
function kitItems(ans){
  const T = KIT_TPL[ans.sport]; if(!T) return { core:[], opt:[] };
  const matchy = ans.purpose==='matches' || ans.purpose==='upgrade' || ans.level==='competitive';
  const feather = ['bd-tube-4','Feather shuttles (tube of 12)', matchy ? 'Goose-feather shuttles fly true for matches.' : 'For match days; keep a practice tube for drills.'];
  const nylon = ['bd-tube-1','Practice shuttles (tube of 12)', matchy ? 'A cheaper duck-feather tube for drills.' : 'A budget duck-feather tube for regular practice.'];
  const map = list => list.flatMap(e => e[0]==='$shuttle' ? [matchy ? feather : nylon] : [e]);
  let core = map(T.core), opt = map(T.opt);
  if(ans.sport==='badminton') opt = [matchy ? nylon : feather, ...opt];
  const lvl = LEVEL_NOTE[ans.level];
  core = core.map((e,i) => i===0 && lvl ? [e[0], e[1], `${e[2]} ${lvl}`] : e);
  // at least four core items still to buy: if you already own some, promote extras into the core
  const own = (ans.own||[]).filter(x=>x!=='__none');
  const free = core.filter(e => !own.includes(e[0])), owned = core.filter(e => own.includes(e[0]));
  let extra = opt.filter(e => !own.includes(e[0]));
  while(free.length < 4 && extra.length) free.push(extra.shift());
  return { core:[...free, ...owned], opt: extra.slice(0,3), gap:T.gap };
}
const kitShorts = sport => { const T = KIT_TPL[sport]; return T.core.filter(e=>e[0]!=='$shuttle'); };
const coreFrom = ans => kitItems(ans).core.filter(e => !(ans.own||[]).includes(e[0])).reduce((a,e)=>a+productById(e[0]).price, 0);

function rangeHTML(val, ans){
  const v = val || KIT_BUDGET.def, pct = (v-KIT_BUDGET.min)/(KIT_BUDGET.max-KIT_BUDGET.min)*100;
  const core = ans && ans.sport ? coreFrom(ans) : 0;
  return `<div class="kb">
    <div class="kb-top"><output class="kb-v" id="kb-v" for="kb-r">${inr(v)}</output>${core ? `<span class="kb-fit" id="kb-core" data-core="${core}"></span>` : ''}</div>
    <input type="range" class="kb-r" id="kb-r" min="${KIT_BUDGET.min}" max="${KIT_BUDGET.max}" step="${KIT_BUDGET.step}" value="${v}" style="--p:${pct}%" aria-label="Budget in rupees" aria-valuetext="${inr(v)}">
    <div class="kb-scale" aria-hidden="true"><span>₹2k</span><span>₹40k</span></div>
  </div>`;
}
function bindRange(root, onChange){
  const r = $('#kb-r', root); if(!r) return;
  const upd = () => { const v = +r.value; r.style.setProperty('--p', (v-KIT_BUDGET.min)/(KIT_BUDGET.max-KIT_BUDGET.min)*100+'%'); r.setAttribute('aria-valuetext', inr(v)); const o = $('#kb-v', root); if(o) o.textContent = inr(v);
    const c = $('#kb-core', root); if(c){ const core = +c.dataset.core, ok = v >= core; c.className = 'kb-fit ' + (ok ? 'ok' : 'short'); c.innerHTML = ok ? `${icon('check')}Covers core gear` : `Core gear from ${inr(core)}`; }
    onChange(v); };
  r.addEventListener('input', upd); upd();
}

/* mobile number: digits only, exactly 10, with a specific message for whatever the person tried to type */
function phoneGuard(root, id){
  const i = $('#'+id, root); if(!i) return; i.maxLength = 10; i.setAttribute('inputmode','numeric'); i.setAttribute('pattern','[0-9]{10}');
  let t; const say = m => { setErr(root, id, m); clearTimeout(t); if(m) t = setTimeout(()=>{ if(/^\d{0,10}$/.test(i.value)) setErr(root, id, ''); }, 3200); };
  const why = txt => /[a-z]/i.test(txt) ? `Letters can’t be used in a mobile number. Type digits 0–9 only.`
    : /\s/.test(txt) ? 'No spaces needed. Type the 10 digits together.'
    : /\+/.test(txt) ? 'No country code needed. Enter the 10-digit number without +91.'
    : `Special characters like “${txt.replace(/[\d\s]/g,'').slice(0,1)}” can’t be used. Type digits 0–9 only.`;
  i.addEventListener('beforeinput', e => {
    if(!e.data || !/^insert/.test(e.inputType)) return;
    const sel = (i.selectionEnd||0) - (i.selectionStart||0), room = 10 - (i.value.length - sel);
    if(/\D/.test(e.data) && e.inputType !== 'insertFromPaste'){ e.preventDefault(); say(why(e.data)); return; }
    if(e.inputType !== 'insertFromPaste' && e.data.length > room){ e.preventDefault(); say('A mobile number has exactly 10 digits. You’ve already entered all 10.'); }
  });
  i.addEventListener('paste', e => {
    const raw = (e.clipboardData || window.clipboardData)?.getData('text') || ''; e.preventDefault();
    let d = raw.replace(/\D/g,''); if(/^\s*(\+?91|0)[\s-]*\d/.test(raw) && d.length > 10) d = d.replace(/^(91|0)/,'');
    const s0 = i.selectionStart||0, s1 = i.selectionEnd||0, v = i.value.slice(0,s0) + d + i.value.slice(s1);
    i.value = v.slice(0,10); i.setSelectionRange(Math.min(10, s0+d.length), Math.min(10, s0+d.length));
    if(/[^\d\s+\-()]/.test(raw)) say(why(raw.replace(/\d/g,''))); else if(v.length > 10) say('Only the first 10 digits were kept. A mobile number has exactly 10 digits.'); else say('');
  });
  i.addEventListener('input', () => { const c = i.value.replace(/\D/g,'').slice(0,10); if(c !== i.value){ i.value = c; } if(/^\d{0,10}$/.test(i.value) && $('#f-'+id, root)?.classList.contains('bad') && !t) setErr(root, id, ''); });
}

    <div class="au-card"><span class="eyebrow">Your account</span><h1 class="wide au-h">${title}</h1><p class="au-lead">${lead}</p>${inner}</div>
    <aside class="au-side" aria-hidden="true"><div class="au-art"><span class="gv-word">OUTPACE</span><img src="${IMG('p-helmet')}" alt="" class="au-o1"><img src="${IMG('p-bdshoes')}" alt="" class="au-o2"><img src="${IMG('p-basketball')}" alt="" class="au-o3"></div>
      <ul class="au-perks"><li>${icon('truck')}<span><b>Track every order</b>From packed to delivered, in one place.</span></li><li>${icon('layers')}<span><b>Kits and saved gear</b>Pick up where you left off on any device.</span></li><li>${icon('arrowL')}<span><b>Easy returns</b>Start a return in a few taps.</span></li></ul>${side}</aside></div>
    <p class="au-demo">${icon('info')}Demo accounts are stored only in this browser. Don’t use a real password.</p></div></div>`);
}

function signInPage(p){
  const next = nextFrom(p), why = p.q.get('why');
  const el = authShell('Sign in', why==='checkout' ? 'Sign in to check out. Your cart stays exactly as it is.' : 'Welcome back. Sign in with your email and password.',
    `${p.q.get('reset') ? `<p class="au-ok">${icon('check')}Password updated. Sign in with your new password.</p>` : ''}
    <form class="au-form" id="au-f" novalidate>
      ${field({ id:'si-email', label:'Email', type:'email', ac:'email', value:p.q.get('email')||'' })}
      ${field({ id:'si-pw', label:'Password', type:'password', ac:'current-password' })}
      <div class="au-row"><span></span><a class="pd-link" href="#/account/forgot${p.q.get('email')?'?email='+encodeURIComponent(p.q.get('email')):''}">Forgot password?</a></div>
      <p class="au-err" id="au-err" role="alert" hidden></p>
      <button class="btn btn-fire au-go" type="submit">${icon('user')}<span>Sign in</span></button>
    </form>
    <p class="au-alt">New to Outpace? <a class="pd-link" href="#/account/create?next=${encodeURIComponent(next)}${why?'&why='+why:''}">Create an account</a></p>`);
  bindEyes(el);
  let fails = 0, lockUntil = 0;
  $('#au-f', el).addEventListener('submit', async e => {
    e.preventDefault(); const em = $('#si-email', el).value.trim(), pw = $('#si-pw', el).value, err = $('#au-err', el), btn = $('.au-go', el);
    err.hidden = true; setErr(el,'si-email',''); setErr(el,'si-pw','');
    if(Date.now() < lockUntil){ err.hidden = false; err.textContent = `Too many attempts. Try again in ${Math.ceil((lockUntil-Date.now())/1000)} seconds, or reset your password.`; return; }
    let bad = false;
    if(!em){ setErr(el,'si-email','Enter your email address.'); bad = true; } else if(!EMAIL_RE.test(em)){ setErr(el,'si-email','Enter an email like name@example.com.'); bad = true; }
    if(!pw){ setErr(el,'si-pw','Enter your password.'); bad = true; }
    if(bad){ $('[aria-invalid="true"]', el).focus(); return; }
    busyBtn(btn, true, 'Signing in…'); await new Promise(r=>setTimeout(r, 650));
    const acc = State.accounts.find(a => a.email === em.toLowerCase());
    if(!acc){ busyBtn(btn, false, 'Sign in'); err.hidden = false; err.innerHTML = `There’s no account for ${esc(em)}. <a class="pd-link" href="#/account/create?email=${encodeURIComponent(em)}&next=${encodeURIComponent(next)}">Create one</a> or check the spelling.`; $('#si-email', el).focus(); return; }
    if(acc.pw !== await sha(pw)){ fails++; busyBtn(btn, false, 'Sign in');
      if(fails >= 5){ lockUntil = Date.now() + 30000; fails = 0; err.hidden = false; err.textContent = 'Too many attempts. Wait 30 seconds or reset your password.'; return; }
      setErr(el,'si-pw', `That password doesn’t match. ${5-fails} attempt${5-fails!==1?'s':''} left before a short pause.`); $('#si-pw', el).select(); return; }
    State.user = { name: acc.name, email: acc.email }; State.emit(); toast(`Signed in. Welcome back, ${acc.name.split(' ')[0]}.`);
    location.hash = next;
  });
  setTimeout(() => $(p.q.get('email') ? '#si-pw' : '#si-email', el)?.focus(), 60);
  return el;
}

function createPage(p){
  const next = nextFrom(p), why = p.q.get('why');
  const el = authShell('Create account', why==='checkout' ? 'Create an account to check out. It takes under a minute, and your cart comes with you.' : 'Track orders, keep addresses and save kits on every device.',
    `<form class="au-form" id="au-f" novalidate>
      ${field({ id:'cr-name', label:'Full name', ac:'name' })}
      ${field({ id:'cr-phone', label:'Mobile number', type:'tel', ac:'tel', mode:'numeric', hint:'10 digits, numbers only. Our delivery partner calls this number.' })}
      ${field({ id:'cr-email', label:'Email', type:'email', ac:'email', value:p.q.get('email')||'', hint:'We’ll send order updates here.' })}
      ${field({ id:'cr-pw', label:'Create password', type:'password', ac:'new-password' })}
      <ul class="pw-rules" id="pw-rules" aria-live="polite"></ul>
      ${field({ id:'cr-pw2', label:'Confirm password', type:'password', ac:'new-password' })}
      <label class="ck-line" id="f-cr-terms"><input type="checkbox" id="cr-terms"><span class="bx" aria-hidden="true">${icon('check')}</span><span>I agree to the <a class="pd-link" href="#/terms">Terms</a> and <a class="pd-link" href="#/privacy">Privacy Policy</a>.</span></label>
      <p class="fld-e" id="cr-terms-e" role="alert" hidden></p>
      <label class="ck-line"><input type="checkbox" id="cr-news"><span class="bx" aria-hidden="true">${icon('check')}</span><span>Send me new gear and kit ideas by email (optional).</span></label>
      <p class="au-err" id="au-err" role="alert" hidden></p>
      <button class="btn btn-fire au-go" type="submit">${icon('user')}<span>Create account</span></button>
    </form>
    <p class="au-alt">Already have an account? <a class="pd-link" href="#/account/signin?next=${encodeURIComponent(next)}${why?'&why='+why:''}">Sign in</a></p>`);
  bindEyes(el); phoneGuard(el, 'cr-phone');
  const rules = $('#pw-rules', el), pw = $('#cr-pw', el), em = $('#cr-email', el);
  const drawRules = () => { rules.innerHTML = pwRules(pw.value, em.value).map(([k,l,ok])=>`<li class="${ok?'ok':''}">${icon(ok?'check':'close')}${l}</li>`).join(''); };
  pw.addEventListener('input', drawRules); em.addEventListener('input', drawRules); drawRules();
  $('#au-f', el).addEventListener('submit', async e => {
    e.preventDefault(); const phone = $('#cr-phone', el).value.replace(/\D/g,''), name = $('#cr-name', el).value.trim(), email = em.value.trim(), p1 = pw.value, p2 = $('#cr-pw2', el).value, btn = $('.au-go', el), err = $('#au-err', el);
    ['cr-name','cr-phone','cr-email','cr-pw','cr-pw2'].forEach(i=>setErr(el,i,'')); $('#cr-terms-e', el).hidden = true; err.hidden = true;
    if(name.length < 2) setErr(el,'cr-name', name ? 'Enter your full name.' : 'Enter your name.');
    else if(!/^[a-zÀ-ɏ .'-]+$/i.test(name)) setErr(el,'cr-name','Use letters, spaces, apostrophes or hyphens only.');
    if(phoneMsg(phone)) setErr(el,'cr-phone',phoneMsg(phone));
    if(!email) setErr(el,'cr-email','Enter your email address.'); else if(!EMAIL_RE.test(email)) setErr(el,'cr-email','Enter an email like name@example.com.');
    else if(State.accounts.some(a=>a.email===email.toLowerCase())){ setErr(el,'cr-email',''); err.hidden = false; err.innerHTML = `An account already exists for ${esc(email)}. <a class="pd-link" href="#/account/signin?email=${encodeURIComponent(email)}&next=${encodeURIComponent(next)}">Sign in instead</a>`; }
    const r = pwRules(p1, email); if(!p1) setErr(el,'cr-pw','Create a password.'); else if(r.some(x=>!x[2])) setErr(el,'cr-pw','Your password doesn’t meet all the rules below.');
    if(!p2) setErr(el,'cr-pw2','Confirm your password.'); else if(p1 && p2 !== p1) setErr(el,'cr-pw2','Passwords don’t match.');
    if(!$('#cr-terms', el).checked){ const t = $('#cr-terms-e', el); t.hidden = false; t.textContent = 'Agree to the Terms and Privacy Policy to continue.'; }
    const first = $('[aria-invalid="true"]', el) || (!$('#cr-terms', el).checked && $('#cr-terms', el)); if(first || !err.hidden){ (first || em).focus(); return; }
    busyBtn(btn, true, 'Creating account…'); await new Promise(r=>setTimeout(r, 750));
    State.accounts.push({ name, phone, email: email.toLowerCase(), pw: await sha(p1), news: $('#cr-news', el).checked, at: new Date().toISOString() });
    State.user = { name, phone, email: email.toLowerCase() }; State.emit(); toast(`Account created. Welcome to Outpace, ${name.split(' ')[0]}.`);
    location.hash = next;
  });
  setTimeout(() => $('#cr-name', el)?.focus(), 60);
  return el;
}

function forgotPage(p){
  let step = 'ask', email = p.q.get('email') || '', code = '';
  const el = authShell('Reset password', 'Enter your account email and we’ll send a 6-digit code to reset your password.', `<div id="fg"></div>`);
  const host = $('#fg', el); bindEyes(el);
  const draw = () => {
    if(step==='ask') host.innerHTML = `<form class="au-form" id="fg-f" novalidate>${field({ id:'fg-email', label:'Email', type:'email', ac:'email', value:email })}<p class="au-err" id="au-err" role="alert" hidden></p><button class="btn btn-fire au-go" type="submit">${icon('arrow')}<span>Send code</span></button></form><p class="au-alt"><a class="pd-link" href="#/account/signin">Back to sign in</a></p>`;
    if(step==='code') host.innerHTML = `<p class="au-ok">${icon('check')}If an account exists for ${esc(email)}, we’ve sent a 6-digit code. It expires in 10 minutes.</p>
      <div class="au-demo-code">${icon('info')}<span>Demo email: your code is <b>${code}</b></span></div>
      <form class="au-form" id="fg-f" novalidate>${field({ id:'fg-code', label:'6-digit code', mode:'numeric', ac:'one-time-code', extra:'maxlength="6"' })}${field({ id:'fg-pw', label:'New password', type:'password', ac:'new-password' })}<ul class="pw-rules" id="pw-rules"></ul>
      <p class="au-err" id="au-err" role="alert" hidden></p><button class="btn btn-fire au-go" type="submit">${icon('check')}<span>Update password</span></button></form>
      <p class="au-alt">Didn’t get it? <button type="button" class="pd-link" data-resend>Send a new code</button></p>`;
    const pw = $('#fg-pw', host); if(pw){ const rr = $('#pw-rules', host); const d = () => rr.innerHTML = pwRules(pw.value, email).map(([k,l,ok])=>`<li class="${ok?'ok':''}">${icon(ok?'check':'close')}${l}</li>`).join(''); pw.addEventListener('input', d); d(); }
    setTimeout(()=>$('input', host)?.focus(), 40);
  };
  host.addEventListener('click', e => { if(e.target.closest('[data-resend]')){ code = String(Math.floor(100000+Math.random()*900000)); draw(); toast('New code sent (demo).'); } });
  host.addEventListener('submit', async e => {
    e.preventDefault(); const btn = $('.au-go', host), err = $('#au-err', host); err.hidden = true;
    if(step==='ask'){ email = $('#fg-email', host).value.trim(); setErr(host,'fg-email','');
      if(!EMAIL_RE.test(email)){ setErr(host,'fg-email', email ? 'Enter an email like name@example.com.' : 'Enter your email address.'); $('#fg-email', host).focus(); return; }
      busyBtn(btn, true, 'Sending…'); await new Promise(r=>setTimeout(r,700)); code = String(Math.floor(100000+Math.random()*900000)); step = 'code'; draw(); return; }
    const c = $('#fg-code', host).value.trim(), np = $('#fg-pw', host).value; setErr(host,'fg-code',''); setErr(host,'fg-pw','');
    if(!/^\d{6}$/.test(c)){ setErr(host,'fg-code','Enter the 6-digit code from the email.'); $('#fg-code', host).focus(); return; }
    if(c !== code){ setErr(host,'fg-code','That code isn’t right. Check the email or send a new code.'); $('#fg-code', host).select(); return; }
    if(pwRules(np, email).some(x=>!x[2])){ setErr(host,'fg-pw','Choose a password that meets all the rules below.'); $('#fg-pw', host).focus(); return; }
    busyBtn(btn, true, 'Updating…'); await new Promise(r=>setTimeout(r,600));
    const acc = State.accounts.find(a => a.email === email.toLowerCase()); if(acc){ acc.pw = await sha(np); State.emit(); }
    location.hash = `/account/signin?reset=1&email=${encodeURIComponent(email)}`;
  });
  draw();
  return el;
}

   Everything is simulated. Demo failure paths: UPI ID fail@upi, card 4000 0000 0000 0002, "Demo Bank (declines)". */
const IN_STATES = ['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat','Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal'];
const IN_UTS = ['Andaman and Nicobar Islands','Chandigarh','Dadra and Nagar Haveli and Daman and Diu','Delhi','Jammu and Kashmir','Ladakh','Lakshadweep','Puducherry'];
const PIN_STATE = [[/^11/,'Delhi'],[/^1[23]/,'Haryana'],[/^14|^15/,'Punjab'],[/^16/,'Chandigarh'],[/^17/,'Himachal Pradesh'],[/^18|^19/,'Jammu and Kashmir'],[/^2[0-8]/,'Uttar Pradesh'],[/^3[0-4]/,'Rajasthan'],[/^36|^37|^38|^39/,'Gujarat'],[/^4[0-4]/,'Maharashtra'],[/^403/,'Goa'],[/^4[5-8]/,'Madhya Pradesh'],[/^49/,'Chhattisgarh'],[/^50/,'Telangana'],[/^5[1-3]/,'Andhra Pradesh'],[/^5[6-9]/,'Karnataka'],[/^60[0-6]|^6[1-4]/,'Tamil Nadu'],[/^605/,'Puducherry'],[/^6[7-9]/,'Kerala'],[/^7[0-4]/,'West Bengal'],[/^7[5-7]/,'Odisha'],[/^78/,'Assam'],[/^8[0-5]/,'Bihar'],[/^8[2-3]/,'Jharkhand']];
const stateForPin = pin => { let s = null; PIN_STATE.forEach(([re, n]) => { if(re.test(pin)) s = n; }); return s; };
const BANKS = ['State Bank of India','HDFC Bank','ICICI Bank','Axis Bank','Kotak Mahindra Bank','Bank of Baroda','Punjab National Bank','Yes Bank','Demo Bank (declines)'];
const luhn = n => { let s = 0, alt = false; for(let i = n.length-1; i >= 0; i--){ let d = +n[i]; if(alt){ d *= 2; if(d > 9) d -= 9; } s += d; alt = !alt; } return s % 10 === 0; };
const brandOf = n => /^4/.test(n) ? 'Visa' : /^(5[1-5]|2[2-7])/.test(n) ? 'Mastercard' : /^(60|65|81|82|508)/.test(n) ? 'RuPay' : /^3[47]/.test(n) ? 'Amex' : '';
const dateIn = n => { const t = new Date(); t.setDate(t.getDate()+n); return t; };
const fmtD = d => d.toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });

function bindAddressForm(f, editId, done){
  $('#ad-pin', f).addEventListener('input', e => { const v = e.target.value.replace(/\D/g,''); e.target.value = v; if(v.length===6){ const s = stateForPin(v); const dd = $('#ad-state', f); if(s && !dd.dataset.value){ $(`.dd-o[data-v="${CSS.escape(s)}"]`, dd)?.click(); $('#ad-pin', f).focus(); } } });
  $('#ad-phone', f).addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,''); });
  f.addEventListener('change', e => { if(e.target.name==='ad-type') $$('.ad-type .chip', f).forEach(c => c.classList.toggle('on', c.contains(e.target))); });
  f.addEventListener('submit', e => {
    e.preventDefault(); const g = id => $('#'+id, f).value.trim(); const v = { name:g('ad-name'), phone:g('ad-phone'), pin:g('ad-pin'), city:g('ad-city'), state:$('#ad-state', f).dataset.value, line1:g('ad-l1'), line2:g('ad-l2'), land:g('ad-land'), type:$('input[name=ad-type]:checked', f).value, def:$('#ad-def', f).checked };
    ['ad-name','ad-phone','ad-pin','ad-city','ad-l1','ad-l2'].forEach(i=>setErr(f,i,'')); const se = $('#ad-state-e', f); se.hidden = true; $('#f-ad-state', f).classList.remove('bad');
    if(v.name.length < 2) setErr(f,'ad-name','Enter the full name of the person receiving the order.');
    if(!/^[6-9]\d{9}$/.test(v.phone)) setErr(f,'ad-phone', v.phone ? 'Enter a 10-digit mobile number starting with 6, 7, 8 or 9.' : 'Enter a mobile number.');
    if(!/^[1-9]\d{5}$/.test(v.pin)) setErr(f,'ad-pin', v.pin ? 'Enter a valid 6-digit pincode.' : 'Enter the pincode.');
    else { const dd = deliveryFor(v.pin, { price:1 }); if(!dd.ok) setErr(f,'ad-pin', dd.msg); }
    if(v.city.length < 2) setErr(f,'ad-city','Enter the city or town.');
    if(!v.state){ se.hidden = false; se.textContent = 'Choose a state or union territory.'; $('#f-ad-state', f).classList.add('bad'); }
    if(v.line1.length < 2) setErr(f,'ad-l1','Enter the flat or house number and building.');
    if(v.line2.length < 3) setErr(f,'ad-l2','Enter the area or street.');
    const bad = $('[aria-invalid="true"]', f) || (!v.state && $('#ad-state .dd-b', f)); if(bad){ bad.focus(); announce('Some address details need fixing'); return; }
    const id = editId || 'a' + Date.now().toString(36);
    if(v.def) State.addresses.forEach(x => x.def = false);
    const rec = { id, ...v }; const i = State.addresses.findIndex(x=>x.id===id); if(i>=0) State.addresses[i] = rec; else State.addresses.push(rec);
    if(!State.addresses.some(x=>x.def)) rec.def = true;
    State.pin = v.pin; State.emit(); toast(i>=0 ? 'Address updated' : 'Address saved');
    done(rec, i>=0);
  });
}

    document.body.appendChild(ov); announce('Processing payment');

    const a = A(), metro = t.metro;

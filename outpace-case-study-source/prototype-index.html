<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Outpace</title>
<meta name="description" content="Outpace — sports equipment and accessories for cricket, badminton, football, basketball, tennis and running. Portfolio concept.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Inter+Tight:wght@400;500;600;700&family=Kanit:ital,wght@1,800;1,900&family=Barlow+Condensed:ital,wght@1,800;1,900&display=swap">
<style>
/* OUTPACE — design tokens
   Layout concept: a night stadium. Near-black ground lit by one ember source (the hero orb);
   everything sporty is cut on a diagonal; cards are B&W at rest and catch fire on interaction. */
:root{
  color-scheme: dark;
  /* ground */
  --ink:#0b0807;          /* page */
  --ink-1:#100c0b;        /* raised band */
  --ink-2:#161110;        /* card */
  --ink-3:#201918;        /* card hover / input */
  --ink-4:#2c2321;        /* strokes on dark */
  --line:rgba(255,236,224,.09);
  --line-2:rgba(255,236,224,.16);
  /* light */
  --bone:#f4ede7;         /* primary text */
  --bone-2:#d9cfc8;
  --ash:#a0948d;          /* secondary text */
  --ash-2:#776b65;        /* tertiary */
  /* fire (from refs 1–9) */
  --ember:#ff5a1f;        /* primary action */
  --ember-2:#ff7a2e;
  --flare:#ff9a3c;
  --sun:#ffc272;
  --blood:#b3200e;
  --char:#3a0d05;
  --ok:#5fd18b; --warn:#ffb547; --err:#ff5d5d;

  --grad-speed: linear-gradient(100deg,#1a0503 0%,#6e1406 26%,#d33a0f 55%,#ff7a2e 78%,#ffc272 100%);
  --grad-ember: linear-gradient(135deg,#ff8a2a 0%,#ff5a1f 45%,#c8270c 100%);
  --grad-dusk:  linear-gradient(180deg,#0b0807 0%,#1c0703 40%,#5a1405 75%,#e2541a 100%);
  --glow: 0 0 0 1px rgba(255,122,46,.35), 0 18px 60px -18px rgba(255,90,31,.55);

  /* type */
  --f-body:'Inter Tight', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-wide:'Archivo', 'Arial Black', 'Helvetica Neue', Arial, sans-serif;   /* used with font-stretch:125% */
  --f-label:'Archivo', 'Inter Tight', ui-sans-serif, system-ui, sans-serif;   /* small caps labels, set semi-expanded */
  --t-hero: clamp(64px, 9.6vw, 168px);
  --t-d1: clamp(40px, 5.6vw, 88px);
  --t-d2: clamp(30px, 3.6vw, 56px);
  --t-d3: clamp(22px, 2.2vw, 32px);
  --t-lg: 18px; --t-md: 15px; --t-sm: 13px; --t-xs: 11px;

  /* space & shape */
  --gut: clamp(16px, 3vw, 40px);
  --max: 1440px;
  --r-xs:8px; --r-sm:12px; --r-md:18px; --r-lg:26px; --r-pill:999px;
  --cut: 22px;            /* chamfer size for sporty corner cuts */
  --ease: cubic-bezier(.2,.8,.2,1);
  --ease-snap: cubic-bezier(.7,0,.2,1);
  --header-h: 76px;
}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--ink);-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:clip}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--f-body);font-size:var(--t-md);line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip}
img,svg,video,canvas{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
::selection{background:var(--ember);color:#160604}
:focus-visible{outline:2px solid var(--flare);outline-offset:3px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:16px;top:-60px;z-index:200;background:var(--bone);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600;transition:top .2s}
.skip:focus{top:12px}

/* film grain over everything — the refs all carry it */
.grain{pointer-events:none;position:fixed;inset:0;z-index:90;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

/* type roles */
.wide{font-family:var(--f-wide);font-stretch:125%;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;line-height:.92}
.cond{font-family:var(--f-wide);font-stretch:62%;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-.005em;line-height:.84}
.mono{font-family:var(--f-label);font-stretch:112%;font-weight:650;font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-label);font-stretch:112%;font-weight:650;font-size:var(--t-xs);letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--grad-ember);transform:skewX(-30deg)}
.muted{color:var(--ash)}
.fire-text{background:linear-gradient(100deg,#ff4d1a 0%,#ff7a2e 35%,#ffb257 62%,#ff7a2e 85%,#f04a18 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}

/* layout */
.wrap{width:100%;max-width:var(--max);margin-inline:auto;padding-inline:var(--gut)}
.section{position:relative;padding-block:clamp(56px,6.5vw,104px)}
.sec-head{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:24px 48px;align-items:end;margin-bottom:clamp(32px,4vw,56px)}
.sec-head h2{font-size:var(--t-d1);margin-top:14px}
.sec-head .sec-aside{display:flex;flex-direction:column;align-items:flex-start;gap:18px;color:var(--ash);max-width:44ch;justify-self:end}
@media (max-width:820px){.sec-head{grid-template-columns:1fr}.sec-head .sec-aside{justify-self:start}}

/* buttons */
.btn{--h:52px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;height:var(--h);padding:0 26px;border-radius:var(--r-pill);
  font-weight:600;font-size:15px;letter-spacing:.005em;white-space:nowrap;transition:transform .35s var(--ease),box-shadow .35s var(--ease),background-color .25s,color .25s;isolation:isolate}
.btn svg{width:18px;height:18px;transition:transform .35s var(--ease)}
.btn:hover svg{transform:translateX(4px)}
.btn:active{transform:scale(.97)}
.btn-fire{color:#1a0603;background:var(--grad-ember);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.btn-fire::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);background-size:250% 100%;background-position:120% 0;mix-blend-mode:soft-light;transition:background-position .9s var(--ease);z-index:-1}
.btn-fire:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn-fire:hover::after{background-position:-20% 0}
.btn-glass{color:var(--bone);background:rgba(255,240,230,.06);border:1px solid var(--line-2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn-glass:hover{background:rgba(255,240,230,.12);transform:translateY(-2px)}
.btn-ghost{height:auto;padding:0;border-radius:0;color:var(--bone);font-weight:600;gap:10px}
.btn-ghost span{background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .4s var(--ease)}
.btn-ghost:hover span{background-size:100% 1px}
.btn-sm{--h:40px;padding:0 18px;font-size:14px}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--bone);transition:background-color .2s}
.icon-btn:hover{background:rgba(255,240,230,.08)}
.icon-btn svg{width:20px;height:20px}
.badge{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ember);color:#1a0603;font:700 10px/17px var(--f-body);text-align:center}
.badge[data-n="0"]{display:none}

.chip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:var(--r-pill);background:rgba(255,240,230,.07);border:1px solid var(--line);font-size:12.5px;color:var(--bone-2);white-space:nowrap}
.chip svg{width:15px;height:15px}

/* the demo-data ribbon (spec §1: identify demo data) */
.demo-tag{display:inline-flex;align-items:center;gap:6px;font:650 10px/1 var(--f-label);font-stretch:112%;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);padding:5px 8px;border:1px dashed rgba(255,194,114,.45);border-radius:6px}

/* reveal on scroll — visible at rest, enhanced only when JS + motion allowed */
.js-motion .rv{opacity:.35;transform:translateY(34px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.js-motion .rv.in{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .grain{display:none}
}

/* label face everywhere it's used */
.sp-subs,.eq-items,.pp-specs dt,.scroll-cue,.phase-list li b,.mm-step .n{font-stretch:112%;font-weight:650}

/* ───────── header ───────── */
.hdr{position:fixed;inset:0 0 auto 0;z-index:60;padding-top:env(safe-area-inset-top,0px);transition:background-color .4s,backdrop-filter .4s,border-color .4s;border-bottom:1px solid transparent}
.hdr.solid,.hdr.menu-open{background:rgba(11,8,7,.74);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom-color:var(--line)}
.hdr-row{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"logo nav utils";align-items:center;height:var(--header-h);gap:16px}
.hdr-row .logo{grid-area:logo}.hdr-row .nav{grid-area:nav}.hdr-row .utils{grid-area:utils}
.logo{display:inline-flex;align-items:center;gap:12px;justify-self:start;color:var(--bone)}
.logo .mark{width:34px;height:31px;fill:var(--ember);transition:transform .6s var(--ease)}
.logo .word{width:118px;height:29px;fill:currentColor}
.logo:hover .mark{transform:translateX(3px) skewX(-8deg)}

.nav{display:flex;align-items:center;gap:4px;padding:5px;border-radius:var(--r-pill);background:rgba(255,240,230,.06);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.nav-btn{position:relative;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:var(--r-pill);font-size:14px;font-weight:500;color:var(--bone-2);transition:color .2s,background-color .25s}
.nav-btn .ic{width:15px;height:15px;transition:transform .3s var(--ease)}
.nav-btn:hover{color:var(--bone);background:rgba(255,240,230,.07)}
.nav-btn[aria-expanded="true"]{color:#120604;background:var(--bone)}
.nav-btn[aria-expanded="true"] .ic{transform:rotate(180deg)}
.nav-btn.kit{color:var(--bone)}
.nav-btn.kit .bolt{color:var(--ember)}
.nav-btn.kit[aria-expanded="true"]{color:#120604}
.nav-btn.kit[aria-expanded="true"] .bolt{color:var(--ember)}

.utils{display:flex;align-items:center;gap:2px;justify-self:end}
.acct-wrap{position:relative}
.acct-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 10px;margin-left:6px;border-radius:var(--r-pill);border:1px solid var(--line-2);font-size:13.5px;font-weight:500;transition:background-color .2s}
.acct-btn:hover,.acct-btn[aria-expanded="true"]{background:rgba(255,240,230,.08)}
.acct-btn .ic{width:18px;height:18px}
.pop{position:absolute;right:0;top:calc(100% + 12px);width:280px;padding:10px;border-radius:var(--r-md);background:rgba(22,17,16,.96);border:1px solid var(--line-2);box-shadow:0 30px 70px -20px rgba(0,0,0,.8);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transform-origin:top right;animation:popIn .28s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.pop-head{padding:12px 12px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.pop-head b{display:block;font-size:15px;margin-bottom:4px}
.pop-head p{font-size:13px;color:var(--ash);line-height:1.45}
.pop-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 6px 12px}
.pop-actions .btn{--h:40px;padding:0 12px;font-size:13.5px}
.pop-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--bone-2)}
.pop-link:hover{background:rgba(255,240,230,.06);color:var(--bone)}
.pop-link .ic{width:18px;height:18px;color:var(--ash)}

/* ───────── mega menu ───────── */
.mega{position:absolute;left:0;right:0;top:100%;padding:10px var(--gut) 0;pointer-events:none}
.mega-panel{pointer-events:auto;max-width:calc(var(--max) - 2*var(--gut));margin:0 auto;border-radius:var(--r-lg);background:#130e0d;border:1px solid var(--line-2);
  box-shadow:0 50px 120px -30px rgba(0,0,0,.9);overflow:hidden;animation:megaIn .38s var(--ease);
  clip-path:polygon(0 0,calc(100% - 34px) 0,100% 34px,100% 100%,0 100%)}
@keyframes megaIn{from{opacity:0;transform:translateY(-10px)}}
.mega-panel[hidden]{display:none}
.mega-in{display:grid;min-height:340px}

/* sport mega */
.mm-sport{grid-template-columns:290px minmax(0,1fr) 340px}
.mm-list{padding:18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.mm-sp{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:14px;text-align:left;transition:background-color .2s}
.mm-sp .ic{width:22px;height:22px;color:var(--ash);transition:color .2s}
.mm-sp b{display:block;font-size:15px;font-weight:600}
.mm-sp small{display:block;font-size:12px;color:var(--ash-2)}
.mm-sp:hover,.mm-sp[aria-selected="true"]{background:rgba(255,240,230,.06)}
.mm-sp[aria-selected="true"] .ic{color:var(--ember)}
.mm-sp .arr{margin-left:auto;opacity:0;width:16px;height:16px;transition:opacity .2s,transform .3s var(--ease)}
.mm-sp[aria-selected="true"] .arr{opacity:1;transform:translateX(2px)}
.mm-body{padding:30px 34px;display:flex;flex-direction:column;gap:22px}
.mm-body h3{font-size:30px}
.mm-body p{color:var(--ash);max-width:52ch;font-size:14px}
.mm-subs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 24px}
.mm-subs a{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--bone-2);transition:color .2s,padding .3s var(--ease)}
.mm-subs a .ic{width:15px;height:15px;opacity:0;transition:opacity .2s}
.mm-subs a:hover{color:var(--bone);padding-left:6px}
.mm-subs a:hover .ic{opacity:1;color:var(--ember)}
.mm-feature{position:relative;margin:14px;border-radius:20px;overflow:hidden;background:radial-gradient(120% 90% at 70% 20%,#5a1405 0%,#1c0703 55%,#0f0908 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:22px;min-height:300px}
.mm-feature img{position:absolute;right:-24px;top:-10px;width:78%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6));transition:transform .8s var(--ease)}
.mm-feature:hover img{transform:rotate(-6deg) scale(1.04)}
.mm-feature .mono{color:var(--sun)}
.mm-feature b{display:block;font-size:22px;margin:8px 0 14px;max-width:12ch}

/* equipment mega */
.mm-equip{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px}
.mm-tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:310px;padding:18px;border-radius:18px;overflow:hidden;isolation:isolate;background:linear-gradient(170deg,#211a18,#130e0d);border:1px solid var(--line)}
.mm-tile::before{content:"";position:absolute;inset:0;z-index:-2;opacity:0;transition:opacity .5s;background:radial-gradient(90% 70% at 55% 25%,#ff9a3c 0%,#ff5a1f 20%,#9c1f07 46%,#260703 75%,#120b0a 100%)}
.mm-objs{position:absolute;left:6%;right:6%;top:8%;height:52%;z-index:-1}
.mm-objs img{position:absolute;transform:rotate(var(--r));filter:drop-shadow(0 18px 18px rgba(0,0,0,.55));transition:transform .7s var(--ease)}
.mm-tile:hover::before,.mm-tile:focus-visible::before{opacity:1}
.mm-tile:hover .mm-objs img,.mm-tile:focus-visible .mm-objs img{transform:translateY(-8px) rotate(calc(var(--r) - 4deg)) scale(1.05)}
.mm-tile b{font-size:19px}
.mm-tile ul{margin-top:8px;font-size:12.5px;color:var(--bone-2);display:grid;gap:2px}

/* accessories mega */
.mm-acc{grid-template-columns:repeat(5,minmax(0,1fr)) 300px}
.mm-col{padding:28px 24px;border-right:1px solid var(--line)}
.mm-col .ic{width:26px;height:26px;color:var(--ember);margin-bottom:18px}
.mm-col b{display:block;font-size:15px;margin-bottom:12px}
.mm-col a{display:block;padding:6px 0;font-size:14px;color:var(--ash);transition:color .2s}
.mm-col a:hover{color:var(--bone)}
.mm-col .all{margin-top:10px;color:var(--bone);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.mm-col .all .ic{width:14px;height:14px;margin:0}

/* kit mega */
.mm-kit{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.mm-kit-l{padding:34px;display:flex;flex-direction:column;gap:18px;justify-content:center;background:radial-gradient(90% 120% at 0% 100%,rgba(255,90,31,.22),transparent 60%)}
.mm-kit-l h3{font-size:34px}
.mm-kit-l p{color:var(--ash);max-width:46ch}
.mm-quick{display:flex;flex-wrap:wrap;gap:8px}
.mm-quick a{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line-2);font-size:13px;transition:background-color .2s,border-color .2s}
.mm-quick a .ic{width:16px;height:16px;color:var(--ember)}
.mm-quick a:hover{background:rgba(255,90,31,.12);border-color:rgba(255,90,31,.5)}
.mm-steps{padding:28px 30px;display:grid;gap:10px;align-content:center;border-left:1px solid var(--line)}
.mm-step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;align-items:start;padding:16px;border-radius:16px;background:rgba(255,240,230,.035);border:1px solid var(--line)}
.mm-step .n{font-family:var(--f-wide);font-stretch:62%;font-style:italic;font-weight:900;font-size:34px;line-height:1;color:var(--ember)}
.mm-step b{display:block;font-size:15px}
.mm-step span{font-size:13px;color:var(--ash)}

/* ───────── narrow screens: keep labelled nav, no hamburger (spec §3) ───────── */
@media (max-width:1180px){
  .acct-btn span{display:none}
  .acct-btn{padding:0;width:44px;justify-content:center;border:0;margin:0}
  .mm-sport{grid-template-columns:260px minmax(0,1fr)}
  .mm-feature{display:none}
  .mm-acc{grid-template-columns:repeat(5,minmax(0,1fr))}
  .mm-acc .mm-feature{display:none}
}
@media (max-width:900px){
  :root{--header-h:62px}
  .hdr-row{grid-template-columns:1fr auto;grid-template-areas:"logo utils" "nav nav";height:auto;row-gap:0;padding-top:8px}
  .nav{margin-bottom:10px;width:100%;display:flex;justify-content:space-between;gap:2px;padding:4px}
  .nav-btn{flex:1 1 auto;justify-content:center;height:40px;padding:0 8px;font-size:12.5px;gap:4px;text-align:center;line-height:1.1;white-space:nowrap}
  .nav-btn .ic{display:none}
  .nav-btn.kit .bolt{display:inline;width:13px;height:13px}
  .mega{position:absolute;top:100%;height:calc(100svh - var(--hdr-total,124px));padding:8px 10px 10px;overflow:auto;overscroll-behavior:contain}
  .hdr.menu-open .mega{pointer-events:auto}
  .mega-panel{clip-path:none;border-radius:20px}
  .mega-in{min-height:0}
  .mm-sport,.mm-acc,.mm-kit{grid-template-columns:1fr}

/* ───────── hero ───────── */
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:clamp(700px,100svh,960px);padding-top:calc(var(--header-h) + env(safe-area-inset-top,0px));display:flex;flex-direction:column}
.hero-bg{position:absolute;inset:0;z-index:-1;overflow:hidden}
.hero-sky{position:absolute;inset:0;background:
  radial-gradient(60% 75% at 72% 52%,rgba(226,72,20,.38) 0%,rgba(120,24,6,.26) 38%,rgba(11,8,7,0) 72%),
  radial-gradient(40% 50% at 100% 100%,rgba(255,122,46,.25),transparent 70%),
  linear-gradient(180deg,#0b0807 0%,#120806 60%,#1a0904 100%)}
/* soft horizontal speed bands across the whole hero (ref 10) */
.hero-bands{position:absolute;inset:-10% -20%;opacity:.55;filter:blur(22px) saturate(1.2);
  background:
    repeating-linear-gradient(180deg,rgba(255,110,40,0) 0 26px,rgba(255,110,40,.22) 34px,rgba(255,110,40,0) 46px,rgba(170,30,8,.18) 60px,rgba(0,0,0,0) 78px,rgba(255,160,80,.12) 90px,rgba(0,0,0,0) 104px);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 30%,#000 75%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 30%,#000 75%,transparent 100%);
  animation:bands 7s ease-in-out infinite alternate}
@keyframes bands{to{transform:translateX(-4%) scaleY(1.04)}}
.hero-canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,8,7,.9) 0%,rgba(11,8,7,.55) 32%,rgba(11,8,7,0) 55%),linear-gradient(0deg,var(--ink) 0%,rgba(11,8,7,0) 18%)}

.hero-grid{position:relative;flex:1;display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);align-items:center;gap:0}
.hero-copy{position:relative;z-index:2;padding-block:40px 70px;max-width:640px}
.hero h1{font-size:var(--t-hero);margin:22px 0 26px;position:relative;white-space:nowrap;font-style:normal;letter-spacing:-.01em}
.hero h1 .ln{display:block;overflow:visible}
.hero h1 .ln span{display:inline-block}
.hero h1 .ln2{margin-left:.42em}
.hero h1 .fire-text{background-image:linear-gradient(100deg,#ff5a1f 0%,#ff7a2e 30%,#ffc272 55%,#ff7a2e 75%,#e2401a 100%);background-size:220% 100%;animation:fireShift 5s ease-in-out infinite alternate;padding-right:.08em;filter:drop-shadow(0 10px 40px rgba(255,90,31,.35))}
@keyframes fireShift{to{background-position:100% 0}}
.hero-sub{font-size:clamp(15px,1.25vw,18px);color:var(--bone-2);max-width:44ch;line-height:1.6}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hero-hint{display:flex;align-items:center;gap:12px;margin-top:34px;font-size:13px;color:var(--ash)}
.pulse{position:relative;width:10px;height:10px;border-radius:50%;background:var(--ember);flex:none}
.pulse::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--ember);animation:ping 1.8s var(--ease) infinite}
@keyframes ping{from{transform:scale(.5);opacity:1}to{transform:scale(1.7);opacity:0}}

/* intro motion — the headline arrives with a speed smear */
.js-motion .hero h1 .ln span{animation:dash 1.1s var(--ease) both}
.js-motion .hero h1 .ln2 span{animation-delay:.12s}
.js-motion .hero .hero-sub,.js-motion .hero .hero-cta,.js-motion .hero .hero-hint,.js-motion .hero .eyebrow{animation:rise 1s var(--ease) both}
.js-motion .hero .hero-sub{animation-delay:.35s}.js-motion .hero .hero-cta{animation-delay:.45s}.js-motion .hero .hero-hint{animation-delay:.6s}
@keyframes dash{from{transform:translateX(-80px);filter:blur(10px);opacity:.2}to{transform:none;filter:none;opacity:1}}
@keyframes rise{from{transform:translateY(18px);opacity:.3}}

/* ───────── stage ───────── */
.stage-col{position:relative;z-index:3;height:100%;display:flex;align-items:center}
.stage{position:relative;width:100%;aspect-ratio:1.02/1;max-height:calc(100svh - var(--header-h) - 30px);margin-left:-6%;--px:0;--py:0}
.orb{position:absolute;left:12%;top:4%;width:80%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 46%,#ffd29a 0%,#ffa04a 16%,#ff6a22 34%,#c9300c 54%,#5d1205 72%,rgba(40,8,3,0) 78%);
  filter:saturate(.85) brightness(.82);transform:translate(calc(var(--px)*-10px),calc(var(--py)*-8px));animation:orb 6s ease-in-out infinite alternate;opacity:.5}
@keyframes orb{to{filter:saturate(.95) brightness(.9)}}
.ribs{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex}
.ribs i{flex:1;height:100%;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  background:linear-gradient(90deg,rgba(255,236,210,.14) 0%,rgba(255,236,210,0) 30%,rgba(0,0,0,0) 70%,rgba(30,4,0,.22) 100%)}
.floor{position:absolute;left:-30%;right:-10%;top:94%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,154,60,.7) 40%,rgba(255,210,150,.9) 60%,transparent);filter:blur(.5px);box-shadow:0 0 30px 6px rgba(255,90,31,.35)}
.floor::after{content:"";position:absolute;left:20%;right:10%;top:2px;height:120px;background:radial-gradient(50% 100% at 50% 0%,rgba(255,90,31,.22),transparent 70%)}

.ath{position:absolute;pointer-events:none;transform:translate(calc(var(--px)*var(--d)*1px),calc(var(--py)*var(--d)*.7px));transition:filter .5s var(--ease),opacity .5s}
.ath > .ath-img{width:100%;height:100%;pointer-events:none;user-select:none}
.ath .floaty{position:absolute;inset:0;pointer-events:none;animation:floaty 4.6s ease-in-out infinite alternate}
.ath[data-air="1"] .floaty{animation-duration:3.8s}
.ath[data-air="0"] .floaty{animation:none}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.stage.focus .ath:not(.on){filter:brightness(.42) saturate(.6) blur(1.5px)}

.gear{position:absolute;display:block;cursor:pointer;pointer-events:none;-webkit-tap-highlight-color:transparent}
.gear .zone,.gear .hot{pointer-events:auto}
.gear .zone{position:absolute;border-radius:12px}
.gear img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(1);transition:opacity .35s var(--ease),transform .5s var(--ease),filter .5s var(--ease);pointer-events:none}
.gear:hover img,.gear:focus-visible img,.gear.on img{opacity:1;transform:scale(1.08) translateY(-2%);filter:drop-shadow(0 0 14px rgba(255,106,26,.85)) drop-shadow(0 12px 18px rgba(0,0,0,.6))}
.gear:focus-visible{outline:none}
.gear:focus-visible .hot{outline:2px solid var(--sun);outline-offset:4px}
.hot{position:absolute;left:var(--hx,50%);top:var(--hy,50%);width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:rgba(255,236,220,.85);box-shadow:0 0 0 2px rgba(255,90,31,.28);transition:transform .35s var(--ease),opacity .3s}
.hot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(255,200,160,.5);animation:ping 2.2s var(--ease) infinite;animation-delay:var(--dl,0s)}
.gear:hover .hot,.gear.on .hot,.gear:focus-visible .hot{transform:scale(.6);opacity:.5}
/* the hover card */
.gcard{position:absolute;z-index:20;width:264px;padding:16px 16px 14px;border-radius:18px;background:#fbf8f5;color:#16100e;border:0;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
  transform-origin:var(--ox,0) var(--oy,0);animation:popIn .3s var(--ease);pointer-events:auto}
.gcard[hidden]{display:none}
.gcard .mono{color:#d2400f}
.gcard b{display:block;font-size:15.5px;line-height:1.3;margin:7px 0 6px;font-weight:650}
.gcard p{font-size:12.5px;color:#6b605a;line-height:1.45}
.gcard .gc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid rgba(22,16,14,.1)}
.gcard .gc-price{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.gcard .gc-go{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;background:#16100e;color:#fbf8f5;font-size:13px;font-weight:600}
.gcard .gc-go .ic{width:15px;height:15px;color:#ff7a2e}
.gcard .gc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gcard .gc-go{white-space:nowrap;flex:none}
.gcard .demo-tag{padding:3px 6px;font-size:9px;color:#b4520f;border-color:rgba(180,82,15,.4)}

.ath-label{position:absolute;font-family:var(--f-label);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,226,200,.62);white-space:nowrap;display:flex;align-items:center;gap:8px;pointer-events:none}
.ath-label::before{content:"";width:18px;height:1px;background:currentColor}

.scroll-cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--f-label);font-size:10px;letter-spacing:.2em;color:var(--ash)}
.scroll-cue i{width:1px;height:38px;background:linear-gradient(var(--ember),transparent);animation:cue 1.8s var(--ease) infinite}
@keyframes cue{from{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}to{transform:scaleY(0);transform-origin:bottom}}

@media (max-width:1100px){
  .hero-grid{grid-template-columns:1fr;padding-bottom:30px}
  .hero-copy{padding-block:34px 10px;max-width:none}
  .hero h1{white-space:normal}

  .scroll-cue{display:none}

  .hero-cta .btn{flex:1 1 auto}
}

/* ───────── speed ticker (crossed bands) ───────── */
.ticker{position:relative;height:150px;margin-top:-30px;z-index:5;overflow:hidden;pointer-events:none}
.band{position:absolute;left:-5%;right:-5%;display:flex;overflow:hidden;white-space:nowrap}
.band-a{top:46px;height:62px;background:var(--grad-speed);transform:rotate(-2.6deg);box-shadow:0 20px 60px -20px rgba(255,90,31,.6);z-index:2}
.band-b{top:44px;height:58px;background:#0f0a09;border-block:1px solid var(--line-2);transform:rotate(2.2deg);z-index:1}
.band-track{display:flex;align-items:center;gap:34px;padding-right:34px;flex:none;animation:tick 32s linear infinite}
.band-b .band-track{animation-direction:reverse;animation-duration:40s}
.band-item{display:inline-flex;align-items:center;gap:34px;font-family:var(--f-wide);font-stretch:62%;font-style:italic;font-weight:900;font-size:40px;text-transform:uppercase;line-height:1}
.band-a .band-item{color:#160604}
.band-b .band-item{color:transparent;-webkit-text-stroke:1px rgba(255,226,200,.32)}
.band-item .ic{width:26px;height:26px;stroke-width:2}
.band-a .band-item .ic{color:#160604}
.band-b .band-item .ic{color:rgba(255,154,60,.6)}
@keyframes tick{to{transform:translateX(-100%)}}

/* ───────── shop by sport (ref 18) ───────── */
.sports{padding-top:clamp(56px,6vw,96px);background:radial-gradient(70% 50% at 85% 0%,rgba(255,90,31,.08),transparent 70%)}
.sp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:64px 22px;padding-top:34px}
.sp-card{position:relative;display:block;height:360px;border-radius:var(--r-lg);isolation:isolate;transition:transform .55s var(--ease)}
.sp-clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:linear-gradient(165deg,#1d1716 0%,#120d0c 55%,#0d0908 100%);border:1px solid var(--line);transition:border-color .45s}
.sp-fire{position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease);
  background:radial-gradient(90% 70% at 78% 18%,#ff9a3c 0%,#ff5a1f 22%,#9c1f07 46%,#2a0803 72%,#0d0807 100%)}
.sp-ribs{position:absolute;inset:0;opacity:0;transition:opacity .6s;background:repeating-linear-gradient(90deg,rgba(255,236,210,.07) 0 2px,rgba(0,0,0,0) 2px 26px,rgba(0,0,0,.12) 26px 28px)}
.sp-num{position:absolute;right:20px;bottom:120px;font-family:var(--f-wide);font-stretch:62%;font-style:italic;font-weight:900;font-size:120px;line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(255,236,224,.06);transition:-webkit-text-stroke-color .5s}
.sp-obj{position:absolute;right:-3%;top:-13%;width:58%;aspect-ratio:1;z-index:2;pointer-events:none;transition:transform .8s var(--ease)}
.sp-obj img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:grayscale(1) contrast(1.12) brightness(.92) drop-shadow(0 22px 18px rgba(0,0,0,.55)) drop-shadow(0 6px 4px rgba(0,0,0,.45));transition:filter .6s var(--ease)}
/* studio key-light: specular sheen clipped to the item's own silhouette */
.sp-hl{position:absolute;inset:0;pointer-events:none;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
  background:radial-gradient(42% 36% at 30% 24%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%),linear-gradient(200deg,rgba(255,255,255,0) 55%,rgba(0,0,0,.42) 100%);mix-blend-mode:soft-light}
/* contact shadow on the card surface */
.sp-obj::after{content:"";position:absolute;left:18%;right:18%;bottom:-2%;height:10%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);filter:blur(6px);z-index:-1;transition:transform .8s var(--ease),opacity .6s}
.sp-card:hover .sp-obj img,.sp-card:focus-visible .sp-obj img{filter:grayscale(0) contrast(1.04) saturate(1.06) drop-shadow(0 30px 26px rgba(0,0,0,.6)) drop-shadow(0 8px 6px rgba(0,0,0,.4))}
.sp-card:hover .sp-obj::after{transform:translateY(26px) scale(.8);opacity:.6}
.sp-obj-cricket{width:44%;right:4%;top:-14%}
.sp-obj-tennis{width:46%;right:2%;top:-14%}
.sp-obj-football{width:50%;top:-15%}
.sp-obj-basketball{width:52%;top:-16%}
.sp-obj-badminton{width:56%;top:-15%;right:-2%}
.sp-obj-running{width:62%;top:-10%;right:-5%}
.sp-pill{position:absolute;left:18px;top:18px;z-index:3}
.sp-pill .chip{background:rgba(255,240,230,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sp-pill .chip .ic{color:var(--flare)}
.sp-glass{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:70px 22px 20px;border-radius:0 0 var(--r-lg) var(--r-lg);
  background:linear-gradient(180deg,rgba(14,10,9,0) 0%,rgba(14,10,9,.55) 40%,rgba(14,10,9,.82) 100%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 38%);mask-image:linear-gradient(180deg,transparent 0%,#000 38%)}
.sp-glass h3{font-size:30px}
.sp-glass p{margin-top:8px;font-size:13.5px;color:var(--bone-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:40ch}
.sp-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.sp-subs{font-family:var(--f-label);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-go{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,240,230,.1);border:1px solid var(--line-2);transition:background-color .4s,transform .5s var(--ease),color .3s}
.sp-go .ic{width:18px;height:18px;transform:rotate(-45deg);transition:transform .5s var(--ease)}
.sp-card:hover,.sp-card:focus-visible{transform:translateY(-8px)}
.sp-card:focus-visible{outline:none}
.sp-card:focus-visible .sp-clip{outline:2px solid var(--sun);outline-offset:3px}
.sp-card:hover .sp-clip,.sp-card:focus-visible .sp-clip{border-color:rgba(255,154,60,.45);box-shadow:0 40px 80px -30px rgba(255,90,31,.55)}
.sp-card:hover .sp-fire,.sp-card:focus-visible .sp-fire{opacity:1}
.sp-card:hover .sp-ribs,.sp-card:focus-visible .sp-ribs{opacity:1}
.sp-card:hover .sp-obj,.sp-card:focus-visible .sp-obj{transform:translate(-3%,-12%) rotate(-8deg) scale(1.1)}
.sp-card:hover .sp-go,.sp-card:focus-visible .sp-go{background:var(--bone);color:#140604}
.sp-card:hover .sp-go .ic,.sp-card:focus-visible .sp-go .ic{transform:rotate(0)}
.sp-card:hover .sp-num{-webkit-text-stroke-color:rgba(255,236,224,.18)}
.sp-card:hover .sp-subs{color:var(--bone-2)}
@media (max-width:1100px){.sp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.sp-grid{grid-template-columns:1fr;gap:56px}.sp-card{height:320px}}

/* ───────── explore equipment: cut-out cards (items pop out of the frame) ───────── */
.eq-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:360px 380px;gap:64px 20px;padding-top:40px}

  clip-path:polygon(0 0,calc(100% - var(--cut)*2) 0,100% calc(var(--cut)*2),100% 100%,0 100%);transition:border-color .45s}
.eq-fire{position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease);background:radial-gradient(90% 80% at 65% 25%,#ff9a3c 0%,#ff5a1f 20%,#9c1f07 44%,#2a0803 70%,#0d0807 100%)}
.eq-ribs{position:absolute;inset:0;opacity:0;transition:opacity .6s;background:repeating-linear-gradient(90deg,rgba(255,236,210,.07) 0 2px,rgba(0,0,0,0) 2px 26px,rgba(0,0,0,.12) 26px 28px)}
.eq-objs{position:absolute;left:0;right:0;top:-44px;bottom:200px;z-index:1;pointer-events:none}

.eq-copy{position:relative;z-index:2}
.eq-top{display:none}
.eq-top .chip{background:rgba(11,8,7,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.eq-tile:nth-child(n+2) .eq-top{display:none}
.eq-tile h3{font-size:clamp(24px,2.3vw,36px);max-width:12ch}
.eq-line{margin-top:8px;color:var(--bone-2);font-size:14px;max-width:34ch}
.eq-items{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;padding-right:64px;font-family:var(--f-label);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.eq-items li{display:inline-flex;align-items:center;gap:14px}
.eq-items li + li::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--ember)}
.eq-go{position:absolute;right:22px;bottom:22px;z-index:3;display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:rgba(255,240,230,.1);border:1px solid var(--line-2);transition:all .5s var(--ease)}
.eq-go .ic{width:20px;height:20px;transform:rotate(-45deg);transition:transform .5s var(--ease)}
.eq-tile:hover,.eq-tile:focus-visible{transform:translateY(-6px)}
.eq-tile:hover .eq-fire,.eq-tile:focus-visible .eq-fire,.eq-tile:hover .eq-ribs,.eq-tile:focus-visible .eq-ribs{opacity:1}
.eq-tile:hover .eq-bg,.eq-tile:focus-visible .eq-bg{border-color:rgba(255,154,60,.45)}
.eq-tile:hover .eq-objs img,.eq-tile:focus-visible .eq-objs img{transform:translateY(-16px) rotate(calc(var(--r) - 5deg)) scale(1.06)}
.eq-tile:hover .eq-go,.eq-tile:focus-visible .eq-go{background:var(--bone);border-color:transparent;color:#160604}
.eq-tile:hover .eq-go .ic,.eq-tile:focus-visible .eq-go .ic{transform:rotate(0)}
.eq-tile:hover .eq-items,.eq-tile:focus-visible .eq-items{color:var(--bone)}
.eq-tile:focus-visible{outline:none}
.eq-tile:focus-visible .eq-bg{box-shadow:inset 0 0 0 2px var(--sun)}
.eq-tile:nth-child(1) .eq-items{flex-direction:column;gap:8px}
.eq-tile:nth-child(1) .eq-items li + li::before{display:none}
.eq-tile:nth-child(1) .eq-items li::before{content:"";width:14px;height:1px;background:var(--ember);display:inline-block}
@media (max-width:1000px){
  .eq-grid{grid-template-columns:1fr 1fr;grid-template-rows:auto;gap:70px 16px}
  .eq-tile{min-height:320px}
  .eq-tile:nth-child(1){grid-row:auto;grid-column:1 / 3;min-height:400px}
  .eq-tile:nth-child(2){grid-column:1 / 3}
  .eq-tile:nth-child(2) .eq-objs{left:44%}
}
@media (max-width:600px){.eq-grid{grid-template-columns:1fr}.eq-tile:nth-child(n){grid-column:auto;min-height:400px}.eq-tile:nth-child(2) .eq-objs{left:0;bottom:200px}.eq-tile:nth-child(2) .eq-copy{max-width:none}.eq-tile:nth-child(1) .eq-objs{bottom:220px}}

/* ───────── build-preview band ───────── */
.phase{padding-block:20px 120px}
.phase-card{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:40px;padding:40px;border-radius:var(--r-lg);border:1px dashed rgba(255,194,114,.3);background:linear-gradient(120deg,rgba(255,90,31,.08),rgba(255,90,31,0) 50%)}
.phase-card h2{font-size:var(--t-d3);margin:14px 0 12px}
.phase-card p{color:var(--ash);max-width:44ch}
.phase-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.phase-list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:14px 16px;border-radius:14px;background:rgba(255,240,230,.03);border:1px solid var(--line);font-size:13.5px;color:var(--bone-2)}
.phase-list li b{font-family:var(--f-label);font-size:11px;letter-spacing:.1em;color:var(--flare);padding-top:2px}
.phase-list li.done{border-color:rgba(255,154,60,.4);background:rgba(255,90,31,.08)}
@media (max-width:900px){.phase-card{grid-template-columns:1fr;padding:26px}.phase-list{grid-template-columns:1fr}}

/* ───────── product card ───────── */
.pc{position:relative;display:flex;flex-direction:column;border-radius:22px;padding:10px;background:#141010;border:1px solid var(--line);isolation:isolate;transition:transform .5s var(--ease),border-color .4s;min-width:0}
.pc::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;opacity:0;transition:opacity .55s var(--ease);
  background:radial-gradient(110% 70% at 50% 18%,#ff9a3c 0%,#ff5a1f 18%,#a3240a 40%,#2a0803 68%,#0e0807 100%)}
.pc:hover,.pc:focus-within{transform:translateY(-6px);border-color:rgba(255,154,60,.4)}
.pc:hover::before,.pc:focus-within::before{opacity:1}
.pc-media{position:relative;display:grid;place-items:center;aspect-ratio:1/.86;border-radius:16px;overflow:visible;
  background:radial-gradient(80% 80% at 50% 38%,#f7f3ef 0%,#e9e2dc 55%,#d9d0c9 100%);transition:background-color .5s}
.pc-media::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(80% 80% at 50% 38%,rgba(255,255,255,.06),rgba(0,0,0,.18));opacity:0;transition:opacity .5s}
.pc:hover .pc-media,.pc:focus-within .pc-media{background:transparent}
.pc:hover .pc-media::after,.pc:focus-within .pc-media::after{opacity:1}
.pc-media img{position:absolute;z-index:1;left:13%;top:10%;width:74%;height:78%;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(30,15,10,.28));transition:transform .7s var(--ease),filter .5s}
.pc:hover .pc-media img,.pc:focus-within .pc-media img{transform:translateY(-16%) scale(1.12) rotate(-4deg);filter:drop-shadow(0 30px 26px rgba(0,0,0,.55))}
.pc-glow{position:absolute;left:18%;right:18%;bottom:10%;height:14%;border-radius:50%;background:radial-gradient(closest-side,rgba(40,20,12,.28),transparent);transition:opacity .4s}
.pc:hover .pc-glow{opacity:0}
.pc-sport{position:absolute;left:20px;top:20px;z-index:2;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:rgba(18,12,10,.85);color:var(--bone-2);font:600 11px/1 var(--f-body)}
.pc-sport .ic{width:13px;height:13px;color:var(--flare)}
.pc-save{position:absolute;right:18px;top:18px;z-index:2;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(18,12,10,.85);color:var(--bone);transition:transform .3s var(--ease),background-color .2s}
.pc-save .ic{width:17px;height:17px}
.pc-save:hover{transform:scale(1.08)}
.pc-save[aria-pressed="true"]{background:var(--ember);color:#160604}
.pc-save[aria-pressed="true"] .ic{fill:currentColor}
.pc-body{display:flex;flex-direction:column;gap:4px;padding:16px 8px 6px;flex:1}
.pc-name{font-weight:650;font-size:15.5px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.56em}
.pc-name:hover{text-decoration:underline;text-underline-offset:3px}
.pc-attr{font-size:12.5px;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .4s}
.pc:hover .pc-attr{color:var(--bone-2)}
.pc-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 0 10px}
.pc-price{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pc-opt{font-size:11.5px;color:var(--ash);text-align:right;transition:color .4s}
.pc:hover .pc-opt{color:var(--bone-2)}

/* ───────── swipe control ───────── */
.sw{--h:48px;--k:40px;margin-top:auto}
.sw-track{position:relative;height:var(--h);border-radius:999px;background:rgba(255,240,230,.07);border:1px solid var(--line-2);overflow:hidden;transition:background-color .4s,border-color .4s}
.pc:hover .sw-track{background:rgba(11,8,7,.45)}
.sw-fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--x,0px) + var(--k) + 6px);border-radius:inherit;background:var(--grad-ember);opacity:.9;transition:width .45s var(--ease)}
.sw-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:var(--k);font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--bone-2);pointer-events:none;
  background:linear-gradient(100deg,var(--bone-2) 40%,#fff 50%,var(--bone-2) 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 2.6s linear infinite;opacity:calc(1 - var(--p,0)*1.4)}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.sw-knob{position:absolute;left:3px;top:3px;width:var(--k);height:var(--k);border-radius:50%;display:grid;place-items:center;background:var(--bone);color:#160604;cursor:grab;touch-action:pan-y;
  transform:translateX(var(--x,0px));transition:transform .45s var(--ease),background-color .3s;box-shadow:0 4px 12px rgba(0,0,0,.35);z-index:2}
.sw-knob .ic{width:18px;height:18px}
.sw-knob:active{cursor:grabbing}
.sw.dragging .sw-knob,.sw.dragging .sw-fill{transition:none}
/* in-cart state: knob sits at the far end, track is lit, reverse swipe removes */
.sw.in .sw-fill{width:100%}
.sw.in .sw-label{color:#1a0603;-webkit-text-fill-color:#1a0603;animation:none;padding:0 calc(var(--k) + 6px) 0 0;background:none}
.sw.in:not(.dragging) .sw-knob{left:auto;right:3px;transform:none}
.sw.in.dragging .sw-fill{width:calc(var(--x,0px) + var(--k) + 6px)}
.sw.in .sw-knob{background:#160604;color:var(--bone)}
.sw.busy .sw-knob{animation:busy .9s linear infinite;pointer-events:none}
.sw.busy .sw-knob .ic{opacity:.3}
@keyframes busy{0%{box-shadow:0 0 0 0 rgba(255,154,60,.7)}100%{box-shadow:0 0 0 10px rgba(255,154,60,0)}}
.sw-meta{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px}
.sw-meta[hidden]{display:none}
.sw-qty{display:inline-flex;align-items:center;gap:5px;color:var(--bone-2);margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-qty .ic{width:14px;height:14px;color:var(--ok);flex:none}
.sw-view{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);font-weight:600;font-size:11.5px;white-space:nowrap}
.sw-view:hover{background:rgba(255,240,230,.1)}

/* compact rows (collections, lists) */
.pc-compact{flex-direction:row;align-items:center;gap:14px;padding:8px}
.pc-compact .pc-media{width:96px;flex:none;aspect-ratio:1}
.pc-compact .pc-media img{left:10%;top:10%;width:80%;height:80%}
.pc-compact .pc-sport,.pc-compact .pc-save,.pc-compact .pc-attr{display:none}
.pc-compact .pc-body{padding:4px 6px 4px 0;gap:2px}
.pc-compact .pc-name{min-height:0;font-size:14px;-webkit-line-clamp:1}
.pc-compact .pc-row{margin:2px 0 8px}
.pc-compact .pc-price{font-size:16px}
.pc-compact .sw{--h:40px;--k:32px}
.pc-compact:hover .pc-media img{transform:scale(1.1) rotate(-4deg)}

/* ───────── option sheet ───────── */
.sheet{position:fixed;inset:0;z-index:92;display:grid;place-items:center;padding:16px}
.sheet-scrim{position:absolute;inset:0;background:rgba(5,3,3,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .3s}
.sheet-panel{position:relative;width:min(480px,100%);max-height:calc(100svh - 32px);overflow:auto;border-radius:24px;background:#fbf8f5;color:#16100e;padding:22px;display:grid;gap:16px;
  transform:translateY(24px) scale(.98);opacity:0;transition:transform .4s var(--ease),opacity .3s}
.sheet.on .sheet-scrim{opacity:1}.sheet.on .sheet-panel{transform:none;opacity:1}
.sheet.out .sheet-scrim{opacity:0}.sheet.out .sheet-panel{transform:translateY(16px);opacity:0}
.sheet-head{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center}
.sheet-head .icon-btn{color:#16100e}.sheet-head .icon-btn:hover{background:rgba(22,16,14,.07)}
.sheet-img{width:72px;height:72px;border-radius:14px;background:radial-gradient(80% 80% at 50% 40%,#fff,#e6ddd6);display:grid;place-items:center}
.sheet-img img{max-width:80%;max-height:80%;object-fit:contain}
.sheet-head .mono{color:#c2410c}
.sheet-head h2{font-size:16px;line-height:1.3;margin:3px 0}
.sheet-price{font-variant-numeric:tabular-nums}
.sheet-q{font-size:14.5px;font-weight:600}
.sheet-q .muted{color:#7a6e67;font-weight:500}
.sheet-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:8px 10px;border-radius:14px;border:1.5px solid rgba(22,16,14,.14);font-weight:600;font-size:13.5px;color:#16100e;transition:border-color .2s,background-color .2s,transform .2s}
.opt:hover{border-color:rgba(22,16,14,.4)}
.opt small{font-size:10.5px;font-weight:600;color:#7a6e67}
.opt[aria-checked="true"]{border-color:#16100e;background:#16100e;color:#fbf8f5}
.opt[aria-checked="true"] small{color:#ffb070}
.opt[aria-disabled="true"]{color:#a69c95;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(22,16,14,.05) 6px 7px);cursor:not-allowed}
.opt[aria-disabled="true"] span{text-decoration:line-through}
.sheet-size{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:#f1e9e2;font-weight:600;font-size:14px}
.sheet-size .ic{grid-row:span 2;width:20px;height:20px;color:#c2410c}
.sheet-size .muted{font-weight:500;font-size:12px;color:#7a6e67}
.sheet-err{font-size:13px;color:#b42318;font-weight:600}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end}
.sheet-foot .btn-glass{color:#16100e;border-color:rgba(22,16,14,.2);background:transparent}
@media (max-width:560px){.sheet{place-items:end center;padding:0}.sheet-panel{border-radius:24px 24px 0 0;width:100%;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}.sheet-foot .btn{flex:1}}

/* ───────── build your kit teaser (ref 19) ───────── */
.kitx{background:radial-gradient(60% 60% at 80% 50%,rgba(255,90,31,.09),transparent 70%)}
.kitx-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(32px,5vw,80px);align-items:center}
.kitx-copy{display:grid;gap:20px;justify-items:start}
.kitx-copy h2{font-size:var(--t-d1)}
.kitx-copy p{max-width:46ch}
.kitx-points{display:grid;gap:12px;margin:4px 0 8px}
.kitx-points li{display:flex;gap:14px;align-items:flex-start}
.kitx-points .ic{width:22px;height:22px;color:var(--ember);flex:none;margin-top:2px}
.kitx-points b{display:block;font-size:15px}
.kitx-points span{font-size:13.5px;color:var(--ash)}
.kitx-stage{position:relative;padding:22px 26px 34px 0}
.kq-stack i{position:absolute;inset:30px 20px 22px 18px;border-radius:26px;background:#e9e2db;transform:rotate(3.2deg);opacity:.5}
.kq-stack i + i{transform:rotate(-2.4deg);opacity:.75;background:#f1ebe5}
.kq{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.86fr);min-height:440px;border-radius:26px;background:#faf6f2;color:#16100e;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.8)}
.kq.in-r{animation:kqR .5s var(--ease)}.kq.in-l{animation:kqL .5s var(--ease)}
@keyframes kqR{from{transform:translateX(30px) rotate(1deg);opacity:.2}}
@keyframes kqL{from{transform:translateX(-30px) rotate(-1deg);opacity:.2}}
.kq-l{padding:28px 28px 24px;display:flex;flex-direction:column;gap:12px}
.kq-dots{display:flex;gap:6px;margin-bottom:6px}
.kq-dots i{width:22px;height:3px;border-radius:2px;background:#ddd4cc}
.kq-dots i.d{background:#16100e}.kq-dots i.c{background:linear-gradient(90deg,#16100e 50%,#ddd4cc 50%)}
.kq-n{font:650 11px/1 var(--f-label);font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;color:#c2410c}
.kq-n span{color:#a3968e}
.kq-q{font-size:clamp(20px,1.8vw,25px);line-height:1.2;font-weight:650;letter-spacing:-.01em;max-width:16ch}
.kq-sel{font:650 10px/1 var(--f-label);font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;color:#a3968e;margin-top:4px}
.kq-opts{display:grid;gap:2px}
.kq-o{display:flex;align-items:center;gap:12px;padding:9px 10px;margin:0 -10px;border-radius:10px;font-size:14.5px;font-weight:500;text-align:left;color:#2a201c;transition:background-color .2s}
.kq-o:hover{background:#f0e9e3}
.kq-o i{width:16px;height:16px;border-radius:50%;border:1.5px solid #6c605a;flex:none;transition:all .2s}
.kq-o[aria-checked="true"]{font-weight:650;color:#16100e}
.kq-o[aria-checked="true"] i{border:5px solid #ff5a1f}
.kq-o:focus-visible{outline:2px solid #c2410c;outline-offset:0}
.kq-note{font-size:12.5px;color:#7a6e67}
.kq-err{font-size:12.5px;font-weight:600;color:#b42318}
.kq-sum{display:grid;gap:8px;margin:6px 0}
.kq-sum li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e6ded7;font-size:14px}
.kq-sum span{color:#7a6e67}
.kq-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px}
.kq-back{height:40px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;color:#3a2f2a}
.kq-back:hover{background:#f0e9e3}
.kq-next{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border-radius:999px;background:#16100e;color:#faf6f2;font-weight:600;font-size:14px;transition:transform .3s var(--ease)}
.kq-next .ic{width:16px;height:16px;color:#ff7a2e}
.kq-next:hover{transform:translateX(3px)}
.kq-r{padding:12px 12px 12px 0}
.kq-photo{position:relative;height:100%;min-height:300px;border-radius:20px;overflow:hidden;background:radial-gradient(90% 80% at 60% 35%,#ff9a3c 0%,#ff5a1f 22%,#9c1f07 50%,#1f0602 85%);display:grid;place-items:center}
.kq-photo::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,236,210,.08) 0 2px,transparent 2px 22px)}
.kq-photo{min-height:340px}
.kq-img{position:absolute;inset:12% 10%;width:80%;height:76%;object-fit:contain;filter:drop-shadow(0 30px 30px rgba(0,0,0,.55));animation:kqIn .7s var(--ease)}
.kq-photo .kq-img[src*="p-bat"],.kq-photo .kq-img[src*="p-racket.webp"]{transform:rotate(-14deg)}
@keyframes kqIn{from{transform:translateY(20px) scale(.92);opacity:0}}
.kq-tag{position:absolute;left:14px;bottom:14px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:rgba(16,8,6,.6);color:#fbe7d6;font-size:12px;font-weight:600;backdrop-filter:blur(8px)}
.kq-tag .ic{width:14px;height:14px}
@media (max-width:1000px){.kitx-grid{grid-template-columns:1fr}.kitx-stage{padding:10px 8px 20px}}
@media (max-width:620px){.kq{grid-template-columns:1fr}.kq-r{order:-1;padding:10px 10px 0}.kq-photo{min-height:200px}}

/* ───────── featured gear ───────── */
.feat-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:-12px 0 34px}
.feat-tabs button{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);font-size:13.5px;font-weight:600;color:var(--bone-2);transition:all .25s}
.feat-tabs button .ic{width:16px;height:16px;color:var(--ash)}

.feat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:1150px){.feat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.feat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.feat-grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin-inline:calc(var(--gut)*-1);padding:0 var(--gut) 16px;scrollbar-width:none}.feat-grid .pc{flex:0 0 82%;scroll-snap-align:start}}

/* ───────── accessories ───────── */
.acc-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding-top:56px}
.acc{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:330px;padding:20px;isolation:isolate;transition:transform .5s var(--ease)}

.acc-fire{position:absolute;inset:0;opacity:0;transition:opacity .55s;background:radial-gradient(100% 70% at 50% 15%,#ff9a3c 0%,#ff5a1f 20%,#a3240a 44%,#2a0803 72%,#0e0807 100%)}
.acc-objs{position:absolute;left:0;right:0;top:-48px;height:64%;pointer-events:none}
.acc-objs img{position:absolute;left:50%;top:0;height:100%;width:auto;max-width:90%;object-fit:contain;transform:translateX(-50%);filter:drop-shadow(0 22px 22px rgba(0,0,0,.55));transition:transform .7s var(--ease)}

/* ───────── running feature (poster, ref 16) ───────── */
.run-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(28px,4vw,64px);align-items:center}

.run-streaks{position:absolute;inset:0;z-index:-1;opacity:.8;background:repeating-linear-gradient(180deg,rgba(255,220,180,0) 0 18px,rgba(255,220,180,.14) 22px,rgba(255,220,180,0) 30px,rgba(80,10,0,.25) 44px,rgba(0,0,0,0) 56px);filter:blur(3px);
  -webkit-mask-image:linear-gradient(90deg,#000 10%,transparent 70%);mask-image:linear-gradient(90deg,#000 10%,transparent 70%);animation:runStreak 2.4s linear infinite}

.run-word{position:absolute;left:-2%;top:50%;transform:translateY(-58%);z-index:-1;font-family:var(--f-wide);font-stretch:62%;font-weight:900;font-size:clamp(150px,22vw,330px);line-height:.8;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:2px rgba(255,236,220,.28)}

@keyframes shoeHover{to{translate:0 -14px}}
.run-trail img{position:absolute;left:24%;top:24%;width:62%;transform:rotate(-12deg);opacity:.16;filter:blur(6px) brightness(1.6) sepia(1) saturate(4) hue-rotate(-12deg);mix-blend-mode:screen}
.run-trail img:nth-child(1){translate:-7% 0;opacity:.22}.run-trail img:nth-child(2){translate:-14% 0}.run-trail img:nth-child(3){translate:-22% 0;opacity:.11}.run-trail img:nth-child(4){translate:-31% 0;opacity:.07}.run-trail img:nth-child(5){translate:-41% 0;opacity:.04}
.run-poster:hover .run-shoe{transform:rotate(-16deg) scale(1.05)}
.run-tag{position:absolute;left:22px;bottom:22px;display:grid;gap:4px;max-width:280px;padding:16px 18px;border-radius:18px;background:rgba(15,8,6,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,236,220,.14)}

/* ───────── find your size (refs 13, 14) ───────── */
.fys{background:linear-gradient(180deg,transparent,rgba(255,90,31,.05) 50%,transparent)}
.fys-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,4vw,72px);align-items:center}

.fys-pill{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px 0 12px;border-radius:999px;border:1.5px solid var(--line-2);font-size:14.5px;font-weight:600;color:var(--bone-2);transition:all .3s var(--ease)}

.fys-stage[data-zone="head"] [data-z="head"],.fys-stage[data-zone="head2"] [data-z="head2"],.fys-stage[data-zone="hand"] [data-z="hand"],.fys-stage[data-zone="hand2"] [data-z="hand2"],.fys-stage[data-zone="shin"] [data-z="shin"],.fys-stage[data-zone="feet"] [data-z="feet"]{opacity:1}

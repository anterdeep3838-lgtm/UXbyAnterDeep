.drawer-body{flex:1;overflow:auto;padding:18px 22px 26px;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:var(--r-pill);background:rgba(255,240,230,.05);border:1px solid var(--line)}
.tab{flex:1;height:38px;border-radius:var(--r-pill);font-size:13.5px;font-weight:600;color:var(--ash)}
.tab span{opacity:.6;margin-left:4px}
.tab[aria-selected="true"]{background:var(--bone);color:#120604}
.tab:disabled{cursor:not-allowed;opacity:.55}
.d-list{display:grid;gap:10px}
.d-item{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px;border-radius:16px;background:var(--ink-2);border:1px solid var(--line)}
.d-thumb{width:76px;height:76px;border-radius:12px;background:radial-gradient(circle at 50% 40%,#3a1307,#140c0a);display:grid;place-items:center;overflow:hidden}
.d-thumb img{max-width:82%;max-height:82%;object-fit:contain}
.d-meta{display:grid;gap:2px;min-width:0}
.d-meta b{font-size:14px;font-weight:600;line-height:1.3}
.d-meta small{font-size:12px;color:var(--ash)}
.d-price{font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.d-note{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ash);line-height:1.45}
.d-note .ic{width:16px;height:16px;flex:none;margin-top:1px;color:var(--flare)}
.d-foot{margin-top:auto;display:grid;gap:14px;padding-top:16px;border-top:1px solid var(--line)}
.d-row{display:flex;justify-content:space-between;font-size:15px}
.d-empty{margin:auto 0;display:grid;justify-items:center;text-align:center;gap:12px;padding:30px 10px}
.d-empty-ic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,90,31,.22),rgba(255,90,31,.04));border:1px solid rgba(255,122,46,.3);margin-bottom:6px}
.d-empty-ic .ic{width:30px;height:30px;color:var(--flare)}
.d-empty b{font-size:18px}
.d-empty p{color:var(--ash);max-width:32ch;font-size:14px}
.d-empty-cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* ───────── toasts ───────── */
.toasts{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;display:grid;gap:8px;width:min(440px,calc(100% - 32px))}
.toast{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px 14px 20px;border-radius:16px;background:var(--bone);color:#140806;font-weight:500;font-size:14px;box-shadow:0 20px 50px -10px rgba(0,0,0,.7);animation:toastIn .45s var(--ease)}
.toast.out{opacity:0;transform:translateY(10px);transition:all .4s}
.toast-act{font-weight:700;color:var(--blood);padding:6px 8px;border-radius:8px}
.toast-act:hover{background:rgba(179,32,14,.1)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.98)}}

/* ───────── interim pages ───────── */
.pg{padding-top:calc(var(--hdr-total,var(--header-h)) + 30px);min-height:80vh;background:radial-gradient(60% 40% at 80% 0%,rgba(255,90,31,.12),transparent 70%)}
.pg-wrap{padding-bottom:120px;display:grid;gap:34px}
.crumbs ol{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--ash)}
.crumbs li{display:flex;align-items:center;gap:8px}
.crumbs li + li::before{content:"/";color:var(--ash-2)}
.crumbs a:hover{color:var(--bone)}
.crumbs [aria-current]{color:var(--bone-2)}
.pg-hero{display:grid;gap:18px;justify-items:start;padding-top:20px}
.pg-hero h1{font-size:var(--t-d1);max-width:16ch}
.pg-lead{font-size:17px;color:var(--bone-2);max-width:56ch}
.pg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pg-card{padding:26px;border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--line);display:grid;gap:16px;align-content:start}
.pg-list{display:grid;gap:12px}
.pg-list li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.pg-list .ic{width:18px;height:18px;color:var(--ember);flex:none;margin-top:3px}
.pg-links{display:grid;gap:4px}
.pg-links a,.pg-links button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;font-size:15px;text-align:left}
.pg-links a:hover,.pg-links button:hover{background:rgba(255,240,230,.05)}
.pg-links .ic{width:18px;height:18px;color:var(--flare)}
.pg-sub{display:grid;gap:14px}
.pg-note{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:14px;border:1px dashed rgba(255,194,114,.3);color:var(--bone-2);font-size:14px}
.pg-note .ic{width:18px;height:18px;color:var(--sun);flex:none;margin-top:2px}
.chip.on{background:var(--bone);color:#140604;border-color:var(--bone)}
@media (max-width:760px){.pg-grid{grid-template-columns:1fr}}

.sport-hero{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:30px;padding:40px;border-radius:var(--r-lg);overflow:hidden;
  background:radial-gradient(80% 120% at 85% 30%,#9c1f07 0%,#3a0d05 45%,#120c0b 80%);border:1px solid var(--line)}
.sport-hero h1{font-size:var(--t-d1);margin:14px 0}
.sport-hero h1 small{display:block;font-size:.42em;color:var(--sun);margin-top:10px}
.sport-hero-obj img{width:min(100%,420px);margin-left:auto;filter:drop-shadow(0 40px 50px rgba(0,0,0,.6));animation:objFloat 5s ease-in-out infinite alternate}
@keyframes objFloat{to{transform:translateY(-12px) rotate(-3deg)}}
@media (max-width:800px){.sport-hero{grid-template-columns:1fr;padding:26px}.sport-hero-obj img{width:60%;margin:0 auto}}

.mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.mini{display:grid;grid-template-rows:200px auto;border-radius:var(--r-md);background:var(--ink-2);border:1px solid var(--line);overflow:hidden;transition:transform .45s var(--ease),border-color .3s}
.mini:hover{transform:translateY(-4px);border-color:rgba(255,154,60,.4)}
.mini-img{display:grid;place-items:center;background:radial-gradient(70% 70% at 50% 40%,#4a1306,#140c0a 80%)}
.mini-img img{max-width:72%;max-height:78%;object-fit:contain;transition:transform .6s var(--ease)}
.mini:hover .mini-img img{transform:scale(1.06) rotate(-3deg)}
.mini-meta{display:grid;gap:4px;padding:16px}
.mini-meta small{color:var(--flare)}
.mini-meta b{font-size:15px;font-weight:600;line-height:1.3}
.mini-meta span{font-size:12.5px;color:var(--ash)}
.mini-meta em{font-style:normal;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}

.pp{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center}
.pp-stage{position:relative;aspect-ratio:1;border-radius:var(--r-lg);overflow:hidden;display:grid;place-items:center;background:#120c0b;border:1px solid var(--line)}
.pp-orb{position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,#ff9a3c 0%,#ff5a1f 28%,#8a1a06 55%,transparent 72%);filter:blur(10px);opacity:.75}
.pp-stage img{position:relative;max-width:66%;max-height:72%;object-fit:contain;filter:drop-shadow(0 40px 40px rgba(0,0,0,.6));animation:objFloat 5s ease-in-out infinite alternate}
.pp-info{display:grid;gap:16px;align-content:start}
.pp-title{font-family:var(--f-wide);font-stretch:112%;font-weight:700;font-size:clamp(28px,3vw,44px);line-height:1.05;letter-spacing:-.01em}
.pp-attr{color:var(--bone-2);font-size:16px}
.pp-price{display:flex;align-items:center;gap:14px}
.pp-price b{font-size:30px;font-variant-numeric:tabular-nums}
.pp-specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line);margin:6px 0}
.pp-specs div{background:var(--ink-1);padding:14px 16px}
.pp-specs dt{font-family:var(--f-label);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.pp-specs dd{margin:4px 0 0;font-size:14.5px}
.pp-actions{display:flex;gap:10px;flex-wrap:wrap}
.pp-actions .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.pp-save[aria-pressed="true"]{background:rgba(255,90,31,.16);border-color:rgba(255,90,31,.55)}
.pp-save[aria-pressed="true"] .ic{fill:var(--ember);color:var(--ember)}
.pp-why{display:flex;gap:10px;font-size:13px;color:var(--ash);max-width:52ch}
.pp-why .ic{width:16px;height:16px;flex:none;margin-top:2px;color:var(--sun)}
@media (max-width:860px){.pp{grid-template-columns:1fr;gap:26px}}

/* ───────── listing ───────── */
.lst-head{display:grid;gap:12px;justify-items:start;padding-top:8px}
.lst-head h1{font-size:var(--t-d1)}
.lst-head h1 small,.sport-hero h1 small{display:block;font-size:.4em;color:var(--sun);margin-top:10px}
.lst-subs{display:flex;flex-wrap:wrap;gap:8px}
.lst-subs .chip{height:36px;padding:0 14px;font-size:13.5px;transition:all .2s}
.lst-subs .chip:hover{border-color:rgba(255,154,60,.45)}
.lst-subs .chip .ic{width:14px;height:14px}
.lst-body{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:start}
.lst-filters{position:sticky;top:calc(var(--hdr-total,var(--header-h)) + 16px);display:flex;flex-direction:column;max-height:calc(100vh - var(--header-h) - 32px);border-radius:var(--r-md);background:var(--ink-1);border:1px solid var(--line)}
.lf-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.lf-head b{font-size:15px}
.lf-clear{font-size:13px;color:var(--flare);font-weight:600}
.lf-x{display:none}
.lf-scroll{overflow:auto;padding:6px 18px 12px}
.lf-set{border:0;margin:0;padding:14px 0;border-bottom:1px solid var(--line)}
.lf-set:last-child{border-bottom:0}
.lf-set legend{font:650 10.5px/1 var(--f-label);font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);padding:0;margin-bottom:12px}
.lf-list{display:grid;gap:2px}
.lf-opt{position:relative;display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--bone-2)}
.lf-opt:hover{color:var(--bone)}
.lf-opt input{position:absolute;opacity:0;width:1px;height:1px}
.lf-opt .bx{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ash-2);transition:all .2s}
.lf-opt .bx .ic{width:12px;height:12px;stroke-width:2.6;opacity:0}
.lf-opt input:checked + .bx{background:var(--ember);border-color:var(--ember);color:#160604}
.lf-opt input:checked + .bx .ic{opacity:1}
.lf-opt input:focus-visible + .bx,.lf-opt input:focus-visible + .sw2{outline:2px solid var(--flare);outline-offset:2px}
.lf-l{flex:1}
.lf-n{font-size:12px;color:var(--ash-2);font-variant-numeric:tabular-nums}
.lf-pills{display:flex;flex-wrap:wrap;gap:6px}
.lf-opt.pill{padding:0}
.lf-opt.pill .bx{display:none}
.lf-opt.pill .lf-l{display:inline-grid;place-items:center;min-width:52px;height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;transition:all .2s}
.lf-opt.pill .lf-n{display:none}
.lf-opt.pill input:checked ~ .lf-l{background:var(--bone);color:#140604;border-color:var(--bone)}
.lf-opt.pill input:focus-visible ~ .lf-l{outline:2px solid var(--flare);outline-offset:2px}
.lf-toggle .sw2{flex:none;position:relative;width:36px;height:20px;border-radius:999px;background:var(--ink-4);transition:background .2s}
.lf-toggle .sw2::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--bone);transition:transform .25s var(--ease)}
.lf-toggle input:checked + .sw2{background:var(--ember)}
.lf-toggle input:checked + .sw2::after{transform:translateX(16px)}
.lf-foot{display:none}
.lst-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lst-count{margin-right:auto;font-size:14px;color:var(--ash)}
.lst-count b{color:var(--bone);font-size:16px}
.lst-open{display:none}
.lst-badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--ember);color:#160604;font-size:11px;font-weight:700;padding:0 5px}
.lst-badge[hidden]{display:none}
.lst-sort{position:relative;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ash)}
.lst-sort select{appearance:none;-webkit-appearance:none;height:40px;padding:0 36px 0 14px;border-radius:999px;background:var(--ink-2);border:1px solid var(--line-2);color:var(--bone);font-size:13.5px;font-weight:600;cursor:pointer}
.lst-sort .ic{position:absolute;right:12px;width:15px;height:15px;pointer-events:none}
.lst-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;min-height:0}
.lst-chips .chip{cursor:pointer}
.lst-chips .chip .ic{width:13px;height:13px}
.lst-clearall{font-size:13px;font-weight:600;color:var(--flare);padding:0 6px}
.lst-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.lst-empty{grid-column:1/-1;display:grid;justify-items:center;text-align:center;gap:12px;padding:60px 20px;border:1px dashed var(--line-2);border-radius:var(--r-md)}
.lst-empty b{font-size:18px}.lst-empty p{color:var(--ash)}
.lst-kitband{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:18px 22px;border-radius:18px;background:linear-gradient(100deg,#2a0803,#7a1a07 60%,#c63d10);border:1px solid rgba(255,154,60,.35)}
.lst-kitband > span{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,240,230,.12)}
.lst-kitband .ic{width:20px;height:20px}
.lst-kitband p{font-size:13.5px;color:var(--bone-2)}
.lst-q{display:flex;align-items:center;gap:10px;max-width:640px;padding:6px 6px 6px 18px;border-radius:999px;background:var(--ink-2);border:1px solid var(--line-2)}
.lst-q:focus-within{border-color:rgba(255,122,46,.6)}
.lst-q > .ic{width:18px;height:18px;color:var(--ash)}
.lst-q input{flex:1;min-width:0;height:40px;background:none;border:0;outline:0;font-size:15px}
.lst-alt{font-size:15px;color:var(--bone-2)}
.lst-alt a{color:var(--flare);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.lf-scrim{position:fixed;inset:0;z-index:70;background:rgba(5,3,3,.6);backdrop-filter:blur(4px)}
@media (max-width:1180px){.lst-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .lst-body{grid-template-columns:1fr}
  .lst-open{display:inline-flex}
  .lst-sort span{display:none}
  .lst-filters{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:75;max-height:84svh;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .45s var(--ease);visibility:hidden}
  .lst-filters.on{transform:none;visibility:visible}
  .lst-filters::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:10px auto 0}
  .lf-head .lf-clear{display:none}.lf-x{display:inline-grid}
  .lf-foot{display:flex;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
  .lf-foot .btn{flex:1}
}
@media (max-width:560px){.lst-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:visible;margin:0;padding:0}.lst-grid .pc{flex:none}
  .lst-grid .pc-name{font-size:13.5px}.lst-grid .pc-price{font-size:16px}.lst-grid .pc-opt{display:none}.lst-grid .sw{--h:42px;--k:34px}.lst-grid .sw-label{font-size:11.5px}}

/* card tools */
.pc-tools{position:absolute;right:18px;top:18px;z-index:2;display:flex;gap:6px}
.pc-tools .pc-save{position:static}
.pc-cmp{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(18,12,10,.85);color:var(--bone);opacity:0;transform:translateY(-4px);transition:all .3s var(--ease)}
.pc-cmp .ic{width:16px;height:16px}
.pc:hover .pc-cmp,.pc:focus-within .pc-cmp,.pc-cmp[aria-pressed="true"]{opacity:1;transform:none}
.pc-cmp[aria-pressed="true"]{background:var(--bone);color:#160604}
@media (hover:none){.pc-cmp{opacity:1;transform:none}}

/* ───────── product detail ───────── */
.pd-top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(28px,4vw,60px);align-items:start}
.pd-gal{position:sticky;top:calc(var(--hdr-total,var(--header-h)) + 16px);display:grid;gap:12px}
.pd-stage{position:relative;aspect-ratio:1/.92;border-radius:var(--r-lg);overflow:hidden;background:#120c0b;border:1px solid var(--line);outline-offset:4px}
.pd-slide{position:absolute;inset:0;opacity:0;transform:scale(1.02);transition:opacity .5s var(--ease),transform .7s var(--ease);pointer-events:none}
.pd-slide.on{opacity:1;transform:none;pointer-events:auto}
.pd-nav{position:absolute;top:50%;z-index:3;display:grid;place-items:center;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:rgba(11,8,7,.6);border:1px solid var(--line-2);backdrop-filter:blur(10px);transition:background .2s}
.pd-nav:hover{background:rgba(11,8,7,.85)}
.pd-nav .ic{width:18px;height:18px}
.pd-nav.prev{left:14px}.pd-nav.next{right:14px}
.pd-zoom{position:absolute;right:14px;top:14px;z-index:3;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:rgba(11,8,7,.6);border:1px solid var(--line-2);font-size:12.5px;font-weight:600;backdrop-filter:blur(10px)}
.pd-zoom .ic{width:14px;height:14px}
.pd-count{position:absolute;left:16px;top:16px;z-index:3;padding:7px 10px;border-radius:99px;background:rgba(12,8,6,.62);backdrop-filter:blur(8px);font:650 11px/1 var(--f-label);font-stretch:112%;letter-spacing:.12em;color:var(--ash)}
.pd-count b{color:var(--bone)}
.pd-thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pd-th{position:relative;display:grid;gap:6px;padding:0;text-align:left}
.pd-th-in{position:relative;display:block;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);transition:border-color .2s}
.pd-th-in .gv{transform:scale(1);pointer-events:none}
.pd-th-in .gv-tag,.pd-th-in .gv-cap,.pd-th-in .gv-lb,.pd-th-in .gv-ln{display:none}
.pd-th-l{font-size:12px;color:var(--ash);font-weight:600}
.pd-th[aria-selected="true"] .pd-th-in{border-color:var(--ember)}
.pd-th[aria-selected="true"] .pd-th-l{color:var(--bone)}
/* gallery views */
.gv{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.gv > img{max-width:70%;max-height:74%;object-fit:contain}
.gv-front{background:radial-gradient(80% 80% at 50% 40%,#f8f4f0 0%,#ebe4de 55%,#d8cfc8 100%)}
.gv-front img{filter:drop-shadow(0 28px 26px rgba(40,20,12,.3))}
.gv-front::after{content:"";position:absolute;left:28%;right:28%;bottom:9%;height:6%;border-radius:50%;background:radial-gradient(closest-side,rgba(40,20,12,.3),transparent)}
.gv-use{background:radial-gradient(70% 60% at 50% 45%,#5a1405,#1a0703 70%,#0e0807)}
.gv-use-in{position:absolute;left:50%;top:50%;height:calc(100% * var(--z));aspect-ratio:var(--ar);transform:translate(calc(-1 * var(--cx)),calc(-1 * var(--cy)))}
.gv-use-in img{position:absolute;left:0;top:0;width:100%;height:100%}
.gv-use-in .gv-use-gear{filter:drop-shadow(0 0 12px rgba(255,106,26,.7))}
.gv-cap{position:absolute;left:18px;top:16px;font:650 10.5px/1 var(--f-label);font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;color:var(--sun)}
.gv-detail{background:radial-gradient(80% 80% at 40% 40%,#f8f4f0,#d8cfc8)}
.gv-detail img{max-width:none;max-height:none;width:190%;transform:translate(8%,10%)}
.gv-detail .gv-cap{color:#b4400f}
.gv-poster{background:radial-gradient(70% 60% at 60% 45%,#ffb257 0%,#ff5a1f 22%,#a3240a 46%,#300904 72%,#120806 100%)}
.gv-word{position:absolute;left:-2%;top:50%;transform:translateY(-55%);font-family:var(--f-wide);font-stretch:62%;font-weight:900;font-size:clamp(90px,15vw,220px);line-height:.8;color:transparent;-webkit-text-stroke:2px rgba(255,236,220,.3);white-space:nowrap}
.gv-streak{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 16px,rgba(255,220,180,.13) 20px,transparent 28px);filter:blur(2px);-webkit-mask-image:linear-gradient(90deg,#000,transparent 70%);mask-image:linear-gradient(90deg,#000,transparent 70%)}
.gv-hero{position:relative;max-width:56%!important;max-height:64%!important;transform:rotate(-10deg);filter:drop-shadow(0 40px 34px rgba(0,0,0,.55))}
.gv-trail img{position:absolute;left:50%;top:50%;max-width:56%;max-height:64%;transform:translate(-50%,-50%) rotate(-10deg);opacity:.14;filter:blur(5px) sepia(1) saturate(5) hue-rotate(-14deg);mix-blend-mode:screen}
.gv-trail img:nth-child(1){translate:-7% 0}.gv-trail img:nth-child(2){translate:-15% 0;opacity:.1}.gv-trail img:nth-child(3){translate:-24% 0;opacity:.07}.gv-trail img:nth-child(4){translate:-34% 0;opacity:.04}
.gv-tag{position:absolute;left:18px;bottom:18px;display:grid;gap:4px;padding:12px 16px;border-radius:14px;background:rgba(15,8,6,.5);backdrop-filter:blur(12px);border:1px solid rgba(255,236,220,.14)}
.gv-tag .mono{color:var(--sun)}
.gv-tag b{font-size:15px}
.gv-specs{background:#0f0b0a}
.gv-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,154,60,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,154,60,.07) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent);mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent)}
.gv-spec-box{position:relative;width:46%;aspect-ratio:1;display:grid;place-items:center}
.gv-spec-box > img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 24px 24px rgba(0,0,0,.6))}
.gv-pt{position:absolute;width:0;height:0}
.gv-pt i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--bone);box-shadow:0 0 0 4px rgba(255,90,31,.35)}
.gv-pt i::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(255,190,140,.7);animation:ping 2.2s var(--ease) infinite}
.gv-ln{position:absolute;top:0;height:1px;width:clamp(40px,8vw,110px);background:linear-gradient(90deg,rgba(255,236,220,.8),rgba(255,236,220,.2))}
.gv-ln.r{left:8px}.gv-ln.l{right:8px;transform:scaleX(-1)}
.gv-lb{position:absolute;top:-18px;display:grid;gap:2px;width:max-content;max-width:160px;font-size:12.5px;font-weight:600;line-height:1.3}
.gv-lb small{font:650 9.5px/1 var(--f-label);font-stretch:112%;letter-spacing:.12em;text-transform:uppercase;color:var(--flare)}
.gv-lb.r{left:calc(clamp(40px,8vw,110px) + 14px)}.gv-lb.l{right:calc(clamp(40px,8vw,110px) + 14px);text-align:right}
/* zoom */
.zoom{position:fixed;inset:0;z-index:96;background:rgba(5,3,3,.94);display:grid;place-items:center;cursor:zoom-out;animation:fade .25s}
.zoom-in{position:relative;width:min(92vw,1100px);aspect-ratio:1/.92;border-radius:20px;overflow:hidden}
.zoom-img{position:absolute;inset:0;transition:transform .2s ease-out}
.zoom-x{position:absolute;right:20px;top:calc(20px + env(safe-area-inset-top,0px));background:rgba(255,240,230,.1)}
.zoom-hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--ash)}
/* info */
.pd-info{display:grid;gap:16px;align-content:start}
.pd-title{font-family:var(--f-wide);font-stretch:112%;font-weight:700;font-size:clamp(28px,2.8vw,42px);line-height:1.06;letter-spacing:-.01em}
.pd-attr{color:var(--bone-2);font-size:15.5px}
.pd-price{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.pd-price b{font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pd-tax{font-size:12.5px;color:var(--ash)}
.pd-opt{display:grid;gap:10px;padding:16px 0;border-block:1px solid var(--line)}
.pd-opt-h{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;font-weight:600}
.pd-fys{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--flare);font-weight:600}
.pd-fys .ic{width:16px;height:16px}
.pd-vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pd-v{display:grid;place-items:center;gap:2px;min-height:48px;padding:8px;border-radius:12px;border:1.5px solid var(--line-2);font-size:13.5px;font-weight:600;color:var(--bone-2);transition:all .2s}
.pd-v small{font-size:10px;color:var(--ash-2)}
.pd-v:hover{border-color:rgba(255,154,60,.5);color:var(--bone)}
.pd-v[aria-checked="true"]{background:var(--bone);border-color:var(--bone);color:#140604}
.pd-v[aria-disabled="true"]{color:var(--ash-2);text-decoration:line-through;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,240,230,.04) 6px 7px);cursor:not-allowed}
.pd-v[aria-disabled="true"] small{text-decoration:none}
.pd-err{font-size:13px;color:#ff9a8a;font-weight:600}
.pd-buy{display:flex;gap:12px;align-items:center}
.pd-add{flex:1;--h:58px}
.pd-add .ic{width:18px;height:18px}
.pd-add.loading{opacity:.75;pointer-events:none}
/* quantity stepper (ref: pill, gradient rim, round buttons with a coloured under-glow) */
.qty{position:relative;display:flex;align-items:center;gap:6px;height:58px;padding:0 7px;border-radius:999px;background:var(--ink-2);isolation:isolate}
.qty::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(90deg,#ff5a1f,#ffb257);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:-1}
.qty-b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,240,230,.12);color:var(--bone);transition:transform .2s,background .2s,box-shadow .2s}
.qty-b:first-child{box-shadow:0 4px 0 -1px rgba(255,90,31,.55)}
.qty-b:last-child{box-shadow:0 4px 0 -1px rgba(255,178,87,.55)}
.qty-b .ic{width:18px;height:18px;stroke-width:2.2}
.qty-b:hover:not(:disabled){background:rgba(255,240,230,.2)}
.qty-b:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.qty-b:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.qty-v{min-width:34px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.pd-msg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;min-height:0}
.pd-msg .ic{width:16px;height:16px}
.pd-msg[data-k="ok"]{color:var(--ok)}.pd-msg[data-k="err"]{color:#ff9a8a}
.pd-link{font-weight:700;color:var(--bone);text-decoration:underline;text-underline-offset:3px;font-size:13.5px}
.pd-acts{display:flex;gap:10px}
.pd-act{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);font-size:13.5px;font-weight:600;transition:all .2s}
.pd-act .ic{width:17px;height:17px}
.pd-act:hover{background:rgba(255,240,230,.06)}
.pd-act[aria-pressed="true"]{border-color:rgba(255,90,31,.6);background:rgba(255,90,31,.12)}
#pd-save[aria-pressed="true"] .ic{fill:var(--ember);color:var(--ember)}
.pd-del{display:grid;gap:12px;padding:18px;border-radius:18px;background:var(--ink-1);border:1px solid var(--line)}
.pd-del-h{display:flex;align-items:center;gap:10px;font-size:14px}
.pd-del-h .ic{width:18px;height:18px;color:var(--flare)}
.pd-del-row{display:flex;gap:8px}
.pd-del-row[hidden]{display:none}
.pd-del-row input{flex:1;min-width:0;height:42px;padding:0 14px;border-radius:12px;background:var(--ink-2);border:1px solid var(--line-2);outline:0;font-size:15px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.pd-del-row input:focus{border-color:rgba(255,122,46,.6)}
.pd-del-row input[aria-invalid="true"]{border-color:#ff7a6a}
.pd-del-err,.pd-del-load{display:flex;align-items:center;gap:8px;font-size:13px;color:#ff9a8a}
.pd-del-load{color:var(--ash)}
.pd-del-err .ic{width:15px;height:15px;flex:none}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--flare);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pd-del-ok{display:grid;gap:10px}
.pd-del-pin{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.pd-del-pin .ic{width:16px;height:16px;color:var(--ok)}
.pd-del-pin .pd-link{margin-left:auto}
.pd-del-ok ul{display:grid;gap:6px}
.pd-del-ok li{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;background:var(--ink-2)}
.pd-del-ok li span{display:grid;gap:2px}
.pd-del-ok li b{font-size:13.5px}
.pd-del-ok li small{font-size:12.5px;color:var(--ash)}
.pd-del-ok li em{font-style:normal;font-weight:700;font-size:13.5px}
.pd-del-ok p{font-size:12px}
.pd-trust{display:grid;gap:8px}
.pd-trust li{display:flex;gap:10px;font-size:13px;color:var(--ash)}
.pd-trust .ic{width:16px;height:16px;color:var(--flare);flex:none;margin-top:1px}
.pd-more{max-width:900px;border-top:1px solid var(--line)}
.pa{border-bottom:1px solid var(--line)}
.pa h3{margin:0}
.pa-b{display:flex;width:100%;justify-content:space-between;align-items:center;padding:20px 2px;font-size:17px;font-weight:650;text-align:left}
.pa-b .ic{width:18px;height:18px;transition:transform .3s var(--ease)}
.pa-b[aria-expanded="true"] .ic{transform:rotate(45deg)}
.pa-p{display:grid;gap:14px;padding:0 2px 24px;color:var(--bone-2);font-size:15px;max-width:68ch}
.pa-p .pp-specs{max-width:640px}
.pd-chart{width:100%;max-width:480px;border-collapse:collapse;font-size:14px}
.pd-chart th,.pd-chart td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.pd-chart th{font:650 10.5px/1 var(--f-label);font-stretch:112%;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.pd-in{color:var(--ok)}.pd-out{color:var(--ash-2)}
.pd-compat .sec-head h2{font-size:var(--t-d2)}
@media (max-width:980px){.pd-top{grid-template-columns:minmax(0,1fr)}.pd-gal{position:static}}
@media (max-width:560px){.pd-buy{flex-wrap:wrap}.qty{height:52px}.qty-b{width:40px;height:40px}.pd-add{--h:52px;flex:1 1 60%}.gv-lb{max-width:110px;font-size:11px}.gv-ln{width:28px}.gv-lb.r{left:40px}.gv-lb.l{right:40px}}

/* ───────── compare tray + page ───────── */
.ctray{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:66;width:min(860px,calc(100% - 24px));animation:toastIn .4s var(--ease)}
.ct-in{display:flex;align-items:center;gap:16px;padding:10px 10px 10px 20px;border-radius:22px;background:rgba(22,16,14,.92);border:1px solid var(--line-2);backdrop-filter:blur(18px);box-shadow:0 24px 60px -20px rgba(0,0,0,.9)}
.ct-t{display:grid;gap:2px;flex:none}
.ct-t small{font-size:11.5px;color:var(--ash)}
.ct-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:1;min-width:0}
.ct-slot{position:relative;display:flex;align-items:center;gap:8px;height:52px;padding:4px 30px 4px 4px;border-radius:14px;background:var(--ink-3);min-width:0;font-size:12px}
.ct-slot img{width:44px;height:44px;object-fit:contain;border-radius:10px;background:#efe8e2;flex:none}
.ct-slot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-slot.empty{justify-content:center;padding:4px;border:1px dashed var(--line-2);background:none;color:var(--ash-2)}
.ct-slot.empty span{display:inline-flex;align-items:center;gap:6px}
.ct-slot.empty .ic{width:14px;height:14px}
.ct-x{position:absolute;right:6px;top:50%;margin-top:-11px;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,240,230,.1)}
.ct-x .ic{width:12px;height:12px}
.ct-acts{display:flex;align-items:center;gap:12px;flex:none}
.btn.is-off{opacity:.45}
@media (max-width:700px){.ct-in{flex-wrap:wrap;gap:10px;padding:12px}.ct-slots{order:3;flex-basis:100%}.ct-slot span{display:none}.ct-slot{justify-content:center;padding:4px}.ct-acts{margin-left:auto}}
.cmp-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.cmp-wrap{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--line)}
.cmp-t{width:100%;min-width:640px;border-collapse:collapse;table-layout:fixed}
.cmp-t th,.cmp-t td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
.cmp-t tbody th{font:650 10.5px/1.4 var(--f-label);font-stretch:112%;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);width:180px}
.cmp-t thead th{background:var(--ink-1);vertical-align:bottom}
.cmp-t thead th:first-child{width:180px}
.cmp-p{position:relative;display:grid;gap:10px}
.cmp-p .ct-x{top:8px;right:8px;margin:0;z-index:2;background:rgba(20,10,6,.75);color:#fff}
.cmp-p a:first-of-type{display:grid;gap:10px}
.cmp-img{position:relative;overflow:hidden;display:grid;place-items:center;height:150px;border-radius:14px;background:radial-gradient(80% 80% at 50% 40%,#f7f3ef,#dcd3cc)}
.cmp-img img{position:static;width:100%;height:122px;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.22))}
.cmp-p b{font-size:14.5px;line-height:1.3}
.cmp-p .btn{justify-self:start}
.cmp-add{display:grid;place-items:center;gap:8px;height:230px;border-radius:14px;border:1px dashed var(--line-2);color:var(--ash);font-size:13px;text-align:center;padding:12px}
.cmp-add .ic{width:22px;height:22px}
.sv-tabs{max-width:360px}

body.has-tray .toasts{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
@media(max-width:700px){body.has-tray .toasts{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}

.lst-none .lst-filters,.lst-none .lst-open,.lst-none .lst-sort{display:none!important}
.lst-none .lst-body{grid-template-columns:1fr!important}
.lnk{color:var(--ember-2,#ff8a3d);text-decoration:underline;text-underline-offset:3px}
.lf-set legend{margin-bottom:6px}

/* ───────── Phase 4: budget slider, kit builder, kit result, find your size, size hints ───────── */
/* budget slider — works on the cream question card and the dark summary card */
.kb{--kb-track:#e6ddd5;--kb-txt:#16100e;--kb-mut:#8a7d75;display:grid;gap:10px;margin-top:6px}
.kb-v{font-family:var(--f-wide);font-stretch:125%;font-weight:800;font-size:clamp(30px,3vw,40px);line-height:1;letter-spacing:-.01em;color:var(--kb-txt)}
.kb-r{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer;margin:2px 0}
.kb-r::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,#ff8a2a,#ff5a1f var(--p),var(--kb-track) var(--p))}
.kb-r::-moz-range-track{height:8px;border-radius:99px;background:var(--kb-track)}
.kb-r::-moz-range-progress{height:8px;border-radius:99px;background:linear-gradient(90deg,#ff8a2a,#ff5a1f)}
.kb-r::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:#fff;border:7px solid #ff5a1f;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.kb-r::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:6px solid #ff5a1f}
.kb-r:active::-webkit-slider-thumb{transform:scale(1.12)}
.kb-r:focus-visible{outline:none}.kb-r:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(255,90,31,.35)}
.kb-scale{display:flex;justify-content:space-between;font:650 10.5px/1 var(--f-label);font-stretch:112%;letter-spacing:.1em;color:var(--kb-mut)}
.kb-core{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;color:#5c504a;padding:10px 12px;border-radius:12px;background:#f1eae4}
.kb-core .ic{width:15px;height:15px;flex:none;margin-top:2px;color:#c2410c}
.kb-core em{font-style:normal}
.kb-core.short{background:#fdeee6;color:#8a2a10}

/* question card extras */
.kq .pd-link{color:#16100e}
.kq-multi .kq-o i{border-radius:5px;display:grid;place-items:center}
.kq-multi .kq-o i .ic{width:11px;height:11px;color:#fff;opacity:0}
.kq-multi .kq-o[aria-checked="true"] i{border:1.5px solid #ff5a1f;background:#ff5a1f}
.kq-multi .kq-o[aria-checked="true"] i .ic{opacity:1}
.kq-o span{display:grid;gap:2px}
.kq-o small{font-size:12.5px;font-weight:450;color:#7a6e67}
.kq-o2{padding:11px 10px}
.kq-o[aria-disabled="true"]{opacity:.5;cursor:not-allowed}

/* ───── kit builder page ───── */
.kitpg-grid{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);gap:56px;align-items:start;margin-top:18px}
.kitpg-copy{display:grid;gap:18px;position:sticky;top:110px}
.kitpg-copy h1{font-size:var(--t-d1);line-height:.92;text-transform:uppercase}
.kitpg-sum{display:grid;margin-top:6px;border-top:1px solid var(--line)}
.kitpg-sum li{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;animation:toastIn .4s var(--ease)}
.kitpg-sum span{font:650 10.5px/1 var(--f-label);font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;color:var(--ash-2)}
.kitpg-sum .pd-link{font-size:12.5px;color:var(--ash)}
.kq-page{min-height:560px}
.kq-page .kq-l{padding:34px 34px 28px;gap:14px}
.kq-page .kq-q{font-size:clamp(22px,2vw,28px);max-width:20ch}
@media (max-width:980px){.kitpg-grid{grid-template-columns:1fr;gap:28px}.kitpg-copy{position:static}}
@media (max-width:700px){.kq-page{grid-template-columns:1fr}.kq-page .kq-r{display:none}.kq-page .kq-l{padding:24px 20px}.kitpg-sum li{grid-template-columns:90px 1fr auto}}

/* ───── kit result ───── */
.kr-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin:18px 0 34px}
.kr-head h1{font-size:var(--t-d1);line-height:.92;text-transform:uppercase;margin-top:10px}
.kr-ans{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kr-ans .chip .ic{width:14px;height:14px}
.kr-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:36px;align-items:start}
.kr-sec{margin-bottom:34px}
.kr-sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.kr-sh h2{font-family:var(--f-wide);font-stretch:125%;font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.01em}
.kr-sh span{font-size:13px;color:var(--ash)}
.kr-list{display:grid}
.kr-it{display:grid;grid-template-columns:auto 104px minmax(0,1fr) auto;gap:18px;align-items:start;padding:18px 0;border-bottom:1px solid var(--line);transition:opacity .25s}
.kr-it:not(.on){opacity:.62}
.kr-it:not(.on):hover{opacity:.9}
.kr-tick{width:26px;height:26px;margin-top:38px;border-radius:8px;border:1.5px solid var(--line-2);display:grid;place-items:center;transition:all .2s var(--ease)}
.kr-tick .ic{width:15px;height:15px;color:#fff;opacity:0;transform:scale(.6);transition:all .2s var(--ease)}
.kr-tick[aria-checked="true"]{background:var(--grad-ember);border-color:transparent}
.kr-tick[aria-checked="true"] .ic{opacity:1;transform:none}
.kr-tick:hover{border-color:var(--ember-2)}

/* custom dropdown (replaces OS select menus) */

.dd-b:hover{border-color:rgba(255,154,60,.45)}

.dd-b .ic{width:15px;height:15px;color:var(--ash);transition:transform .3s var(--ease);flex:none}

.dd.up .dd-l{top:auto;bottom:calc(100% + 8px);animation-name:ddUp}

.lst-sort .dd{min-width:190px}.lst-sort .dd-b{border-radius:999px;height:40px}
.kr-size{display:flex;align-items:center;gap:10px;margin-top:4px}

/* guides: objects sized by height so long bats can't escape the card; hover lifts stay inside the frame */
.gd-big .gd-bg{overflow:hidden}
.gd-objs{inset:-24px 0 44% 34%}
.gd-big .gdo-0{left:38%;top:-2%;width:auto;height:118%;transform:rotate(-24deg);transform-origin:50% 60%}
.gd-big .gdo-1{left:4%;top:44%;width:auto;height:46%}
.gd-big:hover .gdo-0{transform:rotate(-20deg) translateY(-10px)}
.gd-big:hover .gdo-1{transform:translateY(-12px) rotate(16deg)}
.gd-thumb{overflow:hidden}
.gd-thumb img{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);max-width:none;max-height:none;object-fit:contain}
.gd-row:hover .gd-thumb img{transform:scale(1.06) rotate(-5deg) translateY(-5px)}
/* product cards: hover pop keeps a gap to the image frame */
.pc-media img{transform-origin:50% 60%}

/* drawer: kit lines */
.kt-stack{display:inline-flex;vertical-align:middle;margin-right:8px}
.kt-stack img,.kt-stack i{width:24px;height:24px;border-radius:7px;object-fit:contain;padding:2px;background:#efe8e2;box-shadow:0 0 0 2px var(--ink-2)}
.kt-stack>*+*{margin-left:-7px}
.kt-stack i{display:grid;place-items:center;font:700 10px/1 var(--f-body);font-style:normal;color:#16100e}
.d-kit .d-thumb{background:radial-gradient(circle at 50% 40%,#ff9a3c33,#140c0a)}
.d-kit small{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.d-meta a:hover b{color:var(--ember-2)}
.fly{position:fixed;z-index:300;width:120px;height:120px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 16px 20px rgba(0,0,0,.5))}

/* cart page */
.ck-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:36px;align-items:start;margin-top:22px}
.ck-grid.is-empty{display:block}
.cart-empty{min-height:44vh}
.ck-side{position:sticky;top:96px}
.ck-sum{gap:12px}
.ck-sum h2{font-family:var(--f-wide);font-stretch:118%;font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.ck-total{padding-top:12px;border-top:1px solid var(--line)}
.ck-total b{font-family:var(--f-wide);font-stretch:118%;font-weight:800;font-size:22px}
.ck-free{display:grid;gap:6px}.ck-free small{font-size:12.5px;color:var(--ash)}
.ck-ok{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok)}.ck-ok .ic{width:14px;height:14px}
.ck-pin{display:grid;gap:8px}
.ck-pin label{font-size:12.5px;color:var(--ash)}
.ck-pin>div{display:flex;gap:8px}
.ck-pin input{flex:1;min-width:0;height:40px;padding:0 14px;border-radius:12px;background:var(--ink-3);border:1px solid var(--line-2);color:var(--bone);font:500 14px var(--f-body);letter-spacing:.06em}
.ck-pin input:focus{outline:none;border-color:var(--ember-2)}
.ck-pin-m{font-size:12.5px;color:var(--bone-2);display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.ck-pin-m:empty{display:none}.ck-pin-m .ic{width:14px;height:14px;color:var(--ok);flex:none;margin-top:2px}.ck-pin-m .err{color:var(--err)}
.ck-go{width:100%;justify-content:center}
.cl-list{display:grid}
.cl{display:grid;grid-template-columns:128px minmax(0,1fr) auto;gap:20px;align-items:start;padding:20px 0;border-bottom:1px solid var(--line)}
.cl:first-child{border-top:1px solid var(--line)}
.cl-img{position:relative;width:128px;height:128px;border-radius:18px;background:radial-gradient(80% 80% at 50% 40%,#f7f3ef,#dcd3cc);display:grid;place-items:center;overflow:hidden}
.cl-img img{width:80%;height:80%;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(0,0,0,.2));transition:transform .4s var(--ease)}
.cl-img:hover img{transform:scale(1.05)}
.cl-kit .cl-img{background:radial-gradient(80% 80% at 50% 35%,#ffb257,#ff5a1f 40%,#7c1a06 100%)}
.cl-badge{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;background:rgba(15,8,6,.78);font:650 10px/1 var(--f-label);font-stretch:112%;letter-spacing:.12em;text-transform:uppercase;color:var(--sun)}
.cl-badge .ic{width:12px;height:12px}
.cl-t{display:grid;gap:6px;min-width:0}
.cl-n{font-weight:650;font-size:17px;color:var(--bone)}.cl-n:hover{color:var(--ember-2)}
.cl-t>small{font-size:13px;color:var(--ash)}
.cl-acts{display:flex;align-items:center;gap:18px;margin-top:8px;flex-wrap:wrap}
.cl-acts .pd-link{color:var(--ash);font-size:13px}.cl-acts .pd-link:hover{color:var(--bone)}
.qty-sm{height:44px;padding:0 5px}.qty-sm .qty-b{width:34px;height:34px}.qty-sm .qty-v{font-size:16px;min-width:26px}
.cl-p{font-size:17px;text-align:right;white-space:nowrap;display:grid;gap:2px}.cl-p small{font-size:12px;font-weight:500;color:var(--ash)}
.cl-kitd{margin-top:4px;border-radius:14px;background:var(--ink-2);border:1px solid var(--line)}
.cl-kitd summary{display:flex;align-items:center;gap:6px;padding:10px 12px;cursor:pointer;list-style:none;font-size:13px;font-weight:600}
.cl-kitd summary::-webkit-details-marker{display:none}
.cl-kitd summary .ic{width:14px;height:14px;margin-left:auto;transition:transform .3s}
.cl-kitd[open] summary .ic{transform:rotate(180deg)}
.cl-kitd ul{display:grid;padding:0 12px 10px}
.cl-kitd li{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px;color:var(--bone-2)}
.cl-kitd li img{width:36px;height:36px;border-radius:9px;object-fit:contain;padding:3px;background:#efe8e2}
.cl-kitd em{font-style:normal;color:var(--sun)}
.cl-note{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:12.5px;color:var(--ash-2)}.cl-note .ic{width:14px;height:14px}
@media (max-width:980px){.ck-grid{grid-template-columns:1fr}.ck-side{position:static}}
@media (max-width:600px){.cl{grid-template-columns:84px minmax(0,1fr);gap:14px}.cl-img{width:84px;height:84px;border-radius:14px}.cl-p{grid-column:2;text-align:left;display:flex;gap:8px;align-items:baseline}.cl-badge{display:none}}

/* kit bundle detail */
.kd-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start;margin-top:18px}
.kd-stage{position:relative;aspect-ratio:1/1;border-radius:28px;overflow:hidden;isolation:isolate;background:radial-gradient(70% 60% at 50% 45%,#ffb257 0%,#ff5a1f 22%,#a3240a 48%,#300904 76%,#120806 100%);display:grid;place-items:center}
.kd-stage .gv-word{position:absolute;inset:auto 0 50% 0;transform:translateY(50%);text-align:center;font-family:var(--f-wide);font-stretch:62%;font-weight:900;font-size:clamp(140px,20vw,300px);line-height:.8;color:transparent;-webkit-text-stroke:2px rgba(255,236,220,.3);z-index:-1}
.kd-bag{width:52%;height:62%;object-fit:contain;filter:drop-shadow(0 40px 40px rgba(0,0,0,.55))}
.kd-orbit{position:absolute;inset:0;pointer-events:none}
.kd-orbit img{position:absolute;width:20%;height:20%;object-fit:contain;padding:8px;border-radius:18px;background:rgba(250,246,242,.92);box-shadow:0 18px 30px -12px rgba(0,0,0,.6);
  left:calc(50% + 38% * cos(calc(var(--i) * 60deg - 90deg)) - 10%);top:calc(50% + 38% * sin(calc(var(--i) * 60deg - 90deg)) - 10%);animation:kdPop .6s var(--ease) both;animation-delay:calc(var(--i)*80ms)}
@keyframes kdPop{from{opacity:0;transform:scale(.6)}}
.kd-info{display:grid;gap:12px}
.kd-h{font-family:var(--f-wide);font-stretch:118%;font-weight:800;font-size:18px;text-transform:uppercase;margin-top:14px}
.kd-list{display:grid}
.kd-list li{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.kd-list .kr-img{width:64px;height:64px;border-radius:12px}
.kd-list small{display:block;font-size:12.5px;color:var(--ash);margin-top:2px}
.kd-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
@media (max-width:900px){.kd-grid{grid-template-columns:1fr}}

/* account popover */
.acct-btn.in{border-color:rgba(255,154,60,.4)}
.pop-head:has(.pop-av){display:flex;gap:12px;align-items:center}
.pop-av{display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:50%;background:var(--grad-ember);font-weight:800;color:#1a0703}
.pop-link em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,90,31,.18);color:var(--sun)}
button.pop-link{width:100%;text-align:left}

/* auth */
.au-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:40px;align-items:stretch;margin-top:24px}
.au-card{padding:clamp(24px,3vw,44px);border-radius:28px;background:#faf6f2;color:#16100e;box-shadow:0 40px 90px -30px rgba(0,0,0,.8);display:grid;gap:14px;align-content:start}
.au-card .eyebrow{color:#8a7d75}
.au-h{font-size:clamp(40px,4.4vw,64px);line-height:.92;text-transform:uppercase;color:#16100e}
.au-lead{font-size:15px;color:#5c504a;max-width:44ch}
.au-form{display:grid;gap:14px;margin-top:6px}
.fld{display:grid;gap:7px;min-width:0}
.fld>label{font-size:13px;font-weight:600;color:#3a2f2a}
.fld-in{position:relative;display:flex;align-items:center;height:52px;border-radius:14px;background:#fff;border:1.5px solid #ddd2c9;transition:border-color .2s,box-shadow .2s}
.fld-in:focus-within{border-color:#ff5a1f;box-shadow:0 0 0 4px rgba(255,90,31,.14)}
.fld-in input{flex:1;min-width:0;height:100%;padding:0 16px;border:0;background:none;outline:none;font:500 15.5px var(--f-body);color:#16100e;border-radius:14px}
.fld-in input::placeholder{color:#b3a79f}
.fld.bad .fld-in{border-color:#b42318;box-shadow:0 0 0 4px rgba(180,35,24,.1)}
.fld-eye{display:grid;place-items:center;width:44px;height:44px;margin-right:4px;border-radius:10px;color:#8a7d75}
.fld-eye:hover{background:#f1eae4;color:#16100e}.fld-eye.on{color:#c2410c}
.fld-eye .ic{width:19px;height:19px}
.fld-h{font-size:12px;color:#8a7d75}
.fld-e,.au-err{font-size:12.5px;font-weight:600;color:#b42318;line-height:1.45}
.au-err{padding:12px 14px;border-radius:12px;background:#fdecea}
.au-err .pd-link,.au-card .pd-link,.ad-form .pd-link,.ck-sec .pd-link{color:#16100e}
.au-ok{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#e7f6ec;color:#1d5a35;font-size:13.5px}
.au-ok .ic{width:16px;height:16px;flex:none;margin-top:2px}
.au-row{display:flex;justify-content:space-between;align-items:center;margin-top:-4px}
.au-go{width:100%;justify-content:center;margin-top:4px;--h:52px}
.au-alt{font-size:14px;color:#5c504a;text-align:center;padding-top:14px;border-top:1px solid #ebe3dc}
.pw-rules{display:grid;gap:6px;margin-top:-4px}
.pw-rules li{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#8a7d75;transition:color .2s}
.pw-rules li .ic{width:14px;height:14px;stroke-width:2.2}
.pw-rules li.ok{color:#1d7a43}
.ck-line{position:relative;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:#3a2f2a;cursor:pointer;line-height:1.45}
.ck-line input{position:absolute;opacity:0;width:20px;height:20px;margin:0}
.ck-line .bx{width:20px;height:20px;flex:none;border-radius:6px;border:1.5px solid #b7aaa2;display:grid;place-items:center;transition:all .2s;margin-top:1px}
.ck-line .bx .ic{width:12px;height:12px;color:#fff;opacity:0;stroke-width:2.6}
.ck-line input:checked+.bx{background:#ff5a1f;border-color:#ff5a1f}.ck-line input:checked+.bx .ic{opacity:1}
.ck-line input:focus-visible+.bx{box-shadow:0 0 0 3px rgba(255,90,31,.3)}
.au-demo-code{display:flex;gap:8px;align-items:center;padding:12px 14px;border-radius:12px;background:#16100e;color:#faf6f2;font-size:13.5px}
.au-demo-code b{font-family:var(--f-wide);font-stretch:118%;letter-spacing:.18em;color:var(--sun);font-size:16px}
.au-demo-code .ic{width:16px;height:16px;color:var(--sun)}
.au-side{position:relative;display:grid;gap:22px;align-content:space-between;padding:28px;border-radius:28px;overflow:hidden;isolation:isolate;background:linear-gradient(170deg,#1b1412,#0e0a09);border:1px solid var(--line)}
.au-art{position:relative;height:300px;border-radius:22px;overflow:hidden;background:radial-gradient(70% 70% at 55% 45%,#ffb257 0%,#ff5a1f 22%,#a3240a 50%,#2a0703 85%)}
.au-art .gv-word{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-wide);font-stretch:62%;font-weight:900;font-size:120px;color:transparent;-webkit-text-stroke:1.5px rgba(255,236,220,.3);white-space:nowrap}
.au-art img{position:absolute;object-fit:contain;filter:drop-shadow(0 26px 26px rgba(0,0,0,.5));animation:shoeHover 3.4s ease-in-out infinite alternate}
.au-o1{left:6%;top:14%;width:44%}.au-o2{right:4%;bottom:6%;width:52%;animation-delay:-1.2s!important}.au-o3{right:12%;top:6%;width:24%;animation-delay:-2s!important}
.au-perks{display:grid;gap:16px}
.au-perks li{display:flex;gap:14px;align-items:flex-start}
.au-perks .ic{width:22px;height:22px;flex:none;color:var(--ember-2)}
.au-perks span{display:grid;gap:3px;font-size:13.5px;color:var(--ash)}.au-perks b{font-size:15px;color:var(--bone)}
.au-demo{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:22px;font-size:12.5px;color:var(--ash-2)}.au-demo .ic{width:14px;height:14px}
@media (max-width:900px){.au-grid{grid-template-columns:1fr}.au-side{display:none}}

/* checkout */
.ck-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:16px 0 4px}
.ck-head h1{font-size:var(--t-d2);text-transform:uppercase;margin-top:8px}
.ck-head .eyebrow .ic{width:14px;height:14px}
.ck-steps{display:flex;gap:6px;align-items:center}
.ck-steps li{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ash-2)}
.ck-steps li+li::before{content:"";width:34px;height:2px;border-radius:2px;background:var(--line-2);margin-right:4px}
.ck-steps span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);font-size:12px}
.ck-steps span .ic{width:13px;height:13px;stroke-width:2.4}
.ck-steps li.c{color:var(--bone)}.ck-steps li.c span{background:var(--grad-ember);border-color:transparent;color:#1a0703}
.ck-steps li.d{color:var(--bone-2)}.ck-steps li.d span{background:rgba(95,209,139,.16);border-color:transparent;color:var(--ok)}
.ck-steps li.d+li::before{background:var(--ok)}
.ck-main{display:grid;gap:14px}
.ck-sec{border-radius:24px;background:var(--ink-2);border:1px solid var(--line);overflow:hidden;transition:border-color .3s}
.ck-sec.on{background:#faf6f2;color:#16100e;border-color:transparent;box-shadow:0 30px 70px -30px rgba(0,0,0,.8)}
.ck-sec>header{display:flex;align-items:center;gap:14px;padding:20px 24px}
.ck-sec h2{font-size:18px;font-weight:700;flex:1}
.ck-n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-2);font-weight:700;font-size:13px;color:var(--ash)}
.ck-sec.on .ck-n{background:#16100e;border-color:#16100e;color:#faf6f2}
.ck-sec.done .ck-n{background:rgba(95,209,139,.16);border-color:transparent;color:var(--ok)}.ck-n .ic{width:14px;height:14px;stroke-width:2.4}
.ck-sec.done .pd-link{color:var(--bone)}
.ck-done{padding:0 24px 20px 68px;font-size:14px;color:var(--bone-2)}
.ck-sec:not(.on):not(.done)>header{opacity:.55}
.ck-body{padding:0 24px 24px;display:grid;gap:16px}
.ad-list{display:grid;gap:10px}
.ad{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:16px;border-radius:16px;border:1.5px solid #e6ddd5;background:#fff;cursor:pointer;transition:border-color .2s}
.ad.on{border-color:#ff5a1f;background:#fff8f3}
.ad input,.dm input{position:absolute;opacity:0}
.ad-r{width:20px;height:20px;border-radius:50%;border:1.5px solid #b7aaa2;margin-top:2px;transition:all .2s}
.ad.on .ad-r,.dm.on .ad-r{border:6px solid #ff5a1f}
.ad input:focus-visible~.ad-r,.dm input:focus-visible~.ad-r{box-shadow:0 0 0 3px rgba(255,90,31,.3)}
.ad-t{display:grid;gap:3px;font-size:13.5px;color:#5c504a}
.ad-t b{font-size:15px;color:#16100e;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ad-t em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#f1eae4;color:#5c504a}
.ad-t em.def{background:#16100e;color:#faf6f2}
.ad-t small{color:#8a7d75}
.ad-add{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;border:1.5px dashed #cdbfb5;font-weight:600;color:#3a2f2a;transition:all .2s}
.ad-add:hover{border-color:#ff5a1f;color:#c2410c;background:#fff8f3}.ad-add .ic{width:16px;height:16px}
.ad-form{display:grid;gap:16px}.ad-form h3{font-size:16px}
.ad-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fld-wide{grid-column:1/-1}
.ad-grid .fld .dd{width:100%}
.ad-grid .dd-b,.paypane .dd-b{height:52px;border-radius:14px;background:#fff;border:1.5px solid #ddd2c9;color:#16100e;font-size:15px;font-weight:500}
.ad-grid .dd-v.ph,.paypane .dd-v.ph{color:#b3a79f}
.ad-grid .dd.on .dd-b,.paypane .dd.on .dd-b{background:#fff;border-color:#ff5a1f}
.fld.bad .dd-b{border-color:#b42318}
.ad-type{display:flex;gap:8px;flex-wrap:wrap}
.ad-type .chip{position:relative;height:38px;padding:0 14px;cursor:pointer;background:#fff;border:1.5px solid #e6ddd5;color:#3a2f2a;font-weight:600;font-size:13px}
.ad-type .chip input{position:absolute;opacity:0}
.ad-type .chip .ic{width:15px;height:15px}
.ad-type .chip.on{border-color:#16100e;background:#16100e;color:#faf6f2}
.ad-type .chip:focus-within{box-shadow:0 0 0 3px rgba(255,90,31,.3)}
.ad-acts{display:flex;justify-content:flex-end;gap:10px}
.ck-next{display:flex;justify-content:flex-end;align-items:center;gap:16px}
.ck-place{justify-content:space-between;flex-wrap:wrap;padding-top:6px;border-top:1px solid #ebe3dc}
.ck-place .kr-fine{border:0;padding:0;color:#8a7d75}
.ck-warn{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#fdf1e7;color:#8a3a12;font-size:13.5px;line-height:1.45}
.ck-warn .ic{width:16px;height:16px;flex:none;margin-top:2px}
.ck-note{display:flex;gap:8px;align-items:center;font-size:13px;color:#5c504a}.ck-note .ic{width:15px;height:15px;color:#c2410c}
.dm-list{display:grid;gap:10px}
.dm{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px;border-radius:16px;border:1.5px solid #e6ddd5;background:#fff;cursor:pointer}
.dm.on{border-color:#ff5a1f;background:#fff8f3}
.dm.off{opacity:.55;cursor:not-allowed}
.dm-t{display:grid;gap:3px;font-size:13.5px;color:#5c504a}.dm-t b{font-size:15px;color:#16100e}
.pm-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pm{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:16px;border:1.5px solid #e6ddd5;background:#fff;text-align:left;transition:all .2s}
.pm .ic{width:22px;height:22px;color:#8a7d75}
.pm span{display:grid;gap:2px}.pm b{font-size:14px}.pm small{font-size:11.5px;color:#8a7d75}
.pm:hover{border-color:#cdbfb5}
.pm.on{border-color:#ff5a1f;background:#fff8f3}.pm.on .ic{color:#ff5a1f}
.pm:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(255,90,31,.3)}
.paypane{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:18px;border-radius:18px;background:#f4eee8}
.paypane .seg{justify-self:start}
.paynote{display:flex;gap:8px;align-items:center;font-size:13px;color:#5c504a}.paynote .ic{width:16px;height:16px;color:#c2410c;flex:none}
.payqr{display:flex;gap:18px;align-items:center}
.payqr p{font-size:13.5px;color:#5c504a;max-width:30ch}
.qr{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;width:132px;height:132px;padding:10px;border-radius:14px;background:#fff;flex:none}

.pay-fail{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:#fdecea;color:#7a1a12}

.pay-fail b{display:block;font-size:14.5px}.pay-fail p{font-size:13px;margin-top:3px;line-height:1.45}
.pay-ov{position:fixed;inset:0;z-index:250;display:grid;place-items:center;background:rgba(8,5,4,.72);backdrop-filter:blur(6px);animation:ddIn .25s}
.pay-box{display:grid;justify-items:center;gap:10px;padding:34px 40px;border-radius:24px;background:#faf6f2;color:#16100e;text-align:center;max-width:360px}

.pay-spin{width:46px;height:46px;border-radius:50%;border:4px solid #f0e6de;border-top-color:#ff5a1f;animation:spin .8s linear infinite}

.ck-mini{display:grid;gap:10px;max-height:300px;overflow:auto;padding-right:4px}
.ck-mini li{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;font-size:13px}
.ck-mini-i{position:relative;width:52px;height:52px;border-radius:12px;background:radial-gradient(80% 80% at 50% 40%,#f7f3ef,#dcd3cc);display:grid;place-items:center}
.ck-mini-i img{width:80%;height:80%;object-fit:contain}
.ck-mini-i em{position:absolute;top:-6px;right:-6px;display:grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--ember);font-style:normal;font-size:11px;font-weight:800;color:#1a0703}
.ck-mini span b{display:block;font-weight:600;line-height:1.3}.ck-mini small{color:var(--ash)}
.ck-edit-cart{justify-self:center;color:var(--ash)!important;font-size:13px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:#ece4dd}
.seg button{height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:#6c605a;transition:all .2s}
.seg button[aria-checked="true"]{background:#16100e;color:#faf6f2}
@media (max-width:720px){.pm-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.ad-grid{grid-template-columns:1fr}.ck-steps li+li::before{width:14px}.ck-steps{font-size:12px}.ck-done{padding-left:24px}.ck-body{padding:0 16px 18px}.ck-sec>header{padding:18px 16px}.payqr{flex-direction:column;align-items:flex-start}}

/* order confirmation */
.ok-hero{display:grid;justify-items:start;gap:12px;margin:24px 0 30px}
.ok-tick{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:var(--grad-ember);color:#1a0703;box-shadow:0 20px 50px -14px rgba(255,90,31,.6);animation:okPop .7s var(--ease) both}
.ok-tick .ic{width:36px;height:36px;stroke-width:2.6;stroke-dasharray:30;stroke-dashoffset:30;animation:okDraw .6s .35s var(--ease) forwards}
@keyframes okPop{from{transform:scale(.4);opacity:0}}
@keyframes okDraw{to{stroke-dashoffset:0}}
.ok-hero h1{font-size:var(--t-d2);line-height:.95;text-transform:uppercase}
.ok-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.ok-card{display:grid;gap:14px;align-content:start;padding:24px;border-radius:24px;background:var(--ink-2);border:1px solid var(--line)}
.ok-card h2{display:flex;gap:10px;align-items:center;font-size:18px}.ok-card h2 .ic{width:20px;height:20px;color:var(--ember-2)}
.ok-track{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:6px}
.ok-track li{position:relative;display:grid;justify-items:center;gap:8px;font-size:12px;color:var(--ash)}
.ok-track li span{width:14px;height:14px;border-radius:50%;background:var(--ink-4);box-shadow:0 0 0 4px var(--ink-2);z-index:1}
.ok-track li::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--ink-4)}
.ok-track li:first-child::before{display:none}
.ok-track li.d{color:var(--bone)}.ok-track li.d span{background:var(--ember)}
.ok-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
@media (max-width:860px){.ok-grid{grid-template-columns:1fr}}
/* hover lift stays inside the image frame on every product card */
.pc:hover .pc-media img,.pc:focus-within .pc-media img{transform:translateY(-5%) scale(1.05) rotate(-3deg)}
.pc-compact:hover .pc-media img,.pc-compact:focus-within .pc-media img{transform:translateY(-4%) scale(1.04)}
/* thumbnails: absolutely centred so tall items (bats, rackets) always fit their frame */
.kr-img,.cl-img,.ck-mini-i,.d-thumb,.svk-imgs img{position:relative}
.kr-img img,.cl-img img,.ck-mini-i img,.d-thumb img{position:absolute;inset:0;margin:auto;width:auto;height:auto;max-width:80%;max-height:80%;object-fit:contain}
.fld{align-content:start}
.kd-info .eyebrow .ic{width:14px;height:14px}

/* ───────── Phase 6: account area, orders, tracking, cancel, returns, addresses, profile, invoice ───────── */
.acc-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:36px;align-items:start;margin-top:18px}
.acc-nav{position:sticky;top:96px;display:grid;gap:14px;padding:18px;border-radius:24px;background:var(--ink-2);border:1px solid var(--line)}
.acc-me{display:flex;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.acc-me b{display:block;font-size:15px}.acc-me small{display:block;font-size:12px;color:var(--ash);overflow:hidden;text-overflow:ellipsis;max-width:160px}
.acc-nav nav{display:grid;gap:2px}
.acc-nav a,.acc-nav button{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font-size:14px;font-weight:550;color:var(--bone-2);text-align:left;transition:background .2s,color .2s}
.acc-nav a:hover,.acc-nav button:hover{background:rgba(255,240,230,.06);color:var(--bone)}
.acc-nav a .ic,.acc-nav button .ic{width:18px;height:18px;color:var(--ash)}
.acc-nav a.on{background:linear-gradient(90deg,rgba(255,90,31,.18),rgba(255,90,31,.04));color:var(--bone)}
.acc-nav a.on .ic{color:var(--ember-2)}
.acc-nav button{margin-top:6px;border-top:1px solid var(--line);border-radius:0 0 12px 12px;padding-top:6px}
.acc-head{margin-bottom:22px}.acc-head h1{font-size:var(--t-d2);line-height:.95;text-transform:uppercase;margin-top:8px}
.acc-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:28px}
.acc-tile{display:grid;gap:4px;padding:18px;border-radius:20px;background:var(--ink-2);border:1px solid var(--line);transition:border-color .25s,transform .35s var(--ease)}
.acc-tile .ic{width:22px;height:22px;color:var(--ember-2);margin-bottom:8px}
.acc-tile b{font-family:var(--f-wide);font-stretch:118%;font-weight:800;font-size:30px;line-height:1}
.acc-tile span{font-size:13px;color:var(--ash)}
.acc-tile:hover{border-color:rgba(255,154,60,.4);transform:translateY(-3px)}
.acc-sec{margin-bottom:32px}
.acc-sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.acc-sh h2{font-family:var(--f-wide);font-stretch:118%;font-weight:800;font-size:18px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.acc-sh h2 .ic{width:18px;height:18px;color:var(--ember-2)}
.acc-sh .pd-link{color:var(--ash);font-size:13px}
.acc-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acc-box{display:grid;gap:6px;padding:20px;border-radius:20px;background:var(--ink-2);border:1px solid var(--line);transition:border-color .25s}
.acc-box>span{display:flex;align-items:center;gap:8px;font:650 10.5px/1 var(--f-label);font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.acc-box>span .ic{width:15px;height:15px;color:var(--ember-2)}
.acc-box b{font-size:16px}.acc-box small{font-size:13px;color:var(--ash);line-height:1.45}
.acc-box em{display:inline-flex;align-items:center;gap:6px;font-style:normal;font-weight:650;font-size:13px;margin-top:6px}.acc-box em .ic{width:14px;height:14px}
.acc-box:hover{border-color:rgba(255,154,60,.4)}
/* order pills + cards */
.opill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:650;white-space:nowrap}
.opill .ic{width:13px;height:13px;stroke-width:2.2}
.opill.ok{background:rgba(95,209,139,.12);color:var(--ok)}
.opill.go{background:rgba(255,154,60,.14);color:var(--sun)}
.opill.r{background:rgba(120,170,255,.12);color:#9ec1ff}
.opill.x{background:rgba(255,93,93,.12);color:var(--err)}
.olist{display:grid;gap:12px}
.ocard{position:relative;display:grid;gap:14px;padding:18px 20px;border-radius:20px;background:var(--ink-2);border:1px solid var(--line);transition:border-color .25s}
.ocard:hover{border-color:var(--line-2)}
.ocard-a{position:absolute;inset:0;border-radius:inherit;z-index:0}
.ocard-a:focus-visible{outline:2px solid var(--ember-2);outline-offset:2px}
.ocard-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ocard-body{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.ocard-body b{font-size:15.5px}.ocard-body small{display:block;font-size:12.5px;color:var(--ash);margin-top:3px}
.ocard-t{font-size:17px!important}
.ocard-acts{position:relative;z-index:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ocard-acts .pd-link{color:var(--ash);font-size:13px;margin-left:6px}
.kt-stack.ot img,.kt-stack.ot i{width:46px;height:46px;border-radius:12px;padding:5px}
.kt-stack.ot>*+*{margin-left:-14px}
.ol-bar{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ol-tabs{flex-wrap:wrap}.ol-tabs .tab{flex:none;padding:0 14px}.ol-tabs .tab span{color:var(--ash-2);font-weight:500;margin-left:2px}
.ol-tabs .tab[aria-selected="true"]{background:var(--bone);color:#16100e}.ol-tabs .tab[aria-selected="true"] span{color:#8a7d75}
.ol-search{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:999px;background:var(--ink-2);border:1px solid var(--line-2);min-width:260px}
.ol-search .ic{width:16px;height:16px;color:var(--ash)}
.ol-search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--bone);font:500 14px var(--f-body)}
.ol-search:focus-within{border-color:var(--ember-2)}
.ol-sample{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ash-2);margin:0 0 16px}.ol-sample .ic{width:14px;height:14px}
/* tracker */
.trk{display:grid;gap:16px}
.trk-c{padding:18px 20px;border-radius:20px;background:linear-gradient(120deg,#2a0b05,#170e0c 60%);border:1px solid rgba(255,154,60,.25)}
.trk-h{display:flex;align-items:center;gap:14px}
.trk-h span{display:grid;gap:2px;flex:1}.trk-h b{font-size:17px}.trk-h small{font-size:12.5px;color:var(--ash)}
.trk-h>.ic{width:18px;height:18px;color:var(--ember-2)}
.trk-steps{position:relative;display:grid;grid-template-columns:repeat(var(--n,5),1fr);counter-reset:s}
.trk-steps.rs{--n:6}
.trk-steps::before,.trk-steps::after{content:"";position:absolute;top:13px;left:calc(50%/var(--n,5));right:calc(50%/var(--n,5));height:3px;border-radius:3px;background:var(--ink-4)}
.trk-steps::after{right:auto;width:calc((100% - 100%/var(--n,5)) * var(--p));background:var(--grad-ember);transition:width .8s var(--ease)}
.trk-steps li{position:relative;z-index:1;display:grid;justify-items:center;gap:6px;text-align:center;padding:0 4px}
.trk-steps li>span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink-3);border:2px solid var(--ink-4);color:#1a0703}
.trk-steps li>span .ic{width:14px;height:14px;stroke-width:2.6}
.trk-steps li.d>span{background:var(--ember);border-color:var(--ember)}
.trk-steps li.c>span{background:var(--sun);border-color:var(--sun);box-shadow:0 0 0 6px rgba(255,194,114,.18);animation:trkPulse 2s ease-in-out infinite}
@keyframes trkPulse{50%{box-shadow:0 0 0 10px rgba(255,194,114,.06)}}
.trk-steps li b{font-size:12.5px;font-weight:650;color:var(--ash)}
.trk-steps li.d b,.trk-steps li.c b{color:var(--bone)}
.trk-steps li small{font-size:11px;color:var(--ash-2);line-height:1.3}
.trk-x{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;background:rgba(255,93,93,.07);border:1px solid rgba(255,93,93,.2)}
.trk-x>.ic{width:20px;height:20px;color:var(--err);flex:none;margin-top:2px}
.trk-x b{display:block}.trk-x small{color:var(--ash);font-size:13px}
/* order detail */
.od-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.od-acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.od-card{padding:22px;border-radius:22px;background:var(--ink-2);border:1px solid var(--line);margin-bottom:14px;display:grid;gap:14px}
.od-card>h2{font-size:16px;display:flex;align-items:center;gap:8px}.od-card>h2 .ic{width:17px;height:17px;color:var(--ember-2)}
.od-card p{font-size:14px;color:var(--bone-2);line-height:1.55}
.od-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.od-two .od-card{margin:0}
.demo-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px dashed rgba(255,194,114,.45);font-size:12px;font-weight:650;color:var(--sun)}
.demo-btn .ic{width:13px;height:13px}.demo-btn:hover{background:rgba(255,194,114,.08)}
.od-log summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-size:13.5px;font-weight:600;color:var(--bone-2)}
.od-log summary::-webkit-details-marker{display:none}
.od-log summary .ic{width:14px;height:14px;transition:transform .3s}.od-log[open] summary .ic{transform:rotate(180deg)}
.od-log ol{display:grid;margin-top:12px;border-left:2px solid var(--ink-4);padding-left:16px}
.od-log li{position:relative;display:grid;grid-template-columns:150px 1fr auto;gap:12px;padding:8px 0;font-size:13px}
.od-log li::before{content:"";position:absolute;left:-22px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--ember)}
.od-log li span{color:var(--ash)}.od-log time{color:var(--ash-2);font-size:12px}
.ou-list{display:grid}
.ou{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ou:last-child{border-bottom:0}
.ou .kr-img{width:64px;height:64px;border-radius:12px}
.ou small{display:block;font-size:12.5px;color:var(--ash);margin-top:2px}
.ou-st{display:inline-flex;margin-top:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:650;background:rgba(120,170,255,.12);color:#9ec1ff}
.ou-st.cancelled{background:rgba(255,93,93,.12);color:var(--err)}.ou-st.done{background:rgba(95,209,139,.12);color:var(--ok)}
.ou-win{color:var(--sun)!important}.ou-win.closed{color:var(--ash-2)!important}
.og-kit{border-radius:16px;background:rgba(255,240,230,.03);border:1px solid var(--line);padding:4px 14px;margin:6px 0}
.og-kh{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.og-kh small{display:block;font-size:12.5px;color:var(--ash)}
.og-bag{width:56px!important;height:56px!important;background:radial-gradient(80% 80% at 50% 35%,#ffb257,#ff5a1f 45%,#7c1a06)!important}
.og-kit ul{padding-left:8px}
.od-refund p{margin:0}
.rf{display:grid;gap:4px;padding:14px;border-radius:14px;background:rgba(95,209,139,.06);border:1px solid rgba(95,209,139,.2)}
.rf-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rf-row>span{display:flex;align-items:center;gap:8px}.rf-row .ic{width:16px;height:16px;color:var(--ok)}
.rf small{font-size:12.5px;color:var(--ash)}
.ret-items{display:grid;gap:8px}
.ret-items li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;font-size:13.5px}
.ret-items img{width:44px;height:44px;border-radius:10px;object-fit:contain;padding:4px;background:#efe8e2}
.ret-items small{display:block;color:var(--ash);font-size:12px}.ret-items em{font-style:normal;color:var(--sun)}
.ret-meta{display:flex;align-items:center;gap:8px;font-size:13px!important;color:var(--bone-2)}.ret-meta .ic{width:15px;height:15px;color:var(--ember-2)}
.od-help{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ash)}.od-help .ic{width:15px;height:15px}
/* cancel sheet */
.cx{gap:14px}
.cx-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cx-head .mono{color:#c2410c;font:650 10.5px/1 var(--f-label);font-stretch:112%;letter-spacing:.14em;text-transform:uppercase}
.cx-head h2{font-size:22px;margin-top:6px}.cx-head .icon-btn{color:#16100e}
.cx-list{display:grid;gap:8px;max-height:260px;overflow:auto}
.cx-list .ck-line{align-items:center;padding:8px 10px;border-radius:12px;border:1.5px solid #e6ddd5;background:#fff}
.cx-list img{width:40px;height:40px;object-fit:contain;border-radius:8px;background:#f4eee8;padding:3px}
.cx-list small{display:block;color:#8a7d75;font-size:12px}
.cx .fld .dd{width:100%}.cx .dd-b{height:50px;border-radius:14px;background:#fff;border:1.5px solid #ddd2c9;color:#16100e}
.cx .dd-v.ph{color:#b3a79f}
.cx-ref{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#5c504a;line-height:1.45}.cx-ref:empty{display:none}.cx-ref .ic{width:16px;height:16px;flex:none;color:#c2410c;margin-top:1px}
.cx-ref b{color:#16100e}
.sheet-panel .sheet-err{font-size:12.5px;font-weight:600;color:#b42318}
.sheet-panel .sheet-foot{display:flex;justify-content:flex-end;gap:10px}
/* return flow */
.rf-steps{margin-bottom:16px}
.rf-card{padding:clamp(20px,2.4vw,30px);border-radius:24px;background:#faf6f2;color:#16100e;display:grid;gap:16px;margin-bottom:14px;box-shadow:0 30px 70px -30px rgba(0,0,0,.8)}
.rf-card h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.rf-card .muted{color:#7a6e67}
.rf-card .pd-link{color:#16100e}
.rf-items{display:grid;gap:10px}
.rf-items li{display:grid;grid-template-columns:auto 72px minmax(0,1fr);gap:14px;align-items:start;padding:14px;border-radius:16px;border:1.5px solid #e6ddd5;background:#fff;transition:border-color .2s}
.rf-items li.on{border-color:#ff5a1f;background:#fff8f3}
.rf-items li .ck-line{margin-top:24px}
.rf-items li:not(:has(.ck-line)){grid-template-columns:72px minmax(0,1fr)}
.rf-items .kr-img{width:72px;height:72px;border-radius:12px;background:radial-gradient(80% 80% at 50% 40%,#fff,#e6ddd5)}
.rf-items b{font-size:15px}.rf-items small{display:block;font-size:12.5px;color:#7a6e67;margin-top:3px}
.rf-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.rf-row .fld{flex:1;min-width:220px}.rf-row .dd{width:100%}
.rf-card .dd-b{height:46px;border-radius:12px;background:#fff;border:1.5px solid #ddd2c9;color:#16100e}
.rf-card .dd-v.ph{color:#b3a79f}.rf-card .dd.on .dd-b{border-color:#ff5a1f;background:#fff}

.aa-0{left:16%;top:6%;height:88%;width:auto;max-width:50%;transform:rotate(-16deg)}

.art-grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;align-items:start}

/* help */

/* ───────── Iteration 8: one dark box system, dropdown portal, sheet fixes, hero, gallery poster ───────── */
:root{--box:#161110;--box-2:#1d1715;--box-3:#241c1a;--box-line:rgba(255,236,224,.10);--box-line-2:rgba(255,236,224,.18)}

/* kit question card keeps its light face, in a softer grey */

.dm>.ic,.rf-box>.ic,.rf-next .ic,.ct-list .ic,.trk-hint>.ic{color:var(--ember-2)}
.paypane,.rf-cond,.au-demo-code{background:var(--box-2);border:1px solid var(--box-line)}
.paynote{color:var(--ash)}.paynote .ic{color:var(--ember-2)}
.qr{background:#f4ede7}
.ck-warn{background:rgba(255,181,71,.08);color:var(--warn);border:1px solid rgba(255,181,71,.25)}
.ck-note{color:var(--ash)}
.ck-place{border-top-color:var(--box-line)}
.rf-foot,.ck-cat{border-color:var(--box-line)}
.pay-fail{background:rgba(255,93,93,.08);color:#ff9c94;border:1px solid rgba(255,93,93,.25)}
.pay-box{background:#1a1311;color:var(--bone);border:1px solid var(--box-line-2)}.pay-box p{color:var(--ash)}.pay-spin{border-color:#2c2321;border-top-color:var(--ember)}
.seg{background:var(--box-3)}.seg button{color:var(--ash)}.seg button[aria-checked="true"]{background:var(--bone);color:#16100e}
.rf-card .btn-glass{background:rgba(255,240,230,.06);color:var(--bone);border-color:var(--box-line-2)}
.rf-card .btn-glass:hover{background:rgba(255,240,230,.12)}
.rf-card .qty{background:var(--ink-2)}

.trkpg .rf-card .trk-steps::before{background:var(--ink-4)}.trkpg .rf-card .trk-steps li>span{background:var(--ink-3);border-color:var(--ink-4)}
.rf-card .opill.go{background:rgba(255,154,60,.14);color:var(--sun)}.rf-card .opill.ok{background:rgba(95,209,139,.12);color:var(--ok)}.rf-card .opill.x{background:rgba(255,93,93,.12);color:var(--err)}.rf-card .opill.r{background:rgba(120,170,255,.12);color:#9ec1ff}

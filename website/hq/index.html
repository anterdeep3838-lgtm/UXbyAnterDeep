<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Site insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Geist:wght@400;500;600&display=swap">
<style>
:root{--paper:#F6F6F9;--card:#fff;--ink:#15161C;--ink-2:#4A4D5A;--ink-3:#868A99;--line:rgba(21,22,28,.09);--blue:#2F6BFF;--blue-2:#5B49FF;--green:#1DB86A;--red:#E5484D;--sun:#FFD25E;--rose:#FF8FC4;--sky:#5EC4FF;
  --head:"Plus Jakarta Sans","Geist",system-ui,sans-serif;--body:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14.5px/1.5 var(--body);min-height:100vh;
  background-image:radial-gradient(60% 40% at 15% -5%,rgba(255,210,94,.22),transparent 70%),radial-gradient(50% 40% at 95% 0%,rgba(94,196,255,.2),transparent 70%)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
h1,h2,h3{font-family:var(--head);letter-spacing:-.02em;margin:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:26px;font-weight:800}
.top small{color:var(--ink-3);display:block;font:500 12.5px var(--body);letter-spacing:0}
.sp{flex:1}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;color:var(--ink-2);font-weight:500}
.seg button.on{background:var(--ink);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:500;color:var(--ink)}
.btn:hover{background:#fafafa}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(29,184,106,.18)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 12px 30px -22px rgba(21,22,28,.25)}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.card h3 small{font:500 12px var(--body);color:var(--ink-3);letter-spacing:0}
.kpi .l{color:var(--ink-3);font-size:12.5px;font-weight:500}
.kpi .n{font:800 30px/1.1 var(--head);letter-spacing:-.03em;margin:6px 0 4px}
.kpi .d{font-size:12.5px;color:var(--ink-3)}
.up,.kpi .d.up{color:var(--green)}.down,.kpi .d.down{color:var(--red)}
.two{grid-template-columns:1.6fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.half{grid-template-columns:1fr 1fr}
@media(max-width:900px){.two,.three,.half{grid-template-columns:1fr}.top h1{font-size:22px}}
.list{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:#EEF0F5;border-radius:99px;overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue-2))}
.row .v{color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.empty{color:var(--ink-3);font-size:13px;padding:6px 0}
.fun .row{grid-template-columns:minmax(120px,34%) 1fr auto}
.fun .bar{height:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink-3);font-weight:500;font-size:12px;padding:0 10px 8px 0;white-space:nowrap}
td{padding:9px 10px 9px 0;border-top:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
.scroll{overflow-x:auto}
.tag{display:inline-block;background:#F0F2F8;border-radius:99px;padding:2px 9px;font-size:12px;color:var(--ink-2);margin:0 4px 4px 0;white-space:nowrap}
.tag.hot{background:#E7F8EF;color:#0E7A44}
.tag.new{background:#EAF0FF;color:#1E4FD8}
.cc{display:inline-block;min-width:26px;text-align:center;font:700 10.5px var(--head);background:#F0F2F8;border-radius:6px;padding:2px 5px;margin-right:6px;color:var(--ink-2)}
#chart{width:100%;height:230px;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:7px 10px;border-radius:10px;transform:translate(-50%,-110%);white-space:nowrap;opacity:0;transition:opacity .12s}
.chartbox{position:relative}
.hours{display:flex;align-items:flex-end;gap:3px;height:92px}
.hours i{flex:1;background:linear-gradient(180deg,var(--blue),var(--blue-2));border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.hl{display:flex;justify-content:space-between;color:var(--ink-3);font-size:11.5px;margin-top:6px}
.legend{display:flex;gap:14px;color:var(--ink-3);font-size:12px;margin-left:auto;font-weight:500}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* sign-in + setup */
.gate{max-width:380px;margin:14vh auto 0;text-align:center}
.gate h1{font-size:26px;font-weight:800;margin-bottom:6px}
.gate p{color:var(--ink-2);margin:0 0 20px}
.gate form{display:flex;gap:8px}
.gate input{flex:1;font:inherit;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;outline:none}
.gate input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
.gate .go{background:var(--ink);color:#fff;border:0;border-radius:14px;padding:0 20px;font-weight:600}
.err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}
.setup{max-width:560px;margin:10vh auto 0;text-align:left}
.setup ol{padding-left:20px;color:var(--ink-2)}.setup li{margin:8px 0}
.setup code{background:#EEF0F5;border-radius:6px;padding:1px 6px;font-size:13px}
.hide{display:none!important}
.foot{margin-top:26px;color:var(--ink-3);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const TZ = -new Date().getTimezoneOffset();
let days = +localStorage.getItem('hq_days') || 7, timer = null;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (n || 0).toLocaleString('en-IN');
const dur = ms => { if (!ms) return '0s'; const s = Math.round(ms / 1000); if (s < 60) return s + 's'; const m = Math.floor(s / 60); if (m < 60) return m + 'm ' + String(s % 60).padStart(2, '0') + 's'; return Math.floor(m / 60) + 'h ' + (m % 60) + 'm'; };
const ago = t => { const s = Math.max(0, (Date.now() - t) / 1000); if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ', ' + new Date(t).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }); };
let names; try { names = new Intl.DisplayNames(['en'], { type: 'region' }); } catch (e) {}
const country = c => { try { return (names && c && names.of(c)) || c || 'Unknown'; } catch (e) { return c || 'Unknown'; } };
const pct = n => Math.round((n || 0) * 100) + '%';

async function api(path, opt) {
  const r = await fetch(path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opt));
  let j = {}; try { j = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, j };
}

/* ---------- screens ---------- */
function gate(configured, storage) {
  clearInterval(timer);
  if (!configured) {
    app.innerHTML = `<div class="setup card"><h1 style="font-size:22px;font-weight:800;margin-bottom:10px">Almost there</h1>
      <p style="color:var(--ink-2);margin:0 0 6px">This page needs two settings in your Vercel project before it can show anything:</p>
      <ol><li>Add a free <b>Upstash Redis</b> database (Vercel &rarr; Storage &rarr; Create Database) and connect it to this project.</li>
      <li>Add an environment variable <code>ADMIN_PASSWORD</code> with the password you want to use here.</li></ol>
      <p style="color:var(--ink-3);margin:0;font-size:13px">Then redeploy once. This message is shown only until that is done.</p></div>`;
    return;
  }
  app.innerHTML = `<div class="gate"><h1>Site insights</h1><p>Private. Enter your password to continue.</p>
    <form id="f"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus><button class="go" type="submit">Open</button></form>
    <div class="err" id="err"></div></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); const err = $('#err'); err.textContent = '';
    const b = $('.go'); b.disabled = true;
    const r = await api('/api/hq-login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) });
    b.disabled = false;
    if (r.ok) { try { localStorage.setItem('ubad_me', '1'); } catch (x) {} start(); }
    else err.textContent = r.status === 429 ? 'Too many attempts. Try again in a few minutes.' : 'That password is not right.';
  };
}

function skeleton() {
  app.innerHTML = `<div class="wrap">
    <div class="top"><div><h1>Site insights</h1><small id="sub">Loading…</small></div><div class="sp"></div>
      <span class="chip hide" id="live"><i></i><span id="livet"></span></span>
      <div class="seg" id="seg">${[[1, 'Today'], [7, '7 days'], [30, '30 days'], [90, '90 days']].map(([d, l]) => `<button data-d="${d}" class="${d === days ? 'on' : ''}">${l}</button>`).join('')}</div>
      <button class="btn" id="rf">Refresh</button><button class="btn" id="out">Sign out</button></div>
    <div id="body"></div>
    <div class="foot"><span id="me"></span></div></div>`;
  $('#seg').onclick = e => { const b = e.target.closest('button'); if (!b) return; days = +b.dataset.d; localStorage.setItem('hq_days', days); [...$('#seg').children].forEach(x => x.classList.toggle('on', x === b)); load(); };
  $('#rf').onclick = load;
  $('#out').onclick = async () => { await api('/api/hq-login', { method: 'DELETE' }); init(); };
  paintMe();
}
function paintMe() {
  const on = localStorage.getItem('ubad_me') === '1';
  $('#me').innerHTML = on ? 'Your visits from this browser are not counted. <a href="#" id="tg" style="color:var(--blue)">Count them</a>' : 'Visits from this browser are being counted. <a href="#" id="tg" style="color:var(--blue)">Stop counting them</a>';
  $('#tg').onclick = e => { e.preventDefault(); if (on) { localStorage.removeItem('ubad_me'); localStorage.setItem('ubad_count', '1'); } else { localStorage.setItem('ubad_me', '1'); localStorage.removeItem('ubad_count'); } paintMe(); };
}

/* ---------- render ---------- */
function delta(cur, prev, invert) {
  if (prev == null) return '';
  if (!prev && !cur) return '<span class="d">no change</span>';
  if (!prev) return '<span class="d up">new</span>';
  const ch = (cur - prev) / prev; if (Math.abs(ch) < .005) return '<span class="d">same as before</span>';
  const good = invert ? ch < 0 : ch > 0;
  return `<span class="d ${good ? 'up' : 'down'}">${ch > 0 ? '▲' : '▼'} ${Math.abs(Math.round(ch * 100))}% vs previous ${days === 1 ? 'day' : days + ' days'}</span>`;
}
function bars(items, fmtName, valFmt) {
  if (!items || !items.length) return '<div class="empty">Nothing yet.</div>';
  const max = Math.max(...items.map(i => i.v)) || 1;
  return `<div class="list">${items.map(i => `<div class="row"><span class="nm" title="${esc(fmtName ? fmtName(i) : i.k)}">${fmtName ? fmtName(i) : esc(i.k)}</span><div class="bar"><b style="width:${Math.max(3, i.v / max * 100)}%"></b></div><span class="v">${valFmt ? valFmt(i) : fmt(i.v)}</span></div>`).join('')}</div>`;
}
function share(items, total) { return items.map(i => ({ ...i, p: total ? i.v / total : 0 })); }

function chart(series) {
  const W = 760, H = 230, pl = 34, pb = 26, pt = 12, pr = 8;
  const max = Math.max(4, ...series.map(s => Math.max(s.visitors, s.sessions)));
  const nice = Math.ceil(max / 4) * 4;
  const bw = (W - pl - pr) / series.length;
  const y = v => pt + (H - pt - pb) * (1 - v / nice);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = nice / 4 * i; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(21,22,28,.07)"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#868A99">${Math.round(v)}</text>`; }
  const every = Math.ceil(series.length / 8);
  const bars = series.map((s, i) => {
    const x = pl + i * bw + bw * .18, w = bw * .64;
    const lab = i % every === 0 ? `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#868A99">${new Date(s.day + TZ * 60000).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' })}</text>` : '';
    return `<g class="b" data-i="${i}"><rect x="${pl + i * bw}" y="0" width="${bw}" height="${H - pb}" fill="transparent"/>
      <rect x="${x}" y="${y(s.sessions)}" width="${w}" height="${Math.max(0, H - pb - y(s.sessions))}" rx="4" fill="#D9E4FF"/>
      <rect x="${x + w * .22}" y="${y(s.visitors)}" width="${w * .56}" height="${Math.max(0, H - pb - y(s.visitors))}" rx="3" fill="url(#gr)"/>${lab}</g>`;
  }).join('');
  return `<svg id="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#5B49FF"/></linearGradient></defs>${g}${bars}</svg>`;
}

function render(d) {
  const k = d.kpis, p = d.prev, hasData = k.sessions > 0;
  const kp = (l, n, dl, extra) => `<div class="card kpi"><div class="l">${l}</div><div class="n">${n}</div>${dl || ''}${extra || ''}</div>`;
  const live = $('#live'); live.classList.toggle('hide', !(d.live && d.live.count));
  if (d.live && d.live.count) $('#livet').textContent = d.live.count + (d.live.count === 1 ? ' person' : ' people') + ' on the site now';
  $('#sub').textContent = new Date(d.from + TZ * 60000).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' }) + ' – today · updated ' + new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });

  const devTotal = d.devices.reduce((a, b) => a + b.v, 0), brwTotal = d.browsers.reduce((a, b) => a + b.v, 0), osTotal = d.os.reduce((a, b) => a + b.v, 0), srcTotal = d.sources.reduce((a, b) => a + b.v, 0), cTotal = d.countries.reduce((a, b) => a + b.v, 0);
  const sharePct = (tot) => i => Math.round(i.v / (tot || 1) * 100) + '%';
  const maxH = Math.max(1, ...d.hours);

  $('#body').innerHTML = `
  <div class="grid kpis">
    ${kp('Visitors', fmt(k.visitors), delta(k.visitors, p && p.visitors), `<div class="d">${fmt(k.newVisitors)} new · ${fmt(k.returning)} returning</div>`)}
    ${kp('Visits', fmt(k.sessions), delta(k.sessions, p && p.sessions))}
    ${kp('Page views', fmt(k.pageviews), delta(k.pageviews, p && p.pageviews), `<div class="d">${k.sessions ? (k.pageviews / k.sessions).toFixed(1) : '0'} per visit</div>`)}
    ${kp('Time per visit', dur(k.avgTime), delta(k.avgTime, p && p.avgTime), `<div class="d">typical visit ${dur(k.medTime)}</div>`)}
    ${kp('Engaged visits', pct(k.engagedRate), delta(k.engagedRate, p && p.engagedRate), `<div class="d">stayed 15s+, viewed 2+ pages, or took an action</div>`)}
    ${kp('Reached out', fmt(k.contactClicks), delta(k.contactClicks, p && p.contactClicks), `<div class="d">clicked Email / LinkedIn / copied email</div>`)}
  </div>
  ${hasData ? '' : '<div class="card" style="margin-bottom:14px"><b>No visits recorded in this period yet.</b><div class="empty">Numbers appear after the first real visitor. Visits from your own browser are not counted.</div></div>'}
  <div class="grid two" style="margin-bottom:14px">
    <div class="card"><h3>Visitors over time <span class="legend"><span><i style="background:#2F6BFF"></i>Visitors</span><span><i style="background:#D9E4FF"></i>Visits</span></span></h3>
      <div class="chartbox" id="cb">${chart(d.series)}<div class="tip" id="tip"></div></div></div>
    <div class="card fun"><h3>Journey <small>how far visitors got</small></h3>${bars(d.funnel.map(f => ({ k: f.k, v: f.v })), null, i => `${fmt(i.v)} <span style="color:var(--ink-3)">${k.sessions ? Math.round(i.v / k.sessions * 100) : 0}%</span>`)}</div>
  </div>
  <div class="grid three" style="margin-bottom:14px">
    <div class="card"><h3>Where they came from</h3>${bars(share(d.sources), null, sharePct(srcTotal))}
      ${d.campaigns.length ? `<h3 style="margin:16px 0 10px">Tagged links <small>?for= or ?utm_campaign=</small></h3>${bars(d.campaigns)}` : ''}</div>
    <div class="card"><h3>Countries</h3>${bars(share(d.countries), i => esc(country(i.k)), sharePct(cTotal))}</div>
    <div class="card"><h3>Cities</h3>${bars(d.cities, i => `<span class="cc">${esc(i.cc || '')}</span>${esc(i.k)}`)}</div>
  </div>
  <div class="card" style="margin-bottom:14px"><h3>Reached out <small>clicks on your contact buttons</small></h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:${d.contacts.length ? 16 : 0}px">
      ${[['linkedin', 'LinkedIn'], ['email', 'Email'], ['copy', 'Copied email'], ['cta', 'Get in touch']].map(([key, lb]) => `<div style="background:#F6F7FB;border-radius:14px;padding:12px 14px"><div class="l" style="color:var(--ink-3);font-size:12.5px">${lb}</div><div style="font:800 24px var(--head);letter-spacing:-.02em;margin:2px 0">${fmt(d.reach[key].visits)}</div><div style="color:var(--ink-3);font-size:12px">${d.reach[key].visits === 1 ? 'visit' : 'visits'}${d.reach[key].clicks > d.reach[key].visits ? ' · ' + d.reach[key].clicks + ' clicks' : ''}</div></div>`).join('')}
    </div>
    ${d.contacts.length ? `<div class="scroll"><table><tr><th>When</th><th>Who</th><th>From</th><th>Clicked</th></tr>${d.contacts.map(r => `<tr>
      <td style="white-space:nowrap">${esc(ago(r.t))}</td>
      <td><span class="cc">${esc(r.c || '–')}</span>${esc(r.ci ? r.ci + ', ' : '')}${esc(country(r.c))}<div style="color:var(--ink-3);font-size:12px">${esc(cap(r.d))} · ${esc(r.b)} · ${esc(r.o)}</div></td>
      <td>${esc(r.src)}${r.camp ? `<div><span class="tag new">${esc(r.camp)}</span></div>` : ''}</td>
      <td>${r.what.map(x => `<span class="tag hot">${esc(x)}</span>`).join('') || '<span class="tag">Copied email</span>'}</td></tr>`).join('')}</table></div>
    <div class="empty" style="margin-top:8px">Names are not recorded, because the site never asks who a visitor is. To see who a visit is, send people a tagged link such as <code style="background:#EEF0F5;border-radius:6px;padding:1px 6px">yoursite.vercel.app/?for=priya-acme</code>: that label appears next to their visit.</div>` : '<div class="empty">Nobody has clicked Email or LinkedIn in this period yet.</div>'}
  </div>
  <div class="grid two" style="margin-bottom:14px">
    <div class="card"><h3>Projects <small>what recruiters look at</small></h3>
      <div class="scroll"><table><tr><th>Project</th><th class="num">Hovered</th><th class="num">Opened</th><th class="num">Prototype</th><th class="num">Avg. read</th></tr>
      ${d.projects.map(r => `<tr><td><b>${esc(r.name)}</b></td><td class="num">${fmt(r.hovered)}</td><td class="num">${fmt(r.opened)}</td><td class="num">${fmt(r.proto)}</td><td class="num">${r.avgRead ? dur(r.avgRead) : '–'}</td></tr>`).join('')}</table></div>
      <div class="empty" style="margin-top:8px">Counts are visits, not clicks. “Hovered” means lingered on a card for about a second.</div></div>
    <div class="card"><h3>Actions <small>visits that did it</small></h3>${bars(d.actions.map(a => ({ k: actionName(a.k), v: a.v })))}
      ${d.sections.length ? `<h3 style="margin:16px 0 10px">Sections reached</h3>${bars(d.sections.map(a => ({ k: a.k[0].toUpperCase() + a.k.slice(1), v: a.v })))}` : ''}</div>
  </div>
  <div class="card" style="margin-bottom:14px"><h3>Pages</h3><div class="scroll"><table>
    <tr><th>Page</th><th class="num">Views</th><th class="num">Visitors</th><th class="num">Avg. time</th><th class="num">Avg. scroll</th></tr>
    ${d.pages.length ? d.pages.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${fmt(r.views)}</td><td class="num">${fmt(r.visitors)}</td><td class="num">${r.avgTime ? dur(r.avgTime) : '–'}</td><td class="num">${r.avgScroll ? r.avgScroll + '%' : '–'}</td></tr>`).join('') : '<tr><td colspan="5" class="empty">Nothing yet.</td></tr>'}</table></div></div>
  <div class="grid three" style="margin-bottom:14px">
    <div class="card"><h3>Device</h3>${bars(share(d.devices), i => esc(cap(i.k)), sharePct(devTotal))}</div>
    <div class="card"><h3>Browser</h3>${bars(share(d.browsers), null, sharePct(brwTotal))}</div>
    <div class="card"><h3>Operating system</h3>${bars(share(d.os), null, sharePct(osTotal))}</div>
  </div>
  <div class="card" style="margin-bottom:14px"><h3>Busiest hours <small>your local time</small></h3>
    <div class="hours">${d.hours.map((h, i) => `<i title="${i}:00 – ${h} visit${h === 1 ? '' : 's'}" style="height:${Math.max(3, h / maxH * 100)}%"></i>`).join('')}</div>
    <div class="hl"><span>12 am</span><span>6 am</span><span>12 pm</span><span>6 pm</span><span>11 pm</span></div></div>
  <div class="card"><h3>Recent visits <small>newest first</small></h3><div class="scroll"><table>
    <tr><th>When</th><th>Who</th><th>From</th><th>Journey</th><th class="num">Time</th></tr>
    ${d.recent.length ? d.recent.map(r => `<tr>
      <td style="white-space:nowrap">${esc(ago(r.last))}</td>
      <td><span class="cc">${esc(r.c || '–')}</span>${esc(r.ci ? r.ci + ', ' : '')}${esc(country(r.c))}<div style="color:var(--ink-3);font-size:12px">${esc(cap(r.d))} · ${esc(r.b)} · ${esc(r.o)}</div></td>
      <td>${esc(r.src)}${r.camp ? `<div style="color:var(--ink-3);font-size:12px">${esc(r.camp)}</div>` : ''}${r.nv ? '<span class="tag new">new visitor</span>' : ''}</td>
      <td>${r.pages.map(x => `<span class="tag">${esc(x)}</span>`).join('')}${r.did.map(x => `<span class="tag hot">${esc(x)}</span>`).join('')}</td>
      <td class="num" style="white-space:nowrap">${r.tm == null ? '–' : dur(r.tm)}${r.sc ? `<div style="color:var(--ink-3);font-size:12px">${r.sc}% scrolled</div>` : ''}</td></tr>`).join('') : '<tr><td colspan="5" class="empty">No visits yet.</td></tr>'}</table></div></div>`;

  /* chart tooltip */
  const cb = $('#cb'), tip = $('#tip');
  cb.addEventListener('pointermove', e => {
    const g = e.target.closest('.b'); if (!g) { tip.style.opacity = 0; return; }
    const s = d.series[+g.dataset.i], r = cb.getBoundingClientRect(), br = g.getBoundingClientRect();
    tip.innerHTML = `<b>${new Date(s.day + TZ * 60000).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' })}</b><br>${s.visitors} visitor${s.visitors === 1 ? '' : 's'} · ${s.sessions} visit${s.sessions === 1 ? '' : 's'} · ${s.pageviews} pages`;
    tip.style.left = (br.left + br.width / 2 - r.left) + 'px'; tip.style.top = '14px'; tip.style.opacity = 1;
  });
  cb.addEventListener('pointerleave', () => tip.style.opacity = 0);
}
const cap = s => (s || '').charAt(0).toUpperCase() + (s || '').slice(1);
function actionName(n) {
  const m = { 'contact:email': 'Clicked Email', 'contact:linkedin': 'Clicked LinkedIn', 'contact:copy-email': 'Copied email address', 'cta:get-in-touch': 'Pressed “Get in touch”' };
  if (m[n]) return m[n];
  let x;
  if ((x = n.match(/^prototype:open:(.+)/))) return 'Opened ' + cap(x[1]) + ' prototype';
  if ((x = n.match(/^nav:(.+)/))) return 'Used nav: ' + cap(x[1]);
  if ((x = n.match(/^outbound:(.+)/))) return 'Left for ' + x[1];
  return n;
}

async function load() {
  const r = await api(`/api/hq-data?days=${days}&tz=${TZ}`);
  if (r.status === 401) return init();
  if (!r.ok) { $('#body').innerHTML = '<div class="card"><b>Could not load stats.</b><div class="empty">Check that the Upstash database is connected to this project, then refresh.</div></div>'; return; }
  render(r.j);
}
function start() { try { if (localStorage.getItem('ubad_count') !== '1') localStorage.setItem('ubad_me', '1'); } catch (e) {} skeleton(); load(); clearInterval(timer); timer = setInterval(() => { if (document.visibilityState === 'visible') load(); }, 60000); }
async function init() {
  const r = await api('/api/hq-login');
  if (r.j && r.j.authed) return start();
  gate(!!(r.j && r.j.configured), !!(r.j && r.j.storage));
}
init();
})();
</script>
</body>
</html>

<script>
(() => {

  placeBefore('s12', 's4');
  placeBefore('s6', 's9');
  placeBefore('s29', 's4');
  const fit = () => deck.style.setProperty('--k', Math.min(1, document.documentElement.clientWidth / 1640));
  fit(); addEventListener('resize', fit);

  const TOTAL = 31;
  [...deck.querySelectorAll(':scope > section')].forEach((section, index) => { const t = section.querySelector('.tb[data-pg]'); if (!t) return; const n = index + 1;
    t.dataset.pg = n;
    t.querySelector('.pg').textContent = String(n).padStart(2, '0') + ' / ' + TOTAL;
    t.querySelector('.sp i').style.setProperty('--p', n / TOTAL); });

  // research: true circular arc of radial ticks (85% lit) with a dotted inner arc
  const arc = document.getElementById('arc');
  if (arc) { const W = arc.parentElement.clientWidth || 560; arc.setAttribute('viewBox', `0 0 ${W} 190`);
    const cx = W / 2, R = W * .78, cy = 70 + R, half = Math.asin(Math.min(.98, (W / 2 + 20) / R)), N = 78, lit = Math.round(N * .85); let s = '';
    for (let i = 0; i < N; i++) { const a = -half + (2 * half) * i / (N - 1), sn = Math.sin(a), cs = Math.cos(a), on = i < lit;
      const x1 = cx + sn * R, y1 = cy - cs * R, x2 = cx + sn * (R + 46), y2 = cy - cs * (R + 46);
      s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${on ? '#4D84FF' : 'rgba(255,255,255,.18)'}" style="opacity:0;transition:opacity .4s ${i * 16}ms"/>`;
      if (i % 2 === 0) s += `<circle cx="${(cx + sn * (R - 20)).toFixed(1)}" cy="${(cy - cs * (R - 20)).toFixed(1)}" r="1.7" fill="${on ? 'rgba(156,188,255,.75)' : 'rgba(255,255,255,.16)'}"/>`; }
    arc.innerHTML = s; }
  // research: equaliser bars
  const eq = document.getElementById('eq');
  if (eq) { let s = ''; for (let i = 0; i < 22; i++) { const h = 35 + Math.abs(Math.sin(i * 1.7)) * 60, h2 = 30 + Math.abs(Math.cos(i * 1.3)) * 68;
    s += `<i style="--h:${h.toFixed(0)};--h2:${h2.toFixed(0)};--dl:${(-i * .21).toFixed(2)}s"></i>`; } eq.innerHTML = s; }
  // research: 45-app dot grid, category budgets lit on a minority
  const dots = document.getElementById('dots');
  if (dots) { const lit = [2, 7, 11, 16, 23, 29, 34, 38, 42, 13, 20, 26]; let s = ''; for (let i = 0; i < 45; i++) s += '<i></i>'; dots.innerHTML = s;
    const ds = [...dots.children]; lit.forEach(k => ds[k].classList.add('on')); }

  // count-up
  const count = el => { const end = +el.dataset.count; if (reduce) { el.textContent = end.toLocaleString('en-IN'); return; }
    const t0 = performance.now(), D = 1400; const tick = t => { const p = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(end * e).toLocaleString('en-IN'); if (p < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); };

  // 4Ws + H: cycle the highlighted row, pause on hover
  const w5 = document.getElementById('w5');
  if (w5) { const rows = [...w5.children]; let i = 0, tm, hold = false;

    rows.forEach((r, k) => { r.addEventListener('mouseenter', () => { hold = true; set(k); }); r.addEventListener('mouseleave', () => hold = false); });
    if (!reduce) tm = setInterval(() => { if (!hold) set((i + 1) % rows.length); }, 2800); }

  // reveal
  const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; const el = e.target; el.classList.add('in'); io.unobserve(el);
    el.querySelectorAll?.('[data-count]').forEach(count);
    if (el.classList.contains('t-arc')) el.querySelectorAll('#arc line').forEach(l => l.style.opacity = 1);
     }), {threshold: .18});
  document.querySelectorAll('.r,.pop,.tb,.sc-arcs,.sc2-c,.dp-st').forEach(el => io.observe(el));

  // before/after slider — drag the white line (pointer or arrow keys)
  const cmp = document.getElementById('cmp');
  if (cmp) { const ph = cmp.querySelector('.ev-ph'), hd = cmp.querySelector('.ev-h'); let auto = !reduce, drag = false, v = 50, t0 = performance.now();
    const set = x => { v = Math.max(0, Math.min(100, x)); ph.style.setProperty('--cx', v + '%'); hd.setAttribute('aria-valuenow', Math.round(v)); };
    const at = e => { const r = ph.getBoundingClientRect(); return (e.clientX - r.left) / r.width * 100; };
    hd.addEventListener('pointerdown', e => { auto = false; drag = true; hd.setPointerCapture(e.pointerId); set(at(e)); e.preventDefault(); });
    hd.addEventListener('pointermove', e => { if (drag) set(at(e)); });
    hd.addEventListener('pointerup', () => drag = false); hd.addEventListener('pointercancel', () => drag = false);
    hd.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { auto = false; set(v + (e.key === 'ArrowLeft' ? -4 : 4)); e.preventDefault(); } });
    set(50);
    const loop = t => { if (!auto) return; set(50 + Math.sin((t - t0) / 1400) * 38); requestAnimationFrame(loop); };
    new IntersectionObserver(([e]) => { if (e.isIntersecting && auto) requestAnimationFrame(loop); }, {threshold: .3}).observe(cmp); }

  // existing solutions: highlight each lane in turn
  const exl = document.getElementById('exl');
  if (exl) { const ls = [...exl.children]; let i = 0; ls[0].classList.add('on');
    ls.forEach((l, k) => l.addEventListener('mouseenter', () => { ls.forEach(x => x.classList.remove('on')); l.classList.add('on'); i = k; }));
    if (!reduce) setInterval(() => { ls.forEach(x => x.classList.remove('on')); i = (i + 1) % ls.length; ls[i].classList.add('on'); }, 2600); }

  // core journey: manually selected, discrete steps
  const flData = document.getElementById('flData');
  if (flData) { const raw = JSON.parse(flData.textContent);
    const TXT = [
      ['Home', 'Taps the mic', 'Ashish starts on Home: this month’s overview, his latest Finly insight and recent payments.', 'Voice entry sits in the header, one tap from Home.', 0],
      ['Add by voice', 'Taps “Spent 300 rupees on food today”', 'He can speak, type, or tap a sample phrase. The suggestions show what Worth understands.', 'Examples teach the format without a tutorial.', 0],
      ['Review before saving', 'Taps “Review details”', 'Worth shows what it understood: expense, ₹300, Food, Today. Nothing is saved yet.', 'The user confirms before anything is stored.', 0],
      ['Confirm the category', 'Keeps Food selected', 'The amount carries over and Food is already picked, so there is nothing to fix.', 'Smart defaults: Today and UPI are already selected.', 1],
      ['Save', 'Taps “Save expense”', 'Every detail is visible on one screen before it is saved.', 'One primary action, always at the bottom.', 1],
      ['Saved', 'Taps “Done”', 'A printed receipt confirms exactly what was recorded.', 'A satisfying ending makes logging a habit.', 1],
      ['Home updates', 'Taps Budget', 'The overview updates at once, and Finly now says 93% of the Food budget is used.', 'Feedback arrives the moment a spend is logged.', 4],
      ['Budget alert', 'Taps Analysis', 'Food shows “Approaching limit” while overall spending is still on track at 78% of ₹45,000.', 'Alerts arrive before the limit, not after.', 2],
      ['What stands out', 'Taps “Ask Finly about this month”', 'Analysis explains the month in sentences: food is 37% of spending and shopping is up 439%.', 'Insights in plain words, not just charts.', 3],
      ['Ask Finly', 'Reads the answer', 'Finly explains the month from Ashish’s own data, with follow-up questions ready to tap.', 'Answers are grounded in the user’s transactions.', 4]];
    const SH = ['Home','Voice','Review','Category','Save','Receipt','Update','Alert','Insights','Finly'];
    const N = raw.length, $ = id => document.getElementById(id);
    const tap = $('flTap'), back = $('flBack'), again = $('flAgain'), feats = [...$('flF').children];
    raw.forEach((s, k) => { const img = new Image(); img.src = 'worth/f-' + s.img + '.webp'; });
    let cur = -1, front = 0;
    const show = k => { if (k === cur) return; cur = k; const s = raw[k], t = TXT[k];
      const a = $('flI' + front), b = $('flI' + (1 - front)); b.src = 'worth/f-' + s.img + '.webp'; b.classList.remove('out'); a.classList.add('out'); front = 1 - front;
      $('flN').textContent = String(k + 1).padStart(2, '0'); $('flT').textContent = t[0]; $('flA').textContent = t[1]; $('flP').textContent = t[2]; $('flU').textContent = t[3];
      feats.forEach((f, j) => f.classList.toggle('on', j === t[4]));
      if (s.tap) { tap.classList.remove('off'); tap.style.left = s.tap[0] + '%'; tap.style.top = s.tap[1] + '%'; } else tap.classList.add('off');
      back.disabled = k === 0; again.hidden = k !== N - 1; tap.setAttribute('aria-label', s.tap ? 'Tap here to continue: ' + t[1] : ''); };
    tap.setAttribute('role', 'button'); tap.tabIndex = 0;
    const next = () => { if (cur < N - 1) show(cur + 1); };
    tap.addEventListener('click', next); tap.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } });
    back.addEventListener('click', () => { if (cur > 0) show(cur - 1); }); again.addEventListener('click', () => show(0));
    show(0); }

  // Money Left demo: Week / Month / Year
  const mld = document.getElementById('mld');
  if (mld) { const D = [
      {r:'Oct 19 – 23', a:'4,664', p:61, l:'Weekly allowance', i:'₹12,013', e:'₹7,349', il:'Allowance'},
      {r:'Oct 1 – 23', a:'18,489', p:65, l:'Total income', i:'₹53,200', e:'₹34,711', il:'Income'},
      {r:'Jan 1 – Oct 23', a:'1,85,735', p:63, l:'Total income', i:'₹5,01,960', e:'₹3,16,225', il:'Income'}];
    const bs = [...mld.querySelectorAll('.ml-seg button')], th = mld.querySelector('.ml-seg i'), $$ = id => document.getElementById(id);
    const eye = $$('mlEye'), amounts = [$$('mla'), $$('mli'), $$('mle')]; let k = 1, hold = false, hidden = false;
    const applyPrivacy = () => { const d = D[k]; const dots = n => '<i class="dt"></i>'.repeat(n); amounts[0].innerHTML = hidden ? dots(6) : d.a; amounts[1].innerHTML = hidden ? dots(4) : d.i; amounts[2].innerHTML = hidden ? dots(4) : d.e;
      eye.closest('.mc').classList.toggle('hid', hidden); eye.setAttribute('aria-pressed', hidden); eye.setAttribute('aria-label', hidden ? 'Show all amounts' : 'Hide all amounts');
      eye.querySelectorAll('.eye-open').forEach(x => x.style.display = hidden ? 'none' : ''); eye.querySelector('.eye-off').style.display = hidden ? '' : 'none'; };
    const set = n => { k = n; const d = D[n], b = bs[n]; bs.forEach(x => x.classList.toggle('on', x === b));
      th.style.setProperty('--x', b.offsetLeft - 5 + 'px'); th.style.setProperty('--w', b.offsetWidth + 'px');
      const a = $$('mla'); a.style.opacity = 0; setTimeout(() => { applyPrivacy(); a.style.opacity = 1; }, 220);
      $$('mlr').textContent = d.r; $$('mlb').style.width = d.p + '%'; $$('mlp').textContent = 'Spent ' + d.p + '%'; $$('mll').textContent = d.l;
      applyPrivacy(); mld.querySelector('.mc-tl span').textContent = d.il; };
    bs.forEach((b, n) => b.addEventListener('click', () => { hold = true; set(n); }));
    eye.addEventListener('click', () => { hold = true; hidden = !hidden; applyPrivacy(); });
    requestAnimationFrame(() => set(1));
    if (!reduce) setInterval(() => { if (!hold) set((k + 1) % 3); }, 3200); }

  // daily-average ticks
  const tk = document.getElementById('tk');
  if (tk) { let s = ''; for (let i = 0; i < 23; i++) { const h = 25 + Math.abs(Math.sin(i * 2.1)) * 70 + (i % 6 === 5 ? 10 : 0); s += `<i style="--h:${h.toFixed(0)};--dl:${(i * 40)}ms"></i>`; } tk.innerHTML = s + '<i class="av" style="--h:52;--dl:1000ms;flex:0 0 4px"></i>'; }

  // looping screen carousel: centre phone grows, neighbours keep a constant visual gap
  const cr = document.getElementById('cr');
  if (cr) { const S = ['s-h-home','s-analysis','s-add-amt','s-h-budget','s-h-sav','s-finly','s-receipt','s-voice-rev2','s-tx','s-notif','s-menu'];
    const tr = cr.querySelector('.cr-t'); tr.innerHTML = S.map(n => `<div class="iph"><img src="worth/${n}.webp" alt="" loading="lazy"><span class="gl"></span></div>`).join('');
    const ps = [...tr.children], N = ps.length, W = 230, G = 56, K = .3;  // K: extra scale at centre
    const sc = t => 1 + K * Math.max(0, 1 - Math.abs(t));
    const off = t => { const a = Math.abs(t), m = Math.min(a, 1); const x = (W + G) * a + K * W * (m - m * m / 2); return Math.sign(t) * x; };
    let u = 0, last = 0, on = false;
    const tick = t => { if (!on) return; const dt = last ? Math.min(50, t - last) : 16; last = t; if (!reduce) u = (u + dt * .00016) % N;
      const cx = cr.clientWidth / 2;
      ps.forEach((p, i) => { let d = i - u; d = ((d % N) + N) % N; if (d > N / 2) d -= N;
        const s = sc(d), x = cx + off(d);
        p.style.transform = `translateX(${x.toFixed(1)}px) scale(${s.toFixed(3)})`; p.style.zIndex = Math.round(100 - Math.abs(d) * 10); p.style.opacity = Math.max(0, 1 - Math.max(0, Math.abs(d) - .6) * .3).toFixed(2); });
      requestAnimationFrame(tick); };
    new IntersectionObserver(([e]) => { on = e.isIntersecting; if (on) { last = 0; requestAnimationFrame(tick); } }).observe(cr); }

  // product states: cycle tabs + phone screen
  const stt = document.getElementById('stt');
  if (stt) { const tabs = [...stt.children], imgs = [...document.querySelectorAll('.stt-sc img')]; let i = 0, hold = false;
    const set = k => { i = k; tabs.forEach((t, j) => { t.classList.toggle('on', j === k); t.setAttribute('aria-selected', j === k); }); imgs.forEach((m, j) => m.classList.toggle('on', j === k)); };

    if (!reduce) setInterval(() => { if (!hold) set((i + 1) % tabs.length); }, 3400); }

  // progress bar
  const pr = document.getElementById('progress');

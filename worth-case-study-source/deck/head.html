<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worth Case Study</title>
<meta name="description" content="Worth: a personal finance app that shows how much money is left to spend, with fast transaction entry, clear analysis, budgets and savings goals. UX case study by Anterdeep Singh.">
<link rel="preload" href="worth/urbanist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="worth/logo.webp">
<style>
@font-face{font-family:"InterW";src:url(worth/inter-Regular.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"InterW";src:url(worth/inter-Medium.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"InterW";src:url(worth/inter-SemiBold.woff) format("woff");font-weight:600;font-display:swap}
@font-face{font-family:"Urbanist";src:url(worth/urbanist.woff2) format("woff2");font-weight:100 900;font-display:swap}
/* Worth deck — fixed 1600px canvas scaled to the viewport.
   Theme #111111, accent = Worth blue #4D84FF (used sparingly). Type: Urbanist throughout. */
:root{
  --bg:#111111;--bg2:#171717;--bg3:#0D0D0D;--card:#1D1D1D;--card2:#242424;
  --tx:#F5F5F3;--tx2:#C9CBCF;--tx3:#A3A6AB;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.16);
  --blue:#4D84FF;--blue-hi:#9CBCFF;--blue-lo:#2350E6;--mint:#8FDCA8;--coral:#F4806F;--amber:#F2B266;--teal:#5FD3C7;
  --bgrad:linear-gradient(150deg,#5f8cf0 0%,#2f62e6 45%,#1a3bb5 100%);
  --fi:"InterW","Inter",ui-sans-serif,system-ui,sans-serif;
  --f:"Urbanist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.45,.5,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:#111111}
body{margin:0;color:var(--tx);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue-hi);outline-offset:3px}
h1,h2,h3,h4,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
b,strong{font-weight:600}
svg{stroke-linecap:round;stroke-linejoin:round}

.progress{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--blue-lo),var(--blue),var(--blue-hi));z-index:60}
.backbar{position:fixed;z-index:55;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px))}
.backbar a{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 18px 0 6px;border-radius:999px;text-decoration:none;font:600 15px/1 var(--f);color:#fff;
  background:rgba(40,40,40,.72);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.12),0 12px 26px -16px rgba(0,0,0,.7);transition:transform .35s var(--ease)}
.backbar a:hover{transform:translateX(-2px)}
.backbar a i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#1E1E1E;font-style:normal}

.deck{width:1600px;margin:0 auto;zoom:var(--k,1);background:var(--bg);box-shadow:0 40px 120px -60px rgba(0,0,0,.6)}
.sl{position:relative;width:1600px;min-height:1000px;overflow:hidden;isolation:isolate;padding:60px 100px 90px;background:var(--bg)}
.sl+.sl{border-top:1px solid rgba(255,255,255,.04)}
.sl.deep{background:var(--bg2)}
/* cinematic spotlight: a soft white beam from above, used on about half the slides */
.sl.spot::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(34% 46% at var(--sx,50%) -6%,rgba(255,255,255,.2),rgba(255,255,255,.06) 48%,rgba(255,255,255,0) 72%),
    conic-gradient(from 180deg at var(--sx,50%) -10%,rgba(255,255,255,0) 166deg,rgba(255,255,255,.045) 174deg,rgba(255,255,255,.09) 180deg,rgba(255,255,255,.045) 186deg,rgba(255,255,255,0) 194deg);
  -webkit-mask:linear-gradient(180deg,#000 0%,rgba(0,0,0,.6) 45%,transparent 90%);mask:linear-gradient(180deg,#000 0%,rgba(0,0,0,.6) 45%,transparent 90%)}

/* top bar */
.tb{display:flex;align-items:center;gap:20px;height:28px;font:500 15px/1 var(--f);color:var(--tx3)}
.tb .br{display:flex;align-items:center;gap:10px;color:var(--tx);font-weight:600}
.tb .br img{width:26px;height:26px;border-radius:8px}
.tb .sec{color:var(--tx2)}
.tb .sp{flex:1;height:1px;background:var(--line);position:relative;overflow:hidden}
.tb .sp i{position:absolute;inset:0;background:linear-gradient(90deg,var(--blue),var(--blue-hi));transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform 1.6s var(--ease) .2s}
.js .tb:not(.in) .sp i{transform:scaleX(0)}
.tb .pg{color:var(--tx);font-variant-numeric:tabular-nums}

/* type */
.k{font:600 15px/1.2 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-hi)}
.h1{font:300 76px/1.02 var(--f);letter-spacing:-.03em}
.h2{font:300 60px/1.06 var(--f);letter-spacing:-.025em;text-wrap:balance}
.h1 b,.h2 b{font-weight:600}
.lead{font:400 23px/1.5 var(--f);color:var(--tx2);text-wrap:pretty}
.lead b{color:var(--tx);font-weight:600}
.body{font:400 20px/1.5 var(--f);color:var(--tx2);text-wrap:pretty}
.body b{color:var(--tx)}
.src{font:500 15px/1.4 var(--f);color:var(--tx3)}
.src a{color:var(--tx2);text-underline-offset:3px}

/* motion */
.js .r{opacity:0;transform:translateY(34px);filter:blur(8px);transition:opacity .9s var(--ease),transform 1.1s var(--ease),filter .9s var(--ease);transition-delay:var(--d,0s)}
.js .r.in{opacity:1;transform:none;filter:none}
.js .pop{opacity:0;transform:scale(.9);transition:opacity .6s var(--ease),transform .9s var(--spring);transition-delay:var(--d,0s)}
.js .in .pop,.js .pop.in{opacity:1;transform:none}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes sheen{0%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(320%) skewX(-18deg)}}

/* 3D iPhone (CSS-built, transparent background so text can sit behind it) */
.iph{--w:300px;position:relative;width:var(--w);aspect-ratio:393/852;border-radius:calc(var(--w)*.17);padding:calc(var(--w)*.032);
  background:linear-gradient(135deg,#8d9097 0%,#3b3d42 18%,#1b1c1f 50%,#45474d 82%,#9a9da4 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28),inset 0 0 0 4px #0b0b0c,0 60px 90px -30px rgba(0,0,0,.75),0 25px 40px -20px rgba(0,0,0,.6)}
.iph::before{content:"";position:absolute;inset:calc(var(--w)*.012);border-radius:inherit;background:#050506;z-index:0}
.iph img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;border-radius:calc(var(--w)*.135)}
.iph::after{content:"";position:absolute;z-index:2;top:calc(var(--w)*.062);left:50%;width:31%;height:calc(var(--w)*.088);transform:translateX(-50%);border-radius:99px;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.iph .gl{position:absolute;inset:calc(var(--w)*.032);z-index:3;border-radius:calc(var(--w)*.135);pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,255,255,.05) 100%)}
.iph .bt{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#2a2b2e,#8b8e94);z-index:-1}

/* liquid glass — static, no text: a solid shape half-covered by a frosted pane */
.lg{position:absolute;pointer-events:none}
.lg .so{position:absolute;border-radius:var(--r,34px);background:var(--bgrad);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 30px 60px -24px rgba(35,80,230,.6)}
.lg .gp{position:absolute;border-radius:var(--r,34px);background:linear-gradient(140deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 55%,rgba(255,255,255,.12));
  backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.18),0 24px 50px -20px rgba(0,0,0,.55)}

.next{padding:110px 100px;background:var(--bg3);color:#fff;font:400 22px/1.5 var(--f)}
.next b{font:500 32px/1.3 var(--f)}
</style>
</head>
<body>
<div class="progress" id="progress" aria-hidden="true"></div>
<main class="deck" id="deck">
